# 格式說明見 ../README.md（規格格式 v1）。本檔是律法（spec 類），修改需要修法紀錄與簽章。
#
# 每個範例的 basis 指向 usecases.yaml 或 model.yaml 的規則 id。
# basis 裡只要有一條規則是 proposed，這個範例就還不能當驗收依據。
spec_version: 2
kind: examples
aggregate: ReviewProject

actors:
  manager_h1:  { user: u-m1, roles: [HOSPITAL_MANAGER], hospital: H-01 }
  manager_h2:  { user: u-m2, roles: [HOSPITAL_MANAGER], hospital: H-02 }
  reviewer_h1: { user: u-r1, roles: [REVIEWER],         hospital: H-01 }
  rereviewer_h1: { user: u-rr1, roles: [REREVIEWER],   hospital: H-01 }
  auditor_h1:  { user: u-au1, roles: [AUDITOR],          hospital: H-01 }
  admin:       { user: u-a1, roles: [SYSTEM_ADMIN],     hospital: H-09 }

# 可重複使用的準備步驟。
fixtures:
  # 有品質線，綁定評分表後就可以發布（RP-PUB-04）。
  draft_project:
    steps:
      - run: CreateReviewProject
        as: manager_h1
        input: { name: "門診品質審查", description: "2026 年度", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5 }
        save: { p: projectId }

  # 評分表要有至少一個題目才能發布（SS-PUB-02）
  published_score_sheet:
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    steps:
      - use: draft_project
      - run: CreateScoreSheetDraft
        as: manager_h1
        input: { projectId: "${p}" }
        save: { s: scoreSheetId }
      - run: UpdateScoreSheetDraft
        as: manager_h1
        input:
          scoreSheetId: "${s}"
          addSections:
            - sectionId: S1
              title: "完整性"
              items:
                - { itemId: I1, code: record-complete, title: "病歷完整性", scoreType: FIXED, maxScore: "20", weight: "1", requiredRule: ALWAYS_REQUIRED }
      - run: PublishScoreSheetVersion
        as: manager_h1
        input: { scoreSheetId: "${s}" }
        save: { sv: scoreSheetVersionId }

  bound_project:
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    steps:
      - use: published_score_sheet
      - run: BindScoreSheetToProject
        as: manager_h1
        input: { projectId: "${p}", scoreSheetVersionId: "${sv}" }

  published_project:
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    steps:
      - use: bound_project
      - run: PublishReviewProjectVersion
        as: manager_h1
        input: { projectId: "${p}" }

  active_project:
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    steps:
      - use: published_project
      - run: ActivateReviewProject
        as: manager_h1
        input: { projectId: "${p}" }

examples:

  # ---------- CreateReviewProject ----------

  - name: creates_a_draft_project
    basis: [RP-CRT-S1, RP-CRT-S2, RP-CRT-S3, RP-CRT-S4, RP-CRT-S5]
    derived_from: [TS-PV-001]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", description: "2026 年度", medicalRecordTypes: [OUTPATIENT] }
      save: { p: projectId }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewProjectCreated, with: { projectId: "${p}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect:
          result: SUCCESS
          output:
            hospitalId: H-01
            name: "門診品質審查"
            description: "2026 年度"
            medicalRecordTypes: [OUTPATIENT]
            status: DRAFT
            versionNo: 1
            versionPublished: false
            initialReviewWeight: "0.50"
            rereviewWeight: "0.50"

  - name: rejects_create_by_a_non_manager
    basis: [RP-G-01]
    derived_from: [TS-PV-002]
    when:
      run: CreateReviewProject
      as: reviewer_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_create_with_a_blank_name
    basis: [RP-CRT-01]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "   ", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: creates_a_project_with_given_scoring_inputs
    basis: [RP-CRT-S4, RP-CRT-S5]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "住院品質審查", medicalRecordTypes: [INPATIENT], qualityThreshold: 7, initialReviewWeight: "0.70" }
      save: { p: projectId }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect:
          result: SUCCESS
          output: { qualityThreshold: 7, initialReviewWeight: "0.70", rereviewWeight: "0.50" }

  - name: rejects_create_without_any_medical_record_type
    basis: [RP-CRT-02]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [] }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_create_with_a_quality_threshold_above_ten
    basis: [RP-CRT-03]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 11 }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_create_with_a_quality_threshold_below_one
    basis: [RP-CRT-03]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 0 }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_create_with_a_fractional_quality_threshold
    basis: [RP-CRT-03]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5.5 }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  # ---------- UpdateReviewProjectDraft ----------

  - name: updates_a_draft_project
    basis: [RP-UPD-S1, RP-UPD-S2]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "住院品質審查", description: "修訂", medicalRecordTypes: [INPATIENT, EMERGENCY] }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewProjectDraftUpdated, with: { projectId: "${p}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect:
          result: SUCCESS
          output:
            name: "住院品質審查"
            description: "修訂"
            medicalRecordTypes: [INPATIENT, EMERGENCY]
            qualityThreshold: null
            status: DRAFT
            versionNo: 1
            versionPublished: false

  - name: rejects_update_with_a_blank_name
    basis: [RP-UPD-02]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { name: "門診品質審查" } }

  - name: rejects_update_without_any_medical_record_type
    basis: [RP-UPD-03]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [] }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { medicalRecordTypes: [OUTPATIENT] } }

  - name: rejects_update_with_a_quality_threshold_out_of_range
    basis: [RP-UPD-04]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 11 }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { qualityThreshold: 5 } }

  - name: update_resets_weights_that_are_not_given
    basis: [RP-UPD-S3]
    given:
      - use: draft_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], initialReviewWeight: "0.70", rereviewWeight: "0.30" }
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], rereviewWeight: "0.40" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { initialReviewWeight: "0.50", rereviewWeight: "0.40" } }

  - name: rejects_update_from_another_hospital
    basis: [RP-G-03]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h2
      input: { projectId: "${p}", name: "被改掉", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { name: "門診品質審查" } }

  - name: rejects_update_of_an_unknown_project
    basis: [RP-G-02]
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "no-such-project", name: "任意", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: PROJECT_NOT_FOUND }

  - name: rejects_update_after_the_version_is_published
    basis: [RP-UPD-01, RP-INV-01]
    derived_from: [EX-018, TS-PV-004]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "被改掉", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { name: "門診品質審查", versionPublished: true } }

  # ---------- BindScoreSheetToProject ----------
  # 綁定成功（RP-BND-S1）只能透過「之後可以發布」觀察：專案詳情的輸出沒有評分表版本（D-043）。

  - name: binding_a_published_score_sheet_allows_publishing
    basis: [RP-BND-S1, RP-BND-S2, RP-PUB-S1]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_score_sheet
    when:
      run: BindScoreSheetToProject
      as: manager_h1
      input: { projectId: "${p}", scoreSheetVersionId: "${sv}" }
    then:
      result: SUCCESS
      emits:
        - { event: ScoreSheetBoundToProject, with: { projectId: "${p}", scoreSheetVersionId: "${sv}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect:
          result: SUCCESS
          output: { status: DRAFT, versionNo: 1, versionPublished: false }
      - run: PublishReviewProjectVersion
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS }

  - name: rejects_bind_by_a_non_manager
    basis: [RP-G-01]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_score_sheet
    when:
      run: BindScoreSheetToProject
      as: reviewer_h1
      input: { projectId: "${p}", scoreSheetVersionId: "${sv}" }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_bind_to_another_hospitals_project
    basis: [RP-G-03]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_score_sheet
    when:
      run: BindScoreSheetToProject
      as: manager_h2
      input: { projectId: "${p}", scoreSheetVersionId: "${sv}" }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }

  - name: rejects_bind_after_the_version_is_published
    basis: [RP-BND-01]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_project
    when:
      run: BindScoreSheetToProject
      as: manager_h1
      input: { projectId: "${p}", scoreSheetVersionId: "${sv}" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }

  - name: rejects_bind_of_an_unknown_score_sheet_version
    basis: [RP-BND-02]
    given:
      - use: draft_project
    when:
      run: BindScoreSheetToProject
      as: manager_h1
      input: { projectId: "${p}", scoreSheetVersionId: "no-such-version" }
    then: { result: REJECTED, code: SCORE_SHEET_NOT_FOUND }

  - name: rejects_bind_of_another_projects_score_sheet_version
    basis: [RP-BND-02]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_score_sheet
      - run: CreateReviewProject
        as: manager_h1
        input: { name: "住院品質審查", medicalRecordTypes: [INPATIENT], qualityThreshold: 5 }
        save: { other: projectId }
    when:
      run: BindScoreSheetToProject
      as: manager_h1
      input: { projectId: "${other}", scoreSheetVersionId: "${sv}" }
    then: { result: REJECTED, code: SCORE_SHEET_NOT_FOUND }

  # ---------- PublishReviewProjectVersion ----------

  - name: rejects_publish_without_a_bound_score_sheet
    basis: [RP-PUB-02]
    given:
      - use: draft_project
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { versionPublished: false } }

  - name: publishes_the_draft_version
    basis: [RP-PUB-S1, RP-PUB-S2]
    derived_from: [TS-PV-003]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: bound_project
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewProjectVersionPublished, with: { projectId: "${p}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT, versionNo: 1, versionPublished: true } }

  - name: rejects_publish_when_weights_do_not_sum_to_one
    basis: [RP-PUB-03, RP-INV-02]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: bound_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5, initialReviewWeight: "0.60", rereviewWeight: "0.30" }
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { versionPublished: false } }

  # 相加為 1.00，但 initialReviewWeight 不大於 0。
  - name: rejects_publish_when_a_weight_is_zero
    basis: [RP-PUB-03, RP-INV-02]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: bound_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5, initialReviewWeight: "0.00", rereviewWeight: "1.00" }
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }

  - name: rejects_publish_without_a_quality_threshold
    basis: [RP-PUB-04]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: bound_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT] }
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { versionPublished: false } }

  - name: rejects_weight_change_after_the_version_is_published
    basis: [RP-INV-03, RP-UPD-01]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5, initialReviewWeight: "0.70", rereviewWeight: "0.30" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { initialReviewWeight: "0.50", rereviewWeight: "0.50" } }

  - name: rejects_publish_of_an_already_published_version
    basis: [RP-PUB-01]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_project
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT, versionNo: 1, versionPublished: true } }

  # ---------- ActivateReviewProject ----------

  - name: rejects_activate_before_any_version_is_published
    basis: [RP-ACT-03]
    given:
      - use: draft_project
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT } }

  - name: activates_a_published_project
    basis: [RP-T-01, RP-ACT-S1]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: published_project
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewProjectActivated, with: { projectId: "${p}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: ACTIVE } }

  - name: activating_an_active_project_changes_nothing
    basis: [RP-ACT-01]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: active_project
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewProjectActivated, with: { projectId: "${p}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: ACTIVE } }

  # ---------- DeactivateReviewProject ----------

  - name: rejects_deactivate_of_a_draft_project
    basis: [RP-DEA-02]
    given:
      - use: draft_project
    when:
      run: DeactivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT } }

  - name: deactivates_an_active_project
    basis: [RP-T-02, RP-DEA-S1]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: active_project
    when:
      run: DeactivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewProjectDeactivated, with: { projectId: "${p}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DEACTIVATED } }

  - name: deactivating_a_deactivated_project_changes_nothing
    basis: [RP-DEA-01]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: active_project
      - run: DeactivateReviewProject
        as: manager_h1
        input: { projectId: "${p}" }
    when:
      run: DeactivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewProjectDeactivated, with: { projectId: "${p}", hospitalId: H-01 } }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DEACTIVATED } }

  - name: reactivates_a_deactivated_project
    basis: [RP-T-03, RP-ACT-S1]
    needs: [CreateScoreSheetDraft, UpdateScoreSheetDraft, PublishScoreSheetVersion]
    given:
      - use: active_project
      - run: DeactivateReviewProject
        as: manager_h1
        input: { projectId: "${p}" }
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: ACTIVE } }

# 這些規則目前沒有辦法用範例驗證，原因各自列出。
  # ---------- D-051：REVIEWER／REREVIEWER 不能讀專案 ----------
  #
  # 用途：讓 D-051「不開放」有可執行的驗證，而不只是文件上的一句話。
  # - 能抓到的是實作端放寬：程式的角色檢查若開放這兩個角色，這兩個範例會變紅。
  # - 抓不到的是只改規格：執行器不讀 actor.roles，只執行程式並比對 then。只把角色加進
  #   actor.roles 而不改程式，這兩個範例仍然通過；那種修改要靠修法審查發現（規格與範例會互相矛盾）。
  # - 2026-11-15 加入時程式已經拒絕這兩個角色，所以一加入就通過，不在已知失敗清單上。
  # - 只涵蓋專案詳情。其餘三支不在 specs/review-project 的範圍內，由實作端的測試涵蓋（PR #32）：
  #   專案列表、抽選批次列表與詳情都有 REVIEWER、REREVIEWER 被拒的參數化測試
  #   （ListReviewProjectsUseCaseTest、SamplingUseCaseTest；詳情包含存在與不存在的批次）。
  # - 日後若重新裁決、開放某個範圍，要同時修改或刪除這兩個範例。

  - name: rejects_project_detail_for_a_reviewer
    basis: [RP-G-01]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectDetail
      as: reviewer_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_project_detail_for_a_rereviewer
    basis: [RP-G-01]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectDetail
      as: rereviewer_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: ROLE_DENIED }

  # ---------- ListReviewProjects（D-062） ----------

  - name: lists_only_own_hospital_projects
    basis: [RP-LST-01]
    given:
      - use: draft_project
      - run: CreateReviewProject
        as: manager_h2
        input: { name: "住院品質審查", description: "H-02", medicalRecordTypes: [INPATIENT], qualityThreshold: 5 }
        save: { p2: projectId }
    when:
      run: ListReviewProjects
      as: manager_h1
      input: { hospitalId: H-02 }
    then: { result: SUCCESS }
    observe:
      - run: ListReviewProjects
        as: manager_h1
        input: { hospitalId: H-02 }
        expect:
          result: SUCCESS
          output:
            items:
              - { projectId: "${p}", hospitalId: H-01 }

  - name: system_admin_lists_one_hospital
    basis: [RP-LST-02]
    given:
      - use: draft_project
      - run: CreateReviewProject
        as: manager_h2
        input: { name: "住院品質審查", description: "H-02", medicalRecordTypes: [INPATIENT], qualityThreshold: 5 }
        save: { p2: projectId }
    when:
      run: ListReviewProjects
      as: admin
      input: { hospitalId: H-02 }
    then: { result: SUCCESS }
    observe:
      - run: ListReviewProjects
        as: admin
        input: { hospitalId: H-02 }
        expect:
          result: SUCCESS
          output:
            items:
              - { projectId: "${p2}", hospitalId: H-02 }

  - name: rejects_project_list_for_a_reviewer
    basis: [RP-G-01]
    when:
      run: ListReviewProjects
      as: reviewer_h1
    then: { result: REJECTED, code: ROLE_DENIED }

  # ---------- GetReviewProjectVersion（D-062） ----------

  - name: reads_draft_project_version
    basis: [RP-G-01]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectVersion
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { versionNo: 1, published: false } }

  - name: auditor_reads_project_version
    basis: [RP-G-01]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectVersion
      as: auditor_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }

  - name: rejects_project_version_from_another_hospital
    basis: [RP-G-03]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectVersion
      as: manager_h2
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }

  - name: rejects_project_version_for_a_reviewer
    basis: [RP-G-01]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectVersion
      as: reviewer_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_unknown_project_version
    basis: [RP-G-02]
    when:
      run: GetReviewProjectVersion
      as: manager_h1
      input: { projectId: NO-SUCH-PROJECT }
    then: { result: REJECTED, code: PROJECT_NOT_FOUND }

  # ---------- 必填的輸入（D-088 第 11 點，H-6） ----------
  # 請求 dto 的必填檢查交給 use case：這些範例直接呼叫 use case，確認沒有 dto 也會拒絕。

  - name: rejects_binding_without_a_score_sheet_version
    basis: [RP-BND-04]
    given: [{ use: published_score_sheet }]
    when: { run: BindScoreSheetToProject, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_creating_a_project_without_a_name
    basis: [RP-CRT-01]
    when: { run: CreateReviewProject, as: manager_h1, input: { description: "2026 年度", medicalRecordTypes: [OUTPATIENT] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  # ---------- 請求端（D-089；格式 v2.1） ----------
  # 本文的列舉由 use case 檢查，角色在前（D-024）。經過 HTTP 的成功範例確認請求的欄位名稱有傳到 use case；
  # 業務規則仍由上面的 use case 範例驗證。

  - name: checks_the_role_before_the_record_type
    basis: [RP-G-01, RP-CRT-04]
    when:
      http:
        method: POST
        path: /review-projects
        body: { name: "門診品質審查", medicalRecordTypes: [NOT_A_TYPE] }
      as: reviewer_h1
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_an_unknown_record_type
    basis: [RP-CRT-04]
    when:
      http:
        method: POST
        path: /review-projects
        body: { name: "門診品質審查", medicalRecordTypes: [NOT_A_TYPE] }
      as: manager_h1
    then: { result: REJECTED, code: BAD_REQUEST }

  - name: rejects_an_unknown_record_type_in_an_update
    basis: [RP-UPD-05]
    given: [{ use: draft_project }]
    when:
      http:
        method: PUT
        path: "/review-projects/${p}"
        body: { name: "住院品質審查", medicalRecordTypes: [NOT_A_TYPE] }
      as: manager_h1
    then: { result: REJECTED, code: BAD_REQUEST }

  - name: creates_a_project_over_http
    basis: [RP-CRT-01]
    when:
      http:
        method: POST
        path: /review-projects
        body: { name: "門診品質審查", description: "2026 年度", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5 }
      as: manager_h1
    then: { result: SUCCESS, output: { status: DRAFT } }

  - name: updates_a_project_over_http
    basis: [RP-UPD-02]
    given: [{ use: draft_project }]
    when:
      http:
        method: PUT
        path: "/review-projects/${p}"
        body: { name: "住院品質審查", description: "修訂", medicalRecordTypes: [INPATIENT] }
      as: manager_h1
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { name: "住院品質審查", description: "修訂" } }

  - name: binds_a_score_sheet_over_http
    basis: [RP-BND-04]
    given: [{ use: published_score_sheet }]
    when:
      http:
        method: POST
        path: "/review-projects/${p}/bind-score-sheet"
        body: { scoreSheetVersionId: "${sv}" }
      as: manager_h1
    then: { result: SUCCESS }

  - name: lists_projects_of_a_requested_hospital_over_http
    basis: [RP-LST-01]
    given: [{ use: draft_project }]
    when:
      http:
        method: GET
        path: /review-projects
        query: { hospitalId: H-01 }
      as: admin
    then: { result: SUCCESS, output: { "items[projectId=${p}]": { hospitalId: H-01 } } }

not_covered:
  - rules: [RP-INV-04]
    reason: 由抽選的 use case 執行，不在本次範圍
  - rules: [RP-BND-03]
    reason: >
      評分表版本 id 在發布時才產生（D-050 第 1 點），範例拿不到「尚未發布的版本 id」。
      要等「建立新的草稿版本」定案（D-050 第 1 點、D-040 Pending）才寫得出範例
  - rules: [RP-BND-S1]
    reason: >
      只驗證到一部分：binding_a_published_score_sheet_allows_publishing 只觀察到「綁定後可以發布」。
      「參照等於輸入」與「重新綁定會取代舊值」都看不到，因為專案詳情的輸出沒有評分表版本參照（D-043），
      綁錯版本或重新綁定時保留舊值，這組範例都抓不到。要由實作端的白箱測試驗證，
      或等有查詢能讀到這個參照時（例如抽選使用的評分表版本）再補範例
