# 格式說明見 ../README.md（規格格式 v1）。本檔是律法（spec 類），修改需要修法紀錄與簽章。
#
# 每個範例的 basis 指向 usecases.yaml 或 model.yaml 的規則 id。
# basis 裡只要有一條規則是 proposed，這個範例就還不能當驗收依據。
spec_version: 1
kind: examples
aggregate: ReviewProject

actors:
  manager_h1:  { user: u-m1, roles: [HOSPITAL_MANAGER], hospital: H-01 }
  manager_h2:  { user: u-m2, roles: [HOSPITAL_MANAGER], hospital: H-02 }
  reviewer_h1: { user: u-r1, roles: [REVIEWER],         hospital: H-01 }
  rereviewer_h1: { user: u-rr1, roles: [REREVIEWER],   hospital: H-01 }

# 可重複使用的準備步驟。
fixtures:
  # 有品質線，綁定評分表後就可以發布（RP-PUB-04）。
  draft_project:
    steps:
      - run: CreateReviewProject
        as: manager_h1
        input: { name: "門診品質審查", description: "2026 年度", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5 }
        save: { p: projectId }

  bound_project:
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    steps:
      - use: draft_project
      - run: CreateScoreSheetDraft
        as: manager_h1
        input_pending: 評分表的規格尚未轉換
        save: { s: scoreSheetId }
      - run: PublishScoreSheetVersion
        as: manager_h1
        input: { scoreSheetId: "${s}" }
        save: { sv: scoreSheetVersionId }
      - run: BindScoreSheetToProject
        as: manager_h1
        input: { projectId: "${p}", scoreSheetVersionId: "${sv}" }

  published_project:
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    steps:
      - use: bound_project
      - run: PublishReviewProjectVersion
        as: manager_h1
        input: { projectId: "${p}" }

  active_project:
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    steps:
      - use: published_project
      - run: ActivateReviewProject
        as: manager_h1
        input: { projectId: "${p}" }

examples:

  # ---------- CreateReviewProject ----------

  - name: creates_a_draft_project
    basis: [RP-CRT-S1, RP-CRT-S2, RP-CRT-S3, RP-CRT-S4, RP-CRT-S5]
    derived_from: [TS-PV-001]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", description: "2026 年度", medicalRecordTypes: [OUTPATIENT] }
      save: { p: projectId }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect:
          result: SUCCESS
          output:
            hospitalId: H-01
            name: "門診品質審查"
            description: "2026 年度"
            medicalRecordTypes: [OUTPATIENT]
            status: DRAFT
            versionNo: 1
            versionPublished: false
            initialReviewWeight: "0.50"
            rereviewWeight: "0.50"

  - name: rejects_create_by_a_non_manager
    basis: [RP-G-01]
    derived_from: [TS-PV-002]
    when:
      run: CreateReviewProject
      as: reviewer_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_create_with_a_blank_name
    basis: [RP-CRT-01]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "   ", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: creates_a_project_with_given_scoring_inputs
    basis: [RP-CRT-S4, RP-CRT-S5]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "住院品質審查", medicalRecordTypes: [INPATIENT], qualityThreshold: 7, initialReviewWeight: "0.70" }
      save: { p: projectId }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect:
          result: SUCCESS
          output: { qualityThreshold: 7, initialReviewWeight: "0.70", rereviewWeight: "0.50" }

  - name: rejects_create_without_any_medical_record_type
    basis: [RP-CRT-02]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [] }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_create_with_a_quality_threshold_above_ten
    basis: [RP-CRT-03]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 11 }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_create_with_a_quality_threshold_below_one
    basis: [RP-CRT-03]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 0 }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_create_with_a_fractional_quality_threshold
    basis: [RP-CRT-03]
    when:
      run: CreateReviewProject
      as: manager_h1
      input: { name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5.5 }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  # ---------- UpdateReviewProjectDraft ----------

  - name: updates_a_draft_project
    basis: [RP-UPD-S1, RP-UPD-S2]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "住院品質審查", description: "修訂", medicalRecordTypes: [INPATIENT, EMERGENCY] }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect:
          result: SUCCESS
          output:
            name: "住院品質審查"
            description: "修訂"
            medicalRecordTypes: [INPATIENT, EMERGENCY]
            qualityThreshold: null
            status: DRAFT
            versionNo: 1
            versionPublished: false

  - name: rejects_update_with_a_blank_name
    basis: [RP-UPD-02]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { name: "門診品質審查" } }

  - name: rejects_update_without_any_medical_record_type
    basis: [RP-UPD-03]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [] }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { medicalRecordTypes: [OUTPATIENT] } }

  - name: rejects_update_with_a_quality_threshold_out_of_range
    basis: [RP-UPD-04]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 11 }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { qualityThreshold: 5 } }

  - name: update_resets_weights_that_are_not_given
    basis: [RP-UPD-S3]
    given:
      - use: draft_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], initialReviewWeight: "0.70", rereviewWeight: "0.30" }
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], rereviewWeight: "0.40" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { initialReviewWeight: "0.50", rereviewWeight: "0.40" } }

  - name: rejects_update_from_another_hospital
    basis: [RP-G-03]
    given:
      - use: draft_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h2
      input: { projectId: "${p}", name: "被改掉", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { name: "門診品質審查" } }

  - name: rejects_update_of_an_unknown_project
    basis: [RP-G-02]
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "no-such-project", name: "任意", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: PROJECT_NOT_FOUND }

  - name: rejects_update_after_the_version_is_published
    basis: [RP-UPD-01, RP-INV-01]
    derived_from: [EX-018, TS-PV-004]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: published_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "被改掉", medicalRecordTypes: [OUTPATIENT] }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { name: "門診品質審查", versionPublished: true } }

  # ---------- PublishReviewProjectVersion ----------

  - name: rejects_publish_without_a_bound_score_sheet
    basis: [RP-PUB-02]
    given:
      - use: draft_project
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { versionPublished: false } }

  - name: publishes_the_draft_version
    basis: [RP-PUB-S1, RP-PUB-S2]
    derived_from: [TS-PV-003]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: bound_project
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT, versionNo: 1, versionPublished: true } }

  - name: rejects_publish_when_weights_do_not_sum_to_one
    basis: [RP-PUB-03, RP-INV-02]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: bound_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5, initialReviewWeight: "0.60", rereviewWeight: "0.30" }
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { versionPublished: false } }

  # 相加為 1.00，但 initialReviewWeight 不大於 0。
  - name: rejects_publish_when_a_weight_is_zero
    basis: [RP-PUB-03, RP-INV-02]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: bound_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5, initialReviewWeight: "0.00", rereviewWeight: "1.00" }
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }

  - name: rejects_publish_without_a_quality_threshold
    basis: [RP-PUB-04]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: bound_project
      - run: UpdateReviewProjectDraft
        as: manager_h1
        input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT] }
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { versionPublished: false } }

  - name: rejects_weight_change_after_the_version_is_published
    basis: [RP-INV-03, RP-UPD-01]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: published_project
    when:
      run: UpdateReviewProjectDraft
      as: manager_h1
      input: { projectId: "${p}", name: "門診品質審查", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5, initialReviewWeight: "0.70", rereviewWeight: "0.30" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { initialReviewWeight: "0.50", rereviewWeight: "0.50" } }

  - name: rejects_publish_of_an_already_published_version
    basis: [RP-PUB-01]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: published_project
    when:
      run: PublishReviewProjectVersion
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT, versionNo: 1, versionPublished: true } }

  # ---------- ActivateReviewProject ----------

  - name: rejects_activate_before_any_version_is_published
    basis: [RP-ACT-03]
    given:
      - use: draft_project
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT } }

  - name: activates_a_published_project
    basis: [RP-T-01, RP-ACT-S1]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: published_project
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: ACTIVE } }

  - name: activating_an_active_project_changes_nothing
    basis: [RP-ACT-01]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: active_project
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: ACTIVE } }

  # ---------- DeactivateReviewProject ----------

  - name: rejects_deactivate_of_a_draft_project
    basis: [RP-DEA-02]
    given:
      - use: draft_project
    when:
      run: DeactivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DRAFT } }

  - name: deactivates_an_active_project
    basis: [RP-T-02, RP-DEA-S1]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: active_project
    when:
      run: DeactivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DEACTIVATED } }

  - name: deactivating_a_deactivated_project_changes_nothing
    basis: [RP-DEA-01]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: active_project
      - run: DeactivateReviewProject
        as: manager_h1
        input: { projectId: "${p}" }
    when:
      run: DeactivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: DEACTIVATED } }

  - name: reactivates_a_deactivated_project
    basis: [RP-T-03, RP-ACT-S1]
    needs: [CreateScoreSheetDraft, PublishScoreSheetVersion, BindScoreSheetToProject]
    given:
      - use: active_project
      - run: DeactivateReviewProject
        as: manager_h1
        input: { projectId: "${p}" }
    when:
      run: ActivateReviewProject
      as: manager_h1
      input: { projectId: "${p}" }
    then: { result: SUCCESS }
    observe:
      - run: GetReviewProjectDetail
        as: manager_h1
        input: { projectId: "${p}" }
        expect: { result: SUCCESS, output: { status: ACTIVE } }

# 這些規則目前沒有辦法用範例驗證，原因各自列出。
  # ---------- D-051：REVIEWER／REREVIEWER 不能讀專案 ----------

  - name: rejects_project_detail_for_a_reviewer
    basis: [RP-G-01]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectDetail
      as: reviewer_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_project_detail_for_a_rereviewer
    basis: [RP-G-01]
    given:
      - use: draft_project
    when:
      run: GetReviewProjectDetail
      as: rereviewer_h1
      input: { projectId: "${p}" }
    then: { result: REJECTED, code: ROLE_DENIED }

not_covered:
  - rules: [emits]
    reason: >
      範圍內沒有查詢看得到 event。要驗證 event，得透過稽核軌跡的查詢（不在本次範圍），
      或由實作端的白箱測試負責
  - rules: [RP-INV-04]
    reason: 由抽選的 use case 執行，不在本次範圍
