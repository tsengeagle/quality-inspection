# 格式說明見 ../README.md（規格格式 v2.0，第十節）。本檔是律法（spec 類），修改需要修法紀錄與簽章。
#
# 每個範例的 basis 指向 usecases.yaml、model.yaml 或其他目錄的規則 id。
# basis 裡只要有一條規則是 proposed，這個範例就還不能當驗收依據。
# 沒有寫 clock 的範例從 spec-profile.yaml 的 clock_start（2026-11-19T17:00:00+08:00）開始。
spec_version: 2
kind: examples
aggregate: ReviewCase

actors:
  manager_h1:    { user: u-m1,  roles: [HOSPITAL_MANAGER],     hospital: H-01 }
  manager_h2:    { user: u-m2,  roles: [HOSPITAL_MANAGER],     hospital: H-02 }
  reviewer_h1:   { user: u-r1,  roles: [REVIEWER],             hospital: H-01 }
  reviewer2_h1:  { user: u-r2,  roles: [REVIEWER],             hospital: H-01 }
  rereviewer_h1: { user: u-rr1, roles: [REREVIEWER],           hospital: H-01 }
  rereviewer2_h1: { user: u-rr2, roles: [REREVIEWER],          hospital: H-01 }
  auditor_h1:    { user: u-au1, roles: [AUDITOR],              hospital: H-01 }
  admin:         { user: u-a1,  roles: [SYSTEM_ADMIN],         hospital: H-09 }
  dual_role_h1:  { user: u-d1,  roles: [REVIEWER, REREVIEWER], hospital: H-01 }
  dual_role_h2:  { user: u-d2,  roles: [REVIEWER, REREVIEWER], hospital: H-02 }
  # D-071：同一個使用者 u-rr1 以 AUDITOR 角色登入（當時沒有 REREVIEWER 角色）。
  rr1_as_auditor_h1: { user: u-rr1, roles: [AUDITOR],         hospital: H-01 }
  # D-084：同一個使用者 u-rr2 以 AUDITOR 角色登入，用來做出「先讀過初審、之後才受派」。
  rr2_as_auditor_h1: { user: u-rr2, roles: [AUDITOR],         hospital: H-01 }

fixtures:
  # 矩陣的 state 欄用 case_in_<狀態> 找到準備步驟。
  case_in_SELECTED_PENDING_ASSIGNMENT:
    steps:
      - use: review-project.active_project
      - port: sampling-batch.CandidateSource.queryCandidates
        returns:
          - { sourceCaseKey: MR-001, hospitalId: H-01, medicalRecordType: OUTPATIENT }
      - run: sampling-batch.ExecuteSampling
        as: manager_h1
        input: { projectId: "${p}" }
        save: { b: batchId }
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        save: { c: "content[0].caseId" }

  case_in_PENDING_INITIAL_REVIEW:
    steps:
      - use: case_in_SELECTED_PENDING_ASSIGNMENT
      - run: AssignReviewCase
        as: manager_h1
        input: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" }

  case_in_INITIAL_REVIEW_IN_PROGRESS:
    steps:
      - use: case_in_PENDING_INITIAL_REVIEW
      - run: StartInitialReview
        as: reviewer_h1
        input: { caseId: "${c}" }
        save: { s1: submissionId }

  answered_case:
    steps:
      - use: case_in_INITIAL_REVIEW_IN_PROGRESS
      - run: SaveInitialReviewDraft
        as: reviewer_h1
        input:
          caseId: "${c}"
          answers: [{ itemId: I1, answerValue: "20" }]
          comment: "初審評語"

  case_in_INITIAL_REVIEW_COMPLETED:
    steps:
      - use: answered_case
      - run: SubmitInitialReview
        as: reviewer_h1
        input: { caseId: "${c}" }

  # 複審切片（D-069）。專案的品質線是 5（review-project.draft_project）。
  # review-project 的評分表只有一個 FIXED 題目（滿分 20），作答就得 20 分：固定時一定自動進複審。
  # 要留在 INITIAL_REVIEW_COMPLETED，另建一個專案，題目是 RANGE（依作答給分），初審作答 5 分（不大於品質線）。
  low_score_completed_case:
    steps:
      - run: review-project.CreateReviewProject
        as: manager_h1
        input: { name: "門診品質審查", description: "2026 年度", medicalRecordTypes: [OUTPATIENT], qualityThreshold: 5 }
        save: { p: projectId }
      - run: score-sheet.CreateScoreSheetDraft
        as: manager_h1
        input: { projectId: "${p}" }
        save: { s: scoreSheetId }
      - run: score-sheet.UpdateScoreSheetDraft
        as: manager_h1
        input:
          scoreSheetId: "${s}"
          addSections:
            - sectionId: S1
              title: "完整性"
              items:
                - { itemId: I1, code: record-complete, title: "病歷完整性", scoreType: RANGE, maxScore: "20", weight: "1", requiredRule: ALWAYS_REQUIRED }
      - run: score-sheet.PublishScoreSheetVersion
        as: manager_h1
        input: { scoreSheetId: "${s}" }
        save: { sv: scoreSheetVersionId }
      - run: review-project.BindScoreSheetToProject
        as: manager_h1
        input: { projectId: "${p}", scoreSheetVersionId: "${sv}" }
      - run: review-project.PublishReviewProjectVersion
        as: manager_h1
        input: { projectId: "${p}" }
      - run: review-project.ActivateReviewProject
        as: manager_h1
        input: { projectId: "${p}" }
      - port: sampling-batch.CandidateSource.queryCandidates
        returns:
          - { sourceCaseKey: MR-002, hospitalId: H-01, medicalRecordType: OUTPATIENT }
      - run: sampling-batch.ExecuteSampling
        as: manager_h1
        input: { projectId: "${p}" }
        save: { b: batchId }
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        save: { c: "content[0].caseId" }
      - run: AssignReviewCase
        as: manager_h1
        input: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" }
      - run: StartInitialReview
        as: reviewer_h1
        input: { caseId: "${c}" }
        save: { s1: submissionId }
      - run: SaveInitialReviewDraft
        as: reviewer_h1
        input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "5" }], comment: "初審評語" }
      - run: SubmitInitialReview
        as: reviewer_h1
        input: { caseId: "${c}" }

  low_score_fixed_case:
    steps:
      - use: low_score_completed_case
      - run: FixInitialReview
        as: reviewer_h1
        input: { caseId: "${c}", submissionId: "${s1}" }

  # D-070（E-3-2）：加權看得出來的複審。RANGE 題目的專案，初審 5 分（不進複審），手工送複審，複審作答 15 分。
  # 專案沒有輸入權重，用預設的 0.50／0.50：finalScore = 5 × 0.50 + 15 × 0.50 = 10.00。
  weighted_rereview_answered:
    steps:
      - use: low_score_fixed_case
      - run: SendToRereview
        as: manager_h1
        input: { caseId: "${c}" }
      - run: AssignRereviewer
        as: manager_h1
        input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" }
      - run: StartRereview
        as: rereviewer_h1
        input: { caseId: "${c}" }
        save: { s2: submissionId }
      - run: SaveRereviewDraft
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "15" }], comment: "複審評語" }

  case_in_PENDING_REREVIEW:
    steps:
      - use: case_in_INITIAL_REVIEW_COMPLETED
      - run: FixInitialReview
        as: reviewer_h1
        input: { caseId: "${c}", submissionId: "${s1}" }

  rereviewer_assigned:
    steps:
      - use: case_in_PENDING_REREVIEW
      - run: AssignRereviewer
        as: manager_h1
        input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" }

  case_in_REREVIEW_IN_PROGRESS:
    steps:
      - use: rereviewer_assigned
      - run: StartRereview
        as: rereviewer_h1
        input: { caseId: "${c}" }
        save: { s2: submissionId }

  rereview_answered:
    steps:
      - use: case_in_REREVIEW_IN_PROGRESS
      - run: SaveRereviewDraft
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "10" }], comment: "複審評語" }

  rereview_submitted:
    steps:
      - use: rereview_answered
      - run: SubmitRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" }

  case_in_CLOSED:
    steps:
      - use: rereview_submitted
      - run: CloseRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}" }

  # D-080：退回、取消的案件。
  case_in_RETURNED:
    steps:
      - use: case_in_INITIAL_REVIEW_IN_PROGRESS
      - run: ReturnInitialReview
        as: manager_h1
        input: { caseId: "${c}", reason: "需補充病歷資料" }

  case_in_CANCELLED:
    steps:
      - use: case_in_PENDING_INITIAL_REVIEW
      - run: CancelReviewCase
        as: manager_h1
        input: { caseId: "${c}", reason: "病歷資料有誤" }

# 具名斷言可以包含 result 與 code，所以矩陣的一列可以是「被拒絕」。
expectations:
  full_content:
    result: SUCCESS
    output:
      "entries[stage=INITIAL]": { status: SUBMITTED, totalScore: "20", comment: "初審評語" }
  own_draft:
    result: SUCCESS
    output:
      "entries[stage=INITIAL]": { status: DRAFT, revisionNo: 1, reviewerId: u-r1 }
  metadata_only:
    result: SUCCESS
    absent: ["entries[*].totalScore", "entries[*].comment"]
  listed:
    result: SUCCESS
    output: { "content[caseId=${c}]": { hospitalId: H-01 } }
  not_listed:
    result: SUCCESS
    output: { content: [] }
  denied:
    result: REJECTED
    code: ACCESS_DENIED

examples:

  # ---------- ListReviewCases ----------

  - name: lists_only_cases_of_the_actors_hospital
    basis: [RC-LST-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: manager_h2, input: { batchId: "${b}" } }
    then:
      result: SUCCESS
      output: { content: [] }

  # ---------- ListReviewCases：SYSTEM_ADMIN（D-100） ----------

  # 白名單（D-036、權限矩陣 §5.1）：只刪減，不補 projectName、updatedAt。
  - name: admin_list_is_a_whitelist
    basis: [RC-LST-03]
    given: [{ use: case_in_CLOSED }]
    when: { run: ListReviewCases, as: admin, input: { batchId: "${b}" } }
    then:
      result: SUCCESS
      output:
        "content[caseId=${c}]": { batchId: "${b}", hospitalId: H-01, status: CLOSED, reviewerId: u-r1, rereviewerId: u-rr1, projectionType: METADATA_ONLY }
      only:
        "content[*]": [caseId, batchId, hospitalId, status, reviewerId, rereviewerId, dueAt, projectionType]

  # admin 的院區是 H-09，案件在 H-01。
  - name: admin_lists_cases_of_every_hospital
    basis: [RC-LST-04]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: admin, input: { batchId: "${b}" } }
    then:
      result: SUCCESS
      output: { "content[caseId=${c}]": { hospitalId: H-01, status: SELECTED_PENDING_ASSIGNMENT } }

  - name: admin_list_narrows_to_a_hospital
    basis: [RC-LST-04]
    matrix:
      columns: [hospital, expect]
      key: [hospital]
      rows:
        - [H-01, listed]
        - [H-02, not_listed]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: admin, input: { batchId: "${b}", hospitalId: "${hospital}" } }
    then: { use_expect: "${expect}" }

  # 案件的病歷類型是 OUTPATIENT。SYSTEM_ADMIN 帶別的類型，照樣列出（條件不採用）。
  - name: admin_list_does_not_take_the_medical_record_type
    basis: [RC-LST-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: admin, input: { batchId: "${b}", medicalRecordType: INPATIENT } }
    then: { use_expect: listed }

  - name: other_roles_filter_by_the_medical_record_type
    basis: [RC-LST-05]
    matrix:
      columns: [type, expect]
      key: [type]
      rows:
        - [OUTPATIENT, listed]
        - [INPATIENT,  not_listed]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: manager_h1, input: { batchId: "${b}", medicalRecordType: "${type}" } }
    then: { use_expect: "${expect}" }

  - name: admin_list_filters_by_project
    basis: [RC-LST-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: admin, input: { projectId: "${p}" } }
    then: { use_expect: listed }

  - name: admin_list_of_another_project_is_empty
    basis: [RC-LST-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: admin, input: { projectId: missing-project } }
    then: { use_expect: not_listed }

  # ---------- AssignReviewCase ----------

  - name: assigns_a_reviewer
    basis: [RC-T-01, RC-ASG-S1, RC-ASG-S2, RC-ASG-S3]
    given:
      - use: case_in_SELECTED_PENDING_ASSIGNMENT
      - advance: PT1H
    when:
      run: AssignReviewCase
      as: manager_h1
      input: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-27T07:59:59+08:00" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseAssigned, with: { caseId: "${c}", assignedReviewerId: u-r1 } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output:
            "content[caseId=${c}]":
              status: PENDING_INITIAL_REVIEW
              reviewerId: u-r1
              dueAt: "2026-11-26T23:59:59Z"
              assignedAt: "2026-11-19T10:00:00Z"

  - name: rejects_assign_by_a_non_manager
    basis: [RC-G-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: AssignReviewCase, as: reviewer_h1, input: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" } }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_assign_of_an_unknown_case
    basis: [RC-G-02]
    when: { run: AssignReviewCase, as: manager_h1, input: { caseId: no-such-case, reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" } }
    then: { result: REJECTED, code: CASE_NOT_FOUND }

  - name: rejects_assign_across_hospitals
    basis: [RC-G-03]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: AssignReviewCase, as: manager_h2, input: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" } }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }

  - name: rejects_assign_of_an_already_assigned_case
    basis: [RC-ASG-01]
    given:
      - use: case_in_PENDING_INITIAL_REVIEW
      - advance: PT1H
    when: { run: AssignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r2, dueAt: "2026-11-27T23:59:59Z" } }
    then: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output:
            "content[caseId=${c}]": { reviewerId: u-r1, assignedAt: "2026-11-19T09:00:00Z" }

  - name: rejects_assign_without_a_reviewer
    basis: [RC-ASG-02]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: AssignReviewCase, as: manager_h1, input: { caseId: "${c}", dueAt: "2026-11-26T23:59:59Z" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_assign_without_a_due_date
    basis: [RC-ASG-02]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: AssignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r1 } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  # ---------- StartInitialReview ----------

  - name: starts_the_initial_review
    basis: [RC-T-02, RC-STI-S1, RC-STI-S2]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when:
      run: StartInitialReview
      as: reviewer_h1
      input: { caseId: "${c}" }
      save: { s1: submissionId }
    then:
      result: SUCCESS
      emits:
        - { event: InitialReviewStarted }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: INITIAL_REVIEW_IN_PROGRESS } } }
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output:
            entries:
              - { submissionId: "${s1}", stage: INITIAL, status: DRAFT, revisionNo: 1, reviewerId: u-r1 }

  # 欄位依 D-067（Q-07）。
  - name: initial_review_started_carries_the_case
    basis: [RC-STI-S3]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when:
      run: StartInitialReview
      as: reviewer_h1
      input: { caseId: "${c}" }
      save: { s1: submissionId }
    then:
      result: SUCCESS
      emits:
        - { event: InitialReviewStarted, with: { caseId: "${c}", submissionId: "${s1}", reviewerId: u-r1 } }

  - name: rejects_start_by_a_reviewer_who_is_not_assigned
    basis: [RC-STI-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: StartInitialReview, as: reviewer2_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: NOT_ASSIGNED_REVIEWER }

  - name: rejects_start_of_a_review_already_started
    basis: [RC-STI-02]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: StartInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }

  # ---------- SaveInitialReviewDraft ----------

  - name: saves_the_draft
    basis: [RC-DRF-S1, RS-T-01]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when:
      run: SaveInitialReviewDraft
      as: reviewer_h1
      input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "20" }], comment: "初審評語" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewDraftSaved }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output: { "entries[stage=INITIAL]": { status: DRAFT, comment: "初審評語" } }

  # 欄位依 D-067（Q-07）。草稿分數不列為必要欄位。
  - name: draft_saved_carries_the_submission
    basis: [RC-DRF-S2]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when:
      run: SaveInitialReviewDraft
      as: reviewer_h1
      input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "20" }], comment: "初審評語" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewDraftSaved, with: { submissionId: "${s1}", caseId: "${c}" } }

  - name: rejects_save_by_another_reviewer
    basis: [RC-DRF-01]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: SaveInitialReviewDraft, as: reviewer2_h1, input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "20" }] } }
    then: { result: REJECTED, code: SUBMISSION_NOT_OWNED_BY_ACTOR }

  - name: rejects_save_without_any_change
    basis: [RC-DRF-02]
    given: [{ use: answered_case }]
    when:
      run: SaveInitialReviewDraft
      as: reviewer_h1
      input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "20" }], comment: "初審評語" }
    then: { result: REJECTED, code: NO_CHANGES }

  # 已指派、還沒開始初審（D-068 第 1 點）。
  - name: rejects_draft_before_review_started
    basis: [RC-DRF-03]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: SaveInitialReviewDraft, as: reviewer_h1, input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "20" }] } }
    then: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }

  # ---------- SubmitInitialReview ----------

  - name: submits_the_initial_review
    basis: [RC-T-03, RS-T-02, RC-SUB-S1, RC-SUB-S2, RC-SUB-S3]
    given:
      - use: answered_case
      - advance: PT2H
    when: { run: SubmitInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { submissionId: "${s1}", caseStatus: INITIAL_REVIEW_COMPLETED, totalScore: "20" }
      emits_include:
        - { event: ReviewSubmissionSubmitted, with: { caseId: "${c}", submissionId: "${s1}" } }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output:
            entries:
              - { submissionId: "${s1}", stage: INITIAL, status: SUBMITTED, submittedAt: "2026-11-19T11:00:00Z" }

  # 提交初審發出兩個事件（D-067，Q-03）：提交的事實與初審完成的事實。
  - name: submitting_emits_exactly_two_events
    basis: [RC-SUB-S1, RC-SUB-S4]
    given: [{ use: answered_case }]
    when: { run: SubmitInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewSubmissionSubmitted, with: { caseId: "${c}" } }
        - { event: InitialReviewCompleted,    with: { caseId: "${c}", submissionId: "${s1}" } }

  # D-076 第 2 點：事件帶階段（domain-events.md §7.2）。
  - name: submission_submitted_carries_the_initial_stage
    basis: [RC-SUB-S3, RC-SUB-S5]
    given: [{ use: answered_case }]
    when: { run: SubmitInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      emits_include:
        - { event: ReviewSubmissionSubmitted, with: { caseId: "${c}", submissionId: "${s1}", stage: INITIAL } }

  - name: rejects_submit_by_another_reviewer
    basis: [RC-SUB-01]
    given: [{ use: answered_case }]
    when: { run: SubmitInitialReview, as: reviewer2_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: SUBMISSION_NOT_OWNED_BY_ACTOR }

  - name: rejects_submit_of_a_review_already_submitted
    basis: [RC-SUB-02]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: SubmitInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }

  - name: rejects_submit_with_a_required_item_unanswered
    basis: [RC-SUB-03]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: SubmitInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }

  # ---------- FixInitialReview（D-069） ----------

  - name: fixes_and_escalates_above_the_quality_line
    basis: [RC-T-05, RC-FIX-S1, RC-FIX-S3, RC-FIX-S4, RC-FIX-S5]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: FixInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then:
      result: SUCCESS
      output: { caseId: "${c}", caseStatus: PENDING_REREVIEW, submissionId: "${s1}", fixedAt: "2026-11-19T09:00:00Z" }
      emits:
        - { event: InitialReviewFixed, with: { caseId: "${c}", submissionId: "${s1}" } }
        - event: ReviewCaseEscalatedToRereview
          with: { caseId: "${c}", projectId: "${p}", triggeredBySubmissionId: "${s1}", initialScore: "20", qualityThreshold: 5 }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: PENDING_REREVIEW } } }

  - name: fixes_without_escalation_at_the_quality_line
    basis: [RC-T-04, RC-FIX-S2]
    given: [{ use: low_score_completed_case }]
    when: { run: FixInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then:
      result: SUCCESS
      output: { caseStatus: INITIAL_REVIEW_COMPLETED }
      emits:
        - { event: InitialReviewFixed }

  - name: rejects_fix_by_another_reviewer
    basis: [RC-FIX-06]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: FixInitialReview, as: reviewer2_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then: { result: REJECTED, code: NOT_SUBMISSION_OWNER }

  - name: rejects_fixing_twice
    basis: [RC-FIX-02]
    given: [{ use: low_score_fixed_case }]
    when: { run: FixInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }

  - name: rejects_fix_before_submit
    basis: [RC-FIX-03]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: FixInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }

  - name: rejects_fix_of_a_closed_case
    basis: [RC-FIX-01]
    given: [{ use: case_in_CLOSED }]
    when: { run: FixInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then: { result: REJECTED, code: CASE_TERMINAL }

  - name: rejects_fix_of_an_unknown_submission
    basis: [RC-G-04]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: FixInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: no-such-submission } }
    then: { result: REJECTED, code: SUBMISSION_NOT_FOUND }

  # ---------- SendToRereview（D-069） ----------

  - name: sends_to_rereview_manually
    basis: [RC-T-06, RC-SND-S1, RC-SND-S2]
    given: [{ use: low_score_fixed_case }]
    when: { run: SendToRereview, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseEscalatedToRereview, with: { caseId: "${c}", projectId: "${p}" } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: PENDING_REREVIEW } } }

  - name: rejects_send_before_fixing
    basis: [RC-SND-02]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: SendToRereview, as: manager_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }

  - name: rejects_send_of_a_case_already_in_rereview
    basis: [RC-SND-01]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: SendToRereview, as: manager_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }

  # ---------- AssignRereviewer（D-069） ----------

  - name: assigns_a_rereviewer
    basis: [RC-ARR-S1]
    derived_from: [TS-RR-001]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: AssignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" } }
    then:
      result: SUCCESS
      emits:
        - { event: RereviewerAssigned }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: PENDING_REREVIEW, rereviewerId: u-rr1 } } }

  - name: rereviewer_assigned_carries_the_case
    basis: [RC-ARR-S2]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: AssignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" } }
    then:
      result: SUCCESS
      emits:
        - { event: RereviewerAssigned, with: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" } }

  - name: rejects_the_initial_reviewer_as_rereviewer
    basis: [RC-ARR-03]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: AssignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-r1, dueAt: "2026-12-03T23:59:59Z" } }
    then: { result: REJECTED, code: REREVIEWER_SAME_AS_REVIEWER }

  - name: rejects_rereviewer_assignment_before_rereview
    basis: [RC-ARR-01]
    given: [{ use: low_score_fixed_case }]
    when: { run: AssignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" } }
    then: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }

  - name: rejects_rereviewer_assignment_without_a_due_date
    basis: [RC-ARR-02]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: AssignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr1 } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  # ---------- StartRereview（D-069） ----------

  - name: starts_the_rereview
    basis: [RC-T-07, RC-STR-S1, RC-STR-S2]
    derived_from: [TS-RR-002]
    given: [{ use: rereviewer_assigned }]
    when:
      run: StartRereview
      as: rereviewer_h1
      input: { caseId: "${c}" }
      save: { s2: submissionId }
    then:
      result: SUCCESS
      emits:
        - { event: RereviewStarted }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: REREVIEW_IN_PROGRESS } } }
      - run: GetRevisionHistory
        as: manager_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output:
            "entries[stage=REREVIEW]": { submissionId: "${s2}", status: DRAFT, revisionNo: 1, reviewerId: u-rr1 }

  - name: rereview_started_carries_the_case
    basis: [RC-STR-S3]
    given: [{ use: rereviewer_assigned }]
    when:
      run: StartRereview
      as: rereviewer_h1
      input: { caseId: "${c}" }
      save: { s2: submissionId }
    then:
      result: SUCCESS
      emits:
        - { event: RereviewStarted, with: { caseId: "${c}", submissionId: "${s2}", rereviewerId: u-rr1 } }

  - name: rejects_start_by_another_rereviewer
    basis: [RC-STR-01]
    given: [{ use: rereviewer_assigned }]
    when: { run: StartRereview, as: rereviewer2_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }

  - name: rejects_start_without_an_assigned_rereviewer
    basis: [RC-STR-03]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: StartRereview, as: rereviewer_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: NO_REREVIEWER_ASSIGNED }

  - name: rejects_start_of_a_rereview_already_started
    basis: [RC-STR-02]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when: { run: StartRereview, as: rereviewer_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }

  # ---------- SaveRereviewDraft（D-069） ----------

  - name: saves_the_rereview_draft
    basis: [RS-T-03, RC-RDR-S1]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when:
      run: SaveRereviewDraft
      as: rereviewer_h1
      input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "10" }], comment: "複審評語" }
    then: { result: SUCCESS }
    observe:
      - run: GetRevisionHistory
        as: manager_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output: { "entries[stage=REREVIEW]": { status: DRAFT, comment: "複審評語" } }

  # D-076 第 1 點：保存複審草稿也發 ReviewDraftSaved。
  - name: rereview_draft_saved_carries_the_submission
    basis: [RC-RDR-S2]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when:
      run: SaveRereviewDraft
      as: rereviewer_h1
      input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "10" }], comment: "複審評語" }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewDraftSaved, with: { submissionId: "${s2}", caseId: "${c}" } }

  - name: rejects_rereview_draft_without_any_change
    basis: [RC-RDR-09]
    given: [{ use: rereview_answered }]
    when:
      run: SaveRereviewDraft
      as: rereviewer_h1
      input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "10" }], comment: "複審評語" }
    then: { result: REJECTED, code: NO_CHANGES }

  - name: rejects_rereview_draft_by_another_rereviewer
    basis: [RC-RDR-03]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when: { run: SaveRereviewDraft, as: rereviewer2_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "10" }] } }
    then: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }

  - name: rejects_rereview_draft_on_the_initial_submission
    basis: [RC-RDR-05]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when: { run: SaveRereviewDraft, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "10" }] } }
    then: { result: REJECTED, code: CONFLICT }

  - name: rejects_rereview_draft_after_submit
    basis: [RC-RDR-07]
    given: [{ use: rereview_submitted }]
    when: { run: SaveRereviewDraft, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "12" }] } }
    then: { result: REJECTED, code: SUBMISSION_NOT_DRAFT }

  - name: rejects_rereview_draft_before_rereview_started
    basis: [RC-RDR-02]
    given: [{ use: rereviewer_assigned }]
    when: { run: SaveRereviewDraft, as: rereviewer_h1, input: { caseId: "${c}", submissionId: no-such-submission, answers: [{ itemId: I1, answerValue: "10" }] } }
    then: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }

  - name: rejects_rereview_draft_of_a_closed_case
    basis: [RC-RDR-01]
    given: [{ use: case_in_CLOSED }]
    when: { run: SaveRereviewDraft, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "12" }] } }
    then: { result: REJECTED, code: CASE_TERMINAL }

  # ---------- SubmitRereview（D-069） ----------

  - name: submits_the_rereview_without_closing
    basis: [RC-T-08, RS-T-04, RC-SRR-S1, RC-SRR-S2, RC-SRR-S4]
    derived_from: [TS-RR-003]
    given:
      - use: rereview_answered
      - advance: PT2H
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" } }
    then:
      result: SUCCESS
      output: { submissionId: "${s2}", status: SUBMITTED, caseId: "${c}", caseStatus: REREVIEW_IN_PROGRESS }
      absent: [finalScore, initialReviewScore, initialScore]
      emits_include:
        - { event: RereviewCompleted }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: REREVIEW_IN_PROGRESS } } }
      - run: GetRevisionHistory
        as: manager_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output:
            "entries[stage=REREVIEW]": { submissionId: "${s2}", status: SUBMITTED, totalScore: "20", submittedAt: "2026-11-19T11:00:00Z" }

  # D-070（E-3）：事件帶加權後的 finalScore（D-012、D-020）。複審醫師的輸出仍然沒有它（RC-SRR-S4）。
  - name: rereview_completed_carries_the_weighted_final_score
    basis: [RC-SRR-S3, RC-SRR-S4]
    given: [{ use: weighted_rereview_answered }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" } }
    then:
      result: SUCCESS
      absent: [finalScore, initialReviewScore, initialScore]
      emits_include:
        - event: RereviewCompleted
          with: { caseId: "${c}", submissionId: "${s2}", rereviewerId: u-rr1, rereviewScore: "15", finalScore: "10.00" }

  # D-076 第 2 點：提交複審發兩個事件，與提交初審對稱。
  - name: submitting_the_rereview_emits_exactly_two_events
    basis: [RC-SRR-S3, RC-SRR-S5]
    given: [{ use: rereview_answered }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewSubmissionSubmitted, with: { caseId: "${c}", submissionId: "${s2}", stage: REREVIEW } }
        - { event: RereviewCompleted,         with: { caseId: "${c}", submissionId: "${s2}" } }

  # D-076 第 4 點：必答題看這次提交採用的答案。草稿沒有作答、輸入也沒有帶答案。
  - name: rejects_rereview_submit_with_a_required_item_unanswered
    basis: [RC-SRR-09]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }

  # 輸入帶了答案就看輸入：草稿有作答，輸入的答案是空的，仍然拒絕。
  - name: rejects_rereview_submit_when_the_answers_in_the_input_miss_a_required_item
    basis: [RC-SRR-09]
    given: [{ use: rereview_answered }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [] } }
    then: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }

  # 草稿沒有作答，輸入的答案補齊了必答題：通過。
  - name: submits_the_rereview_with_the_answers_in_the_input
    basis: [RC-SRR-09, RC-SRR-S2]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when:
      run: SubmitRereview
      as: rereviewer_h1
      input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "10" }], comment: "複審評語" }
    then:
      result: SUCCESS
      output: { submissionId: "${s2}", status: SUBMITTED }

  - name: rejects_rereview_submit_by_another_rereviewer
    basis: [RC-SRR-03]
    derived_from: [TS-RR-004]
    given: [{ use: rereview_answered }]
    when: { run: SubmitRereview, as: rereviewer2_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }

  - name: rejects_rereview_submit_twice
    basis: [RC-SRR-07]
    given: [{ use: rereview_submitted }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" } }
    then: { result: REJECTED, code: SUBMISSION_NOT_DRAFT }

  - name: rejects_rereview_submit_on_the_initial_submission
    basis: [RC-SRR-05]
    given: [{ use: rereview_answered }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then: { result: REJECTED, code: CONFLICT }

  - name: rejects_rereview_submit_before_rereview_started
    basis: [RC-SRR-02]
    given: [{ use: rereviewer_assigned }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: no-such-submission } }
    then: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }

  - name: rejects_rereview_submit_of_a_closed_case
    basis: [RC-SRR-01]
    given: [{ use: case_in_CLOSED }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" } }
    then: { result: REJECTED, code: CASE_TERMINAL }

  # ---------- CloseRereview（D-069） ----------

  - name: closes_after_rereview
    basis: [RC-T-09, RC-CLR-S1, RC-CLR-S3]
    given: [{ use: rereview_submitted }]
    when: { run: CloseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then:
      result: SUCCESS
      output: { caseId: "${c}", caseStatus: CLOSED, submissionId: "${s2}" }
      absent: [finalScore, initialReviewScore, initialScore]
      emits:
        - { event: ReviewCaseClosed }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: CLOSED } } }

  - name: review_case_closed_carries_the_case
    basis: [RC-CLR-S2]
    given: [{ use: rereview_submitted }]
    when: { run: CloseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseClosed, with: { caseId: "${c}", submissionId: "${s2}" } }

  - name: rejects_closing_a_draft
    basis: [RC-CLR-06]
    given: [{ use: rereview_answered }]
    when: { run: CloseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }

  - name: rejects_closing_twice
    basis: [RC-CLR-01]
    given: [{ use: case_in_CLOSED }]
    when: { run: CloseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then: { result: REJECTED, code: CASE_TERMINAL }

  - name: rejects_close_by_another_rereviewer
    basis: [RC-CLR-05]
    given: [{ use: rereview_submitted }]
    when: { run: CloseRereview, as: rereviewer2_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then: { result: REJECTED, code: NOT_SUBMISSION_OWNER }

  - name: rejects_closing_the_initial_submission
    basis: [RC-CLR-04]
    given: [{ use: rereview_submitted }]
    when: { run: CloseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s1}" } }
    then: { result: REJECTED, code: CONFLICT }

  - name: rejects_close_before_rereview_started
    basis: [RC-CLR-02]
    given: [{ use: rereviewer_assigned }]
    when: { run: CloseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: no-such-submission } }
    then: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }

  # ---------- GetRevisionHistory：角色 × 狀態 ----------

  - name: revision_history_visibility
    basis: [RC-VIS-01, RC-VIS-03, RC-RVH-01, RC-RVH-02, RC-INV-02]
    matrix:
      columns: [actor, state, expect]
      key: [actor, state]
      rows:
        - [reviewer_h1,   INITIAL_REVIEW_IN_PROGRESS, own_draft]
        - [admin,         INITIAL_REVIEW_IN_PROGRESS, metadata_only]
        - [reviewer2_h1,  INITIAL_REVIEW_IN_PROGRESS, denied]
        - [manager_h1,    INITIAL_REVIEW_COMPLETED,   full_content]
        - [auditor_h1,    INITIAL_REVIEW_COMPLETED,   full_content]
        - [reviewer_h1,   INITIAL_REVIEW_COMPLETED,   full_content]
        - [admin,         INITIAL_REVIEW_COMPLETED,   metadata_only]
        - [reviewer2_h1,  INITIAL_REVIEW_COMPLETED,   denied]
        - [rereviewer_h1, INITIAL_REVIEW_COMPLETED,   denied]
        - [dual_role_h1,  INITIAL_REVIEW_COMPLETED,   denied]
    given:
      - use: "case_in_${state}"
    when: { run: GetRevisionHistory, as: "${actor}", input: { caseId: "${c}" } }
    then: { use_expect: "${expect}" }

  - name: admin_history_is_a_whitelist
    basis: [RC-VIS-05]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: GetRevisionHistory, as: admin, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      only:
        ".": [caseId, entries]
        "entries[*]": [submissionId, stage, revisionNo, status, submittedAt, reviewerId, supersededBySubmissionId]

  - name: rejects_history_across_hospitals
    basis: [RC-G-03]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: GetRevisionHistory, as: manager_h2, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }

  # ---------- 稽核：生命週期與稽核軌跡（D-071） ----------

  - name: lifecycle_masks_scored_detail_before_rereview
    basis: [RC-LCY-02]
    given: [{ use: low_score_completed_case }]
    when: { run: GetCaseLifecycle, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "entries[action=ASSIGNED]": { detail: '{"reviewerId":"u-r1","dueAt":"2026-11-26T23:59:59Z"}' }
      absent: ["entries[action=INITIAL_REVIEW_COMPLETED].detail"]

  - name: lifecycle_masks_scored_detail_for_the_initial_reviewer
    basis: [RC-LCY-02]
    given: [{ use: low_score_completed_case }]
    when: { run: GetCaseLifecycle, as: reviewer_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      absent: ["entries[action=INITIAL_REVIEW_COMPLETED].detail"]

  - name: lifecycle_masks_the_escalation_score_while_pending_rereview
    basis: [RC-LCY-02]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: GetCaseLifecycle, as: auditor_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      absent: ["entries[action=INITIAL_REVIEW_COMPLETED].detail", "entries[action=CASE_ESCALATED_TO_REREVIEW].detail"]

  # 用 RANGE 題目的專案（D-070 E-3-2），detail 的數字格式與 RereviewSliceEventPropertiesTest 相同。
  - name: lifecycle_shows_scored_detail_after_close
    basis: [RC-LCY-03]
    given:
      - use: weighted_rereview_answered
      - run: SubmitRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" }
      - run: CloseRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}" }
    when: { run: GetCaseLifecycle, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "entries[action=REREVIEW_SUBMITTED]": { detail: '{"rereviewScore":15,"finalScore":10.00}' }

  - name: lifecycle_masks_scored_detail_for_a_historical_rereviewer
    basis: [RC-LCY-02]
    given: [{ use: case_in_CLOSED }]
    when: { run: GetCaseLifecycle, as: rr1_as_auditor_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      absent: ["entries[action=INITIAL_REVIEW_COMPLETED].detail", "entries[action=REREVIEW_SUBMITTED].detail"]

  - name: lifecycle_gives_system_admin_no_detail
    basis: [RC-LCY-01]
    given: [{ use: case_in_CLOSED }]
    when: { run: GetCaseLifecycle, as: admin, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      absent: ["entries[*].detail"]

  - name: reading_the_lifecycle_does_not_block_a_later_rereviewer_assignment
    basis: [RC-LCY-02, RC-LCY-04]
    given:
      - use: case_in_PENDING_REREVIEW
      - run: GetCaseLifecycle
        as: rr1_as_auditor_h1
        input: { caseId: "${c}" }
    when: { run: AssignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" } }
    then: { result: SUCCESS }

  - name: audit_trails_mask_scored_rows_before_rereview
    basis: [RC-AUD-02]
    given: [{ use: low_score_completed_case }]
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: ReviewCase, aggregateId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "content[action=ASSIGNED]": { detail: '{"reviewerId":"u-r1","dueAt":"2026-11-26T23:59:59Z"}' }
      absent: ["content[action=INITIAL_REVIEW_COMPLETED].detail"]

  - name: audit_trails_show_scored_rows_after_close
    basis: [RC-AUD-02]
    given:
      - use: weighted_rereview_answered
      - run: SubmitRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" }
      - run: CloseRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}" }
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: ReviewCase, aggregateId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "content[action=REREVIEW_SUBMITTED]": { detail: '{"rereviewScore":15,"finalScore":10.00}' }

  - name: audit_trails_give_system_admin_no_detail
    basis: [RC-AUD-01]
    given: [{ use: case_in_CLOSED }]
    when: { run: ListAuditTrails, as: admin, input: { aggregateType: ReviewCase, aggregateId: "${c}" } }
    then:
      result: SUCCESS
      absent: ["content[*].detail"]

  # D-092：事件的發生時間取注入的時鐘。設定檔的 clock_start 是 2026-11-19T09:00:00Z。
  - name: lifecycle_records_when_each_event_occurred
    basis: [RC-LCY-05]
    given:
      - use: case_in_SELECTED_PENDING_ASSIGNMENT
      - advance: PT1H
      - { run: AssignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" } }
      - advance: PT2H
      - { run: CancelReviewCase, as: manager_h1, input: { caseId: "${c}", reason: "病歷資料有誤" } }
    when: { run: GetCaseLifecycle, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "entries[action=ASSIGNED]": { occurredAt: "2026-11-19T10:00:00Z" }
        "entries[action=CANCELLED]": { occurredAt: "2026-11-19T12:00:00Z" }

  - name: audit_trails_share_the_time_of_one_use_case
    basis: [RC-AUD-04]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: SamplingBatch, aggregateId: "${b}" } }
    then:
      result: SUCCESS
      output:
        "content[action=STARTED]": { occurredAt: "2026-11-19T09:00:00Z" }
        "content[action=CANDIDATES_PREPARED]": { occurredAt: "2026-11-19T09:00:00Z" }
        "content[action=CASES_SELECTED]": { occurredAt: "2026-11-19T09:00:00Z" }
        "content[action=COMPLETED]": { occurredAt: "2026-11-19T09:00:00Z" }

  # D-078：ReviewSubmission 的 DRAFT_SAVED、SUBMITTED 以所屬案件判斷。
  # D-079：初審的 DRAFT_SAVED 帶院區，院區人員讀得到，所以兩種都檢查。
  - name: audit_trails_mask_submission_rows_before_rereview_for_an_auditor
    basis: [RC-AUD-02]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: ListAuditTrails, as: auditor_h1, input: { aggregateType: ReviewSubmission, aggregateId: "${s1}" } }
    then:
      result: SUCCESS
      absent: ["content[action=DRAFT_SAVED].detail", "content[action=SUBMITTED].detail"]

  - name: audit_trails_mask_submission_rows_before_rereview_for_a_manager
    basis: [RC-AUD-02]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: ReviewSubmission, aggregateId: "${s1}" } }
    then:
      result: SUCCESS
      absent: ["content[action=DRAFT_SAVED].detail", "content[action=SUBMITTED].detail"]

  - name: audit_trails_show_submission_rows_after_close
    basis: [RC-AUD-02]
    given: [{ use: case_in_CLOSED }]
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: ReviewSubmission, aggregateId: "${s1}" } }
    then:
      result: SUCCESS
      output:
        "content[action=SUBMITTED]": { detail: '{"caseId":"${c}","totalScore":20,"reviewerId":"u-r1"}' }

  # ---------- 退回、重開、取消、不經複審結案（D-080） ----------

  - name: returns_the_initial_review
    basis: [RC-T-10, RC-RET-S1, RC-RET-S2]
    derived_from: [TS-IR-008]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: ReturnInitialReview, as: manager_h1, input: { caseId: "${c}", reason: "需補充病歷資料" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseReturned, with: { caseId: "${c}", reason: "需補充病歷資料" } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: RETURNED } } }

  - name: return_reason_is_escaped_in_the_audit_detail
    basis: [RC-RET-S3]
    given:
      - use: case_in_INITIAL_REVIEW_IN_PROGRESS
      - run: ReturnInitialReview
        as: manager_h1
        input: { caseId: "${c}", reason: 'a"b\c' }
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: ReviewCase, aggregateId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "content[action=RETURNED]": { detail: '{"reason":"a\"b\\c"}' }

  - name: rejects_return_when_not_in_progress
    basis: [RC-RET-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: ReturnInitialReview, as: manager_h1, input: { caseId: "${c}", reason: "需補充病歷資料" } }
    then: { result: REJECTED, code: CASE_NOT_IN_PROGRESS }

  - name: rejects_a_blank_return_reason
    basis: [RC-RET-02]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: ReturnInitialReview, as: manager_h1, input: { caseId: "${c}", reason: "   " } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_return_by_a_reviewer
    basis: [RC-G-01]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: ReturnInitialReview, as: reviewer_h1, input: { caseId: "${c}", reason: "需補充病歷資料" } }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: reopens_a_returned_case
    basis: [RC-T-11, RC-REO-S1, RC-REO-S2]
    derived_from: [TS-TR-005]
    given: [{ use: case_in_RETURNED }]
    when: { run: ReopenInitialReview, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseReopened, with: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output:
            "content[caseId=${c}]": { status: PENDING_INITIAL_REVIEW, reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" }

  - name: reopen_is_recorded_as_reopened
    basis: [RC-REO-S2]
    derived_from: [TS-TR-005]
    given:
      - use: case_in_RETURNED
      - run: ReopenInitialReview
        as: manager_h1
        input: { caseId: "${c}" }
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: ReviewCase, aggregateId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "content[action=REOPENED]": { detail: '{"reviewerId":"u-r1","dueAt":"2026-11-26T23:59:59Z"}' }

  - name: rejects_reopen_when_not_returned
    basis: [RC-REO-01]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: ReopenInitialReview, as: manager_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: CASE_NOT_RETURNED }

  - name: restarts_with_the_same_draft_after_reopen
    basis: [RC-STI-S4]
    given:
      - use: answered_case
      - run: ReturnInitialReview
        as: manager_h1
        input: { caseId: "${c}", reason: "需補充病歷資料" }
      - run: ReopenInitialReview
        as: manager_h1
        input: { caseId: "${c}" }
    when: { run: StartInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { submissionId: "${s1}" }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output:
            entries:
              - { submissionId: "${s1}", stage: INITIAL, status: DRAFT, revisionNo: 1, totalScore: "20", comment: "初審評語" }

  - name: restarts_with_a_new_draft_after_reopen_and_reassign
    basis: [RC-STI-S5]
    given:
      - use: answered_case
      - run: ReturnInitialReview
        as: manager_h1
        input: { caseId: "${c}", reason: "需補充病歷資料" }
      - run: ReopenInitialReview
        as: manager_h1
        input: { caseId: "${c}" }
      - run: ReassignReviewCase
        as: manager_h1
        input: { caseId: "${c}", reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" }
      - run: StartInitialReview
        as: reviewer2_h1
        input: { caseId: "${c}" }
        save: { s2: submissionId }
    when:
      run: SaveInitialReviewDraft
      as: reviewer2_h1
      input:
        caseId: "${c}"
        answers: [{ itemId: I1, answerValue: "10" }]
        comment: "改派後評語"
    then: { result: SUCCESS }
    observe:
      - run: GetRevisionHistory
        as: manager_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output:
            "entries[submissionId=${s1}]": { reviewerId: u-r1, status: DRAFT, comment: "初審評語" }
            "entries[submissionId=${s2}]": { reviewerId: u-r2, status: DRAFT, revisionNo: 1, comment: "改派後評語" }

  # ---------- 修正（D-083） ----------

  - name: revises_a_submitted_initial_review
    basis: [RC-RVI-S1, RC-RVI-S2, RC-RVI-S3, RS-T-05, RS-INV-03, RS-INV-04]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "3" }], comment: "修正初審" } }
    then:
      result: SUCCESS
      output: { oldSubmissionId: "${s1}", revisionNo: 2, totalScore: "3", status: SUBMITTED, stage: INITIAL, caseId: "${c}" }
      emits:
        - { event: ReviewSubmissionRevised, with: { caseId: "${c}", oldSubmissionId: "${s1}", stage: INITIAL, revisionNo: 2 } }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect:
          result: SUCCESS
          output:
            "entries[submissionId=${s1}]": { status: SUPERSEDED, revisionNo: 1, totalScore: "5" }
            "entries[revisionNo=2]": { status: SUBMITTED, totalScore: "3", comment: "修正初審" }

  - name: rejects_revising_a_fixed_initial_review
    basis: [RC-RVI-07, RC-INV-04]
    given: [{ use: low_score_fixed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "3" }], comment: "修正初審" } }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }

  - name: rejects_initial_revision_by_another_reviewer
    basis: [RC-RVI-04]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer2_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "3" }], comment: "修正初審" } }
    then: { result: REJECTED, code: NOT_SUBMISSION_OWNER }

  - name: rejects_initial_revision_without_required_answers
    basis: [RC-RVI-08]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [], comment: "修正初審" } }
    then: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }

  - name: rejects_initial_revision_without_changes
    basis: [RC-RVI-09]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "5" }], comment: "初審評語" } }
    then: { result: REJECTED, code: NO_CHANGES }

  - name: rejects_revising_a_superseded_initial_submission
    basis: [RC-RVI-05]
    given:
      - use: low_score_completed_case
      - { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "3" }], comment: "修正初審" } }
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "4" }], comment: "再修正" } }
    then: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }

  - name: rejects_initial_revision_with_a_rereview_submission
    basis: [RC-RVI-03]
    given: [{ use: rereview_submitted }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "3" }], comment: "修正初審" } }
    then: { result: REJECTED, code: CONFLICT }

  - name: rejects_initial_revision_of_a_cancelled_case
    basis: [RC-RVI-01, RC-INV-04]
    given:
      - use: low_score_completed_case
      - { run: CancelReviewCase, as: manager_h1, input: { caseId: "${c}", reason: "病歷資料有誤" } }
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "3" }], comment: "修正初審" } }
    then: { result: REJECTED, code: CASE_TERMINAL }

  - name: revises_a_submitted_rereview
    basis: [RC-RVR-S1, RC-RVR-S2, RC-RVR-S3, RC-RVR-S4, RC-INV-03, RS-T-06]
    given:
      - use: weighted_rereview_answered
      - run: SubmitRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" }
    when: { run: ReviseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "5" }], comment: "修正複審" } }
    then:
      result: SUCCESS
      output: { oldSubmissionId: "${s2}", revisionNo: 2, totalScore: "5", status: SUBMITTED, stage: REREVIEW, caseId: "${c}" }
      absent: [finalScore, initialReviewScore, initialScore]
      emits:
        - { event: ReviewSubmissionRevised, with: { caseId: "${c}", oldSubmissionId: "${s2}", stage: REREVIEW, revisionNo: 2 } }
        - { event: RereviewRevised, with: { caseId: "${c}", oldSubmissionId: "${s2}", rereviewScore: "5", finalScore: "5.00" } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: REREVIEW_IN_PROGRESS } } }

  - name: rejects_rereview_revision_without_required_answers
    basis: [RC-RVR-08]
    given:
      - use: weighted_rereview_answered
      - run: SubmitRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" }
    when: { run: ReviseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [], comment: "修正複審" } }
    then: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }

  - name: rejects_rereview_revision_without_changes
    basis: [RC-RVR-09]
    given:
      - use: weighted_rereview_answered
      - run: SubmitRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" }
    when: { run: ReviseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "15" }], comment: "複審評語" } }
    then: { result: REJECTED, code: NO_CHANGES }

  - name: rejects_rereview_revision_with_an_initial_submission
    basis: [RC-RVR-04]
    given: [{ use: rereview_submitted }]
    when: { run: ReviseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "5" }], comment: "修正複審" } }
    then: { result: REJECTED, code: CONFLICT }

  - name: rejects_rereview_revision_of_a_draft
    basis: [RC-RVR-06]
    given: [{ use: rereview_answered }]
    when: { run: ReviseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "5" }], comment: "修正複審" } }
    then: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }

  - name: rejects_rereview_revision_after_close
    basis: [RC-RVR-01, RC-INV-04]
    given: [{ use: case_in_CLOSED }]
    when: { run: ReviseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "5" }], comment: "修正複審" } }
    then: { result: REJECTED, code: CASE_TERMINAL }

  # ---------- 改派（D-082） ----------

  - name: reassigns_the_initial_reviewer
    basis: [RC-T-20, RC-RAS-S1, RC-RAS-S3]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: ReassignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseReassigned, with: { caseId: "${c}", previousReviewerId: u-r1, newReviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: PENDING_INITIAL_REVIEW, reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" } } }
      - run: ListAuditTrails
        as: manager_h1
        input: { aggregateType: ReviewCase, aggregateId: "${c}" }
        expect:
          result: SUCCESS
          output:
            "content[action=REASSIGNED]": { detail: '{"previousReviewerId":"u-r1","newReviewerId":"u-r2","dueAt":"2026-11-28T23:59:59Z"}' }

  - name: previous_reviewer_cannot_start_after_reassign
    basis: [RC-RAS-S1]
    given:
      - use: case_in_PENDING_INITIAL_REVIEW
      - { run: ReassignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" } }
    when: { run: StartInitialReview, as: reviewer_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: NOT_ASSIGNED_REVIEWER }

  - name: reassigns_to_the_same_reviewer_to_change_the_due_date
    basis: [RC-RAS-S2]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: ReassignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r1, dueAt: "2026-11-28T23:59:59Z" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseReassigned, with: { caseId: "${c}", previousReviewerId: u-r1, newReviewerId: u-r1, dueAt: "2026-11-28T23:59:59Z" } }

  - name: rejects_reassign_when_not_pending_initial_review
    basis: [RC-RAS-02]
    matrix:
      columns: [state]
      key: [state]
      rows:
        - [SELECTED_PENDING_ASSIGNMENT]
        - [INITIAL_REVIEW_IN_PROGRESS]
    given: [{ use: "case_in_${state}" }]
    when: { run: ReassignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" } }
    then: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }

  - name: rejects_a_blank_reviewer_on_reassign
    basis: [RC-RAS-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: ReassignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: "  ", dueAt: "2026-11-28T23:59:59Z" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_reassign_without_a_due_date
    basis: [RC-RAS-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: ReassignReviewCase, as: manager_h1, input: { caseId: "${c}", reviewerId: u-r2 } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_reassign_by_a_reviewer
    basis: [RC-G-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: ReassignReviewCase, as: reviewer_h1, input: { caseId: "${c}", reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" } }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: reassigns_the_rereviewer
    basis: [RC-T-21, RC-RRR-S1, RC-RRR-S3]
    given: [{ use: rereviewer_assigned }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr2, dueAt: "2026-12-05T23:59:59Z" } }
    then:
      result: SUCCESS
      emits:
        - { event: RereviewerAssigned, with: { caseId: "${c}", rereviewerId: u-rr2, dueAt: "2026-12-05T23:59:59Z", reassignment: true } }

  - name: previous_rereviewer_cannot_start_after_reassign
    basis: [RC-RRR-S1]
    given:
      - use: rereviewer_assigned
      - { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr2, dueAt: "2026-12-05T23:59:59Z" } }
    when: { run: StartRereview, as: rereviewer_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }

  - name: reassigns_to_the_same_rereviewer_to_change_the_due_date
    basis: [RC-RRR-S2]
    given: [{ use: rereviewer_assigned }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-05T23:59:59Z" } }
    then:
      result: SUCCESS
      emits:
        - { event: RereviewerAssigned, with: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-05T23:59:59Z", reassignment: true } }

  - name: rejects_reassign_before_a_rereviewer_is_assigned
    basis: [RC-RRR-03]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr2, dueAt: "2026-12-05T23:59:59Z" } }
    then: { result: REJECTED, code: NO_REREVIEWER_ASSIGNED }

  - name: rejects_rereviewer_reassign_when_not_pending_rereview
    basis: [RC-RRR-02]
    matrix:
      columns: [state]
      key: [state]
      rows:
        - [PENDING_INITIAL_REVIEW]
        - [REREVIEW_IN_PROGRESS]
    given: [{ use: "case_in_${state}" }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr2, dueAt: "2026-12-05T23:59:59Z" } }
    then: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }

  - name: rejects_reassigning_the_initial_reviewer_as_rereviewer
    basis: [RC-RRR-04]
    given: [{ use: rereviewer_assigned }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-r1, dueAt: "2026-12-05T23:59:59Z" } }
    then: { result: REJECTED, code: REREVIEWER_SAME_AS_REVIEWER }

  - name: rejects_a_blank_rereviewer_on_reassign
    basis: [RC-RRR-01]
    given: [{ use: rereviewer_assigned }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: "  ", dueAt: "2026-12-05T23:59:59Z" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: cancels_any_case_that_is_not_terminal
    basis: [RC-T-13, RC-T-14, RC-T-15, RC-T-16, RC-T-17, RC-T-18, RC-T-19, RC-CAN-S1, RC-CAN-S2]
    matrix:
      columns: [state]
      key: [state]
      rows:
        - [SELECTED_PENDING_ASSIGNMENT]
        - [PENDING_INITIAL_REVIEW]
        - [INITIAL_REVIEW_IN_PROGRESS]
        - [RETURNED]
        - [INITIAL_REVIEW_COMPLETED]
        - [PENDING_REREVIEW]
        - [REREVIEW_IN_PROGRESS]
    given:
      - use: "case_in_${state}"
    when: { run: CancelReviewCase, as: manager_h1, input: { caseId: "${c}", reason: "病歷資料有誤" } }
    then:
      result: SUCCESS
      emits:
        - { event: ReviewCaseCancelled, with: { caseId: "${c}", reason: "病歷資料有誤" } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: CANCELLED } } }

  - name: rejects_cancel_of_a_terminal_case
    basis: [RC-CAN-01]
    matrix:
      columns: [state]
      key: [state]
      rows:
        - [CLOSED]
        - [CANCELLED]
    given:
      - use: "case_in_${state}"
    when: { run: CancelReviewCase, as: manager_h1, input: { caseId: "${c}", reason: "病歷資料有誤" } }
    then: { result: REJECTED, code: CASE_TERMINAL }

  - name: rejects_a_blank_cancel_reason
    basis: [RC-CAN-02]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: CancelReviewCase, as: manager_h1, input: { caseId: "${c}", reason: "" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: cancel_reason_is_escaped_in_the_audit_detail
    basis: [RC-CAN-S3]
    given:
      - use: case_in_PENDING_INITIAL_REVIEW
      - run: CancelReviewCase
        as: manager_h1
        input: { caseId: "${c}", reason: "第一行\n\"第二行\"" }
    when: { run: ListAuditTrails, as: manager_h1, input: { aggregateType: ReviewCase, aggregateId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "content[action=CANCELLED]": { detail: '{"reason":"第一行\n\"第二行\""}' }

  - name: closes_without_rereview
    basis: [RC-T-12, RC-CWR-S1, RC-CWR-S2]
    given: [{ use: low_score_fixed_case }]
    when: { run: CloseWithoutRereview, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      emits:
        - { event: CaseClosedWithoutRereview, with: { caseId: "${c}" } }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect: { result: SUCCESS, output: { "content[caseId=${c}]": { status: CLOSED } } }
      - run: ListAuditTrails
        as: manager_h1
        input: { aggregateType: ReviewCase, aggregateId: "${c}" }
        expect:
          result: SUCCESS
          output:
            "content[action=CASE_CLOSED_WITHOUT_REREVIEW]": { detail: '{"finalScore":5}' }

  - name: rejects_close_before_fixing
    basis: [RC-CWR-02]
    given: [{ use: low_score_completed_case }]
    when: { run: CloseWithoutRereview, as: manager_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: INVALID_STATE_TRANSITION }

  - name: rejects_close_of_a_case_in_rereview
    basis: [RC-CWR-01]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: CloseWithoutRereview, as: manager_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }

  # ---------- 請求端（D-073、D-074；格式 v2.1） ----------
  # 這些拒絕發生在讀取請求本文時、進入 use case 之前，所以案件只需要存在。

  - name: rejects_a_due_at_without_a_time_zone
    basis: [RC-G-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    matrix:
      columns: [endpoint, field]
      key: [endpoint]
      rows:
        - [assign-reviewer,     reviewerId]
        - [reassign-reviewer,   reviewerId]
        - [assign-rereviewer,   rereviewerId]
        - [reassign-rereviewer, rereviewerId]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/${endpoint}"
        body_raw: '{"${field}":"u-r1","dueAt":"2026-11-26T23:59:00"}'
      as: manager_h1
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output: { "content[caseId=${c}]": { status: SELECTED_PENDING_ASSIGNMENT } }
          absent: ["content[caseId=${c}].dueAt"]

  # D-088 第 7 點（修訂 D-073 第 3 點）：其他讀不進來的本文回 400 BAD_REQUEST，有外殼。
  # 它是 RC-G-05 的邊界：讀不進來、但不是時間格式的問題時，不回 VALIDATION_ERROR。
  - name: rejects_an_unreadable_body_as_a_bad_request
    basis: [RC-G-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/assign-reviewer"
        body_raw: '{"reviewerId":'
      as: manager_h1
    then: { result: REJECTED, code: BAD_REQUEST }

