  - name: rejects_a_draft_answer_without_a_value
    basis: [RC-DRF-04, RC-INV-07]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: SaveInitialReviewDraft, as: reviewer_h1, input: { caseId: "${c}", answers: [{ itemId: I1 }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_an_initial_revision_without_answers
    basis: [RC-RVI-10]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", comment: "修正初審" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_a_rereview_draft_without_a_submission
    basis: [RC-RDR-10]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when: { run: SaveRereviewDraft, as: rereviewer_h1, input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "10" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_a_rereview_draft_without_answers
    basis: [RC-RDR-10]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when: { run: SaveRereviewDraft, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

