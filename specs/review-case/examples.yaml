    basis: [RC-SRR-11]
    given: [{ use: rereview_answered }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", comment: "複審評語" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_a_return_without_a_reason
