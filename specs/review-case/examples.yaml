  # ---------- 請求端：查詢參數與請求的欄位（D-088 第 11 點；H-5、H-7、H-8、H-9） ----------
  # H-5：查詢參數的列舉由 use case 檢查，角色在前（D-024）。H-7：讀不進來的查詢參數回 BAD_REQUEST，有外殼。
  # H-8：經過 HTTP 的成功範例，確認請求的欄位名稱有傳到 use case。業務規則仍由上面的 use case 範例驗證。

  - name: rejects_an_unknown_case_status_in_the_query
