        input: { caseId: "${c}", rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" }
        expect: { result: REJECTED, code: REREVIEWER_HAS_READ_INITIAL }

  - name: rejects_reassigning_to_a_rereviewer_who_read_the_submission
    basis: [RC-RRR-05, RC-SBV-03]
    given: [{ use: rereviewer_assigned }]
    when: { run: GetSubmissionDetail, as: rr2_as_auditor_h1, input: { submissionId: "${s1}" } }
    then: { result: SUCCESS, output: { totalScore: "20" } }
    observe:
      - run: ReassignRereviewer
        as: manager_h1
        input: { caseId: "${c}", rereviewerId: u-rr2, dueAt: "2026-12-05T23:59:59Z" }
        expect: { result: REJECTED, code: REREVIEWER_HAS_READ_INITIAL }

  # D-084 第 1 點：已立法的修正歷史也是院區先於多角色。
  - name: rejects_revision_history_for_a_dual_role_actor_of_another_hospital
    basis: [RC-G-03, RC-RVH-01]
    given: [{ use: rereview_submitted }]
    when: { run: GetRevisionHistory, as: dual_role_h2, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }

  # ---------- 讀取：分派頁（D-084） ----------

  - name: assignment_context_of_a_selected_case
    basis: [RC-ACX-01, RC-ACX-06]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { status: SELECTED_PENDING_ASSIGNMENT, pageMode: ASSIGN_INITIAL, blocked: false, allowedActions: [ASSIGN_REVIEWER] }
      absent: [blockedReason, currentReviewer, currentRereviewer]

  - name: assignment_context_of_a_case_pending_initial_review
    basis: [RC-ACX-02, RC-ACX-06]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { pageMode: REASSIGN_INITIAL, allowedActions: [REASSIGN_REVIEWER], "currentReviewer.userId": u-r1, effectiveDueAt: "2026-11-26T23:59:59Z" }

  - name: assignment_context_of_a_case_pending_rereview
    basis: [RC-ACX-03]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { pageMode: MIXED_ASSIGNMENT, allowedActions: [ASSIGN_REREVIEWER] }
      absent: [currentRereviewer]

  - name: assignment_context_after_a_rereviewer_is_assigned
    basis: [RC-ACX-03, RC-ACX-06]
    given: [{ use: rereviewer_assigned }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { pageMode: MIXED_ASSIGNMENT, allowedActions: [REASSIGN_REREVIEWER], "currentRereviewer.userId": u-rr1, effectiveDueAt: "2026-12-03T23:59:59Z" }

  # D-084 第 5 點：退回的案件要先重開，分派頁唯讀。
  - name: assignment_context_of_a_returned_case_is_blocked
    basis: [RC-ACX-04]
    given: [{ use: case_in_RETURNED }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { pageMode: READONLY_BLOCKED, blocked: true, blockedReason: CASE_NOT_ASSIGNABLE_IN_CURRENT_STATUS, allowedActions: [] }

  - name: assignment_context_of_a_case_in_initial_review_is_blocked
    basis: [RC-ACX-04]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { pageMode: READONLY_BLOCKED, blockedReason: CASE_NOT_ASSIGNABLE_IN_CURRENT_STATUS, allowedActions: [] }

  - name: assignment_context_of_a_closed_case_is_blocked
    basis: [RC-ACX-05]
    given: [{ use: case_in_CLOSED }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { pageMode: READONLY_BLOCKED, blockedReason: CASE_ALREADY_CLOSED, allowedActions: [] }

  - name: assignment_context_of_a_cancelled_case_is_blocked
    basis: [RC-ACX-05]
    given: [{ use: case_in_CANCELLED }]
    when: { run: GetCaseAssignmentContext, as: manager_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output: { pageMode: READONLY_BLOCKED, blockedReason: CASE_ALREADY_CANCELLED, allowedActions: [] }

  - name: rejects_assignment_context_for_an_auditor
    basis: [RC-G-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetCaseAssignmentContext, as: auditor_h1, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_assignment_context_of_another_hospital
    basis: [RC-G-03]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetCaseAssignmentContext, as: manager_h2, input: { caseId: "${c}" } }
    then: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }

  # ---------- 作答的檢查與計分（D-085） ----------
  # low_score_completed_case 的評分表：I1 是 RANGE、滿分 20、權重 1；初審作答 5 分。拒絕時不寫入。

  - name: rejects_a_non_numeric_range_answer
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "abc" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: rejects_a_negative_range_answer
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "-1" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: rejects_a_range_answer_above_the_maximum
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "21" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: rejects_a_range_answer_with_three_decimals
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "5.555" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: rejects_an_answer_to_an_unknown_item
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "6" }, { itemId: X9, answerValue: "3" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: rejects_two_answers_to_the_same_item
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "3" }, { itemId: I1, answerValue: "4" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: rejects_an_answer_without_a_value
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1 }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: rejects_an_answer_without_an_item
    basis: [RC-RVI-10, RC-INV-07]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ answerValue: "6" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }
    observe:
      - run: GetRevisionHistory
        as: reviewer_h1
        input: { caseId: "${c}" }
        expect: { result: SUCCESS, output: { "entries[submissionId=${s1}]": { status: SUBMITTED, totalScore: "5" } } }

  - name: accepts_a_range_answer_with_two_decimals
    basis: [RC-INV-07, RC-INV-08]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "5.55" }] } }
    then: { result: SUCCESS, output: { totalScore: "5.55" } }

  - name: accepts_a_range_answer_equal_to_the_maximum
    basis: [RC-INV-07, RC-INV-08]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "20" }] } }
    then: { result: SUCCESS, output: { totalScore: "20" } }

  # 預設專案的 I1 是 FIXED（滿分 20）：作答內容不影響分數。
  - name: a_fixed_item_scores_the_maximum_whatever_the_answer
    basis: [RC-INV-08]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: SaveInitialReviewDraft, as: reviewer_h1, input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "false" }] } }
    then: { result: SUCCESS, output: { totalScore: "20" } }

  - name: rejects_saving_an_initial_draft_with_an_unknown_item
    basis: [RC-DRF-04, RC-INV-07]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: SaveInitialReviewDraft, as: reviewer_h1, input: { caseId: "${c}", answers: [{ itemId: I1, answerValue: "20" }, { itemId: X9, answerValue: "1" }] } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  # 複審草稿保存時不計分，不合法的作答在提交時才擋下（RC-SRR-10）。
  - name: rejects_submitting_a_rereview_draft_with_an_invalid_answer
    basis: [RC-SRR-10, RC-INV-07]
    given: [{ use: weighted_rereview_answered }]
    when: { run: SaveRereviewDraft, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "abc" }], comment: "複審評語" } }
    then: { result: SUCCESS }
    observe:
      - run: SubmitRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}" }
        expect: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_revising_a_rereview_with_an_invalid_answer
    basis: [RC-RVR-10, RC-INV-07]
    given: [{ use: weighted_rereview_answered }]
    when: { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}" } }
    then: { result: SUCCESS }
    observe:
      - run: ReviseRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "25" }], comment: "改" }
        expect: { result: REJECTED, code: VALIDATION_ERROR }

  # ---------- 修正歷史的可見規則（D-085 第 12 點） ----------

  - name: rereviewer_history_hides_the_initial_review
    basis: [RC-VIS-02]
    given: [{ use: rereview_submitted }]
    when: { run: GetRevisionHistory, as: rereviewer_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "entries[stage=INITIAL]": { submissionId: "${s1}", status: SUBMITTED, reviewerId: u-r1 }
        "entries[stage=REREVIEW]": { submissionId: "${s2}", totalScore: "20", comment: "複審評語" }
      absent: ["entries[stage=INITIAL].totalScore", "entries[stage=INITIAL].comment"]

  - name: reviewer_history_shows_the_rereview
    basis: [RC-VIS-04]
    given: [{ use: rereview_submitted }]
    when: { run: GetRevisionHistory, as: reviewer_h1, input: { caseId: "${c}" } }
    then:
      result: SUCCESS
      output:
        "entries[stage=REREVIEW]": { submissionId: "${s2}", totalScore: "20", comment: "複審評語" }

  # ---------- D-083 之後做得出來的前提（D-085 第 13 點） ----------

  - name: rejects_fixing_a_superseded_initial_review
    basis: [RC-FIX-04]
    given: [{ use: low_score_completed_case }]
    when: { run: ReviseInitialReview, as: reviewer_h1, input: { caseId: "${c}", submissionId: "${s1}", answers: [{ itemId: I1, answerValue: "6" }] } }
    then: { result: SUCCESS }
    observe:
      - run: FixInitialReview
        as: reviewer_h1
        input: { caseId: "${c}", submissionId: "${s1}" }
        expect: { result: REJECTED, code: CONFLICT }

  - name: rejects_closing_with_a_superseded_rereview
    basis: [RC-CLR-07]
    given: [{ use: rereview_submitted }]
    when: { run: ReviseRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "5" }], comment: "修正複審" } }
    then: { result: SUCCESS }
    observe:
      - run: CloseRereview
        as: rereviewer_h1
        input: { caseId: "${c}", submissionId: "${s2}" }
        expect: { result: REJECTED, code: CONFLICT }

  # ---------- 儀表板摘要（D-087）。範例的時鐘從 2026-11-19T09:00:00Z 開始，案件的建立時間就是這個時間 ----------

  - name: dashboard_counts_an_open_case
    basis: [RC-DSH-07, RC-DSH-08, RC-DSH-03]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 1, closedCases: 0, rereviewedCases: 0, completionRate: 0, rereviewRate: 0 } }

  - name: dashboard_counts_an_assigned_rereviewer
    basis: [RC-DSH-07, RC-DSH-08]
    given: [{ use: rereviewer_assigned }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 1, closedCases: 0, rereviewedCases: 1, completionRate: 0, rereviewRate: 1 } }

  - name: dashboard_counts_a_closed_case
    basis: [RC-DSH-07, RC-DSH-08]
    given: [{ use: case_in_CLOSED }]
    when: { run: GetDashboardSummary, as: auditor_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 1, closedCases: 1, rereviewedCases: 1, completionRate: 1, rereviewRate: 1 } }

  # D-087 第 4 點：已取消的案件不計入；沒有案件時比率都是 0。
  - name: dashboard_leaves_out_cancelled_cases
    basis: [RC-DSH-07, RC-DSH-08]
    given: [{ use: case_in_CANCELLED }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 0, closedCases: 0, rereviewedCases: 0, completionRate: 0, rereviewRate: 0, overdueRate: 0 } }

  # ---------- 逾期（D-095）。clock_start 是 2026-11-19T09:00:00Z；fixture 的初審期限 2026-11-26T23:59:59Z、複審期限 2026-12-03T23:59:59Z ----------

  # 兩個期限都過了之後，只有初審階段與已指派複審的複審階段算逾期。
  - name: dashboard_overdue_by_state
    basis: [RC-DSH-09]
    matrix:
      columns: [state, overdue]
      key: [state]
      rows:
        - [SELECTED_PENDING_ASSIGNMENT, 0]
        - [PENDING_INITIAL_REVIEW,      1]
        - [INITIAL_REVIEW_IN_PROGRESS,  1]
        - [INITIAL_REVIEW_COMPLETED,    0]
        - [RETURNED,                    0]
        - [PENDING_REREVIEW,            0]
        - [REREVIEW_IN_PROGRESS,        1]
        - [CLOSED,                      0]
    given: [{ use: "case_in_${state}" }, { advance: P15D }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 1, overdueCases: "${overdue}" } }

  - name: dashboard_overdue_after_the_rereview_deadline_once_assigned
    basis: [RC-DSH-09]
    given: [{ use: rereviewer_assigned }, { advance: P15D }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 1, overdueCases: 1, overdueRate: 1 } }

  # 複審階段看複審期限：初審期限已過、複審期限未到，不算逾期。
  - name: dashboard_rereview_stage_ignores_the_initial_deadline
    basis: [RC-DSH-09]
    given: [{ use: rereviewer_assigned }, { advance: P8D }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 1, overdueCases: 0, overdueRate: 0 } }

  # 邊界（D-095 第 2 點）：期限等於現在不算，早於現在才算。
  - name: dashboard_not_overdue_at_the_deadline
    basis: [RC-DSH-09]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }, { advance: PT182H59M59S }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { overdueCases: 0 } }

  - name: dashboard_overdue_one_second_after_the_deadline
    basis: [RC-DSH-09]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }, { advance: PT183H }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { overdueCases: 1 } }

  # 重開不改期限（D-095 第 3 點）：期限過後重開，立刻算逾期。
  - name: dashboard_reopened_case_keeps_its_deadline
    basis: [RC-DSH-09]
    given:
      - use: case_in_RETURNED
      - advance: P8D
      - { run: ReopenInitialReview, as: manager_h1, input: { caseId: "${c}" } }
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { overdueCases: 1 } }

  - name: dashboard_does_not_take_the_requested_hospital
    basis: [RC-DSH-03]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetDashboardSummary, as: manager_h2, input: { hospitalId: H-01, projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 0 } }

  - name: system_admin_dashboard_covers_other_hospitals
    basis: [RC-DSH-04]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetDashboardSummary, as: admin, input: { projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 1 } }

  - name: system_admin_dashboard_narrows_to_a_hospital
    basis: [RC-DSH-04]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetDashboardSummary, as: admin, input: { hospitalId: H-02, projectId: "${p}" } }
    then: { result: SUCCESS, output: { totalCases: 0 } }

  - name: dashboard_of_an_unknown_project_is_empty
    basis: [RC-DSH-05]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: no-such-project } }
    then: { result: SUCCESS, output: { totalCases: 0, completionRate: 0 } }

  # 含起：from 等於建立時間的案件算在內。
  - name: dashboard_range_includes_the_start
    basis: [RC-DSH-06]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}", from: "2026-11-19T09:00:00Z", to: "2026-11-19T10:00:00Z" } }
    then: { result: SUCCESS, output: { totalCases: 1 } }

  # 不含迄：to 等於建立時間的案件不算。
  - name: dashboard_range_excludes_the_end
    basis: [RC-DSH-06]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: GetDashboardSummary, as: manager_h1, input: { projectId: "${p}", from: "2026-11-19T08:00:00Z", to: "2026-11-19T09:00:00Z" } }
    then: { result: SUCCESS, output: { totalCases: 0 } }

  - name: rejects_dashboard_with_only_one_end_of_the_range
    basis: [RC-DSH-01]
    when: { run: GetDashboardSummary, as: manager_h1, input: { from: "2026-11-19T09:00:00Z" } }
    then: { result: REJECTED, code: BAD_REQUEST }

  - name: rejects_dashboard_with_an_empty_range
    basis: [RC-DSH-02]
    when: { run: GetDashboardSummary, as: manager_h1, input: { from: "2026-11-19T09:00:00Z", to: "2026-11-19T09:00:00Z" } }
    then: { result: REJECTED, code: BAD_REQUEST }

  # D-087 第 2 點：角色的檢查在輸入的檢查之前。
  - name: rejects_dashboard_by_a_reviewer_before_checking_the_range
    basis: [RC-G-01]
    when: { run: GetDashboardSummary, as: reviewer_h1, input: { from: "2026-11-19T09:00:00Z" } }
    then: { result: REJECTED, code: ROLE_DENIED }

  # ---------- 匯出（D-087 第 8 點；D-055 第 6 點、D-057） ----------

  # 初審已提交、還沒固定：之後還可能指派複審醫師，分數遮罩。
  - name: export_masks_scores_while_a_rereviewer_can_still_be_assigned
    basis: [RC-RPT-06, RC-RPT-08, RC-RPT-04]
    given: [{ use: case_in_INITIAL_REVIEW_COMPLETED }]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then:
      result: SUCCESS
      output:
        reportType: REVIEW_COMPLETION
        page: 0
        size: 100
        totalElements: 1
        totalPages: 1
        rows:
          - { caseId: "${c}", projectId: "${p}", hospitalId: H-01, status: INITIAL_REVIEW_COMPLETED, reviewerId: u-r1, maskedFields: [initialScore, finalScore] }
      absent: ["rows[*].initialScore", "rows[*].finalScore"]

  # 初審 20 分、複審 20 分、權重各 0.50：finalScore = 20。
  - name: export_shows_scores_of_a_closed_case
    basis: [RC-RPT-11, RC-RPT-12]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then:
      result: SUCCESS
      output:
        rows:
          - { caseId: "${c}", status: CLOSED, reviewerId: u-r1, rereviewerId: u-rr1, initialScore: "20", finalScore: "20", maskedFields: [] }
        summary.totalCases: 1
        summary.closedCases: 1
        summary.rereviewedCases: 1
        summary.completionRate: 1

  - name: auditor_export_shows_scores_of_a_closed_case
    basis: [RC-RPT-11]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: auditor_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then: { result: SUCCESS, output: { rows: [{ caseId: "${c}", initialScore: "20", finalScore: "20", maskedFields: [] }] } }

  - name: system_admin_export_has_no_scores
    basis: [RC-RPT-07, RC-RPT-05]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: admin, input: { reportType: REVIEW_COMPLETION, hospitalId: H-01, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then:
      result: SUCCESS
      output: { rows: [{ caseId: "${c}", hospitalId: H-01, status: CLOSED, reviewerId: u-r1, rereviewerId: u-rr1, createdAt: "2026-11-19T09:00:00Z" }] }
      only:
        "rows[*]": [caseId, hospitalId, status, reviewerId, rereviewerId, createdAt, closedAt]
      absent: ["rows[*].initialScore", "rows[*].finalScore"]

  - name: system_admin_export_narrows_to_a_hospital
    basis: [RC-RPT-05]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: admin, input: { reportType: REVIEW_COMPLETION, hospitalId: H-02, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then: { result: SUCCESS, output: { rows: [], totalElements: 0 } }

  # u-rr1 是這個案件的複審醫師，改用 AUDITOR 角色匯出：結案後也拿不到分數。
  - name: rereviewer_exporting_in_another_role_gets_no_scores
    basis: [RC-RPT-09]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: rr1_as_auditor_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then:
      result: SUCCESS
      output: { rows: [{ caseId: "${c}", status: CLOSED, maskedFields: [initialScore, finalScore] }] }
      absent: ["rows[*].initialScore", "rows[*].finalScore"]

  - name: export_does_not_take_the_requested_hospital
    basis: [RC-RPT-04]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: manager_h2, input: { reportType: REVIEW_COMPLETION, hospitalId: H-01, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then: { result: SUCCESS, output: { rows: [], totalElements: 0, summary.totalCases: 0 } }

  - name: export_leaves_out_cases_created_outside_the_range
    basis: [RC-RPT-06, RC-RPT-12]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T10:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then: { result: SUCCESS, output: { rows: [], totalElements: 0, totalPages: 0, summary.totalCases: 0 } }

  - name: export_page_beyond_the_end_is_empty
    basis: [RC-RPT-06, RC-RPT-12]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z", page: 1, size: 1 } }
    then: { result: SUCCESS, output: { rows: [], page: 1, size: 1, totalElements: 1, totalPages: 1, summary.totalCases: 1 } }

  - name: export_normalizes_the_page_and_caps_the_size
    basis: [RC-RPT-06]
    given: [{ use: case_in_CLOSED }]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z", page: -1, size: 5000 } }
    then: { result: SUCCESS, output: { page: 0, size: 1000, totalElements: 1 } }

  # D-087 第 4 點：已取消的案件在逐案資料列裡，不在摘要的件數裡。
  - name: export_lists_cancelled_cases_but_the_summary_leaves_them_out
    basis: [RC-RPT-06, RC-RPT-12, RC-DSH-07]
    given: [{ use: case_in_CANCELLED }]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then:
      result: SUCCESS
      output:
        totalElements: 1
        rows: [{ caseId: "${c}", status: CANCELLED }]
        summary.totalCases: 0
        summary.completionRate: 0

  - name: rejects_export_of_an_unsupported_report_type
    basis: [RC-RPT-01]
    when: { run: ExportReport, as: manager_h1, input: { reportType: MONTHLY, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" } }
    then: { result: REJECTED, code: BAD_REQUEST }

  - name: rejects_export_without_the_end_of_the_range
    basis: [RC-RPT-02]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z" } }
    then: { result: REJECTED, code: BAD_REQUEST }

  - name: rejects_export_with_an_empty_range
    basis: [RC-RPT-03]
    when: { run: ExportReport, as: manager_h1, input: { reportType: REVIEW_COMPLETION, from: "2026-11-20T00:00:00Z", to: "2026-11-19T00:00:00Z" } }
    then: { result: REJECTED, code: BAD_REQUEST }

  # D-087 第 2 點：角色的檢查在輸入的檢查之前。
  - name: rejects_export_by_a_reviewer_before_checking_the_input
    basis: [RC-G-01]
    when: { run: ExportReport, as: reviewer_h1, input: { reportType: MONTHLY } }
    then: { result: REJECTED, code: ROLE_DENIED }

  # ---------- HTTP 契約的涵蓋（D-088 第 4 點；格式 v2.1） ----------
  # 業務規則由上面的 use case 範例驗證。這幾個範例經過 HTTP，讓 http.yaml 裡可為 null 的欄位觀察到有值的回應（D-061 第 3 點）。

  # D-088 第 3 點：案件的建立時間是抽選出案件的時間（範例的時鐘起點）。
  - name: lists_the_creation_time_of_a_case
    basis: [RC-LST-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: ListReviewCases, as: manager_h1, input: { batchId: "${b}" } }
    then:
      result: SUCCESS
      output: { "content[caseId=${c}]": { createdAt: "2026-11-19T09:00:00Z" } }

  - name: shows_the_creation_time_in_the_case_detail
    basis: [RC-DTV-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when: { run: GetReviewCaseDetail, as: manager_h1, input: { caseId: "${c}" } }
    then: { result: SUCCESS, output: { projectionType: FULL, createdAt: "2026-11-19T09:00:00Z" } }

  - name: lists_a_case_with_both_doctors_over_http
    basis: [RC-LST-01]
    given: [{ use: case_in_CLOSED }]
    when:
      http: { method: GET, path: /review-cases, query: { batchId: "${b}" } }
      as: manager_h1
    then:
      result: SUCCESS
      output: { "content[caseId=${c}]": { status: CLOSED, reviewerId: u-r1, rereviewerId: u-rr1 } }

  - name: reads_a_closed_case_detail_over_http
    basis: [RC-DTV-01]
    given: [{ use: case_in_CLOSED }]
    when:
      http: { method: GET, path: "/review-cases/${c}" }
      as: manager_h1
    then: { result: SUCCESS, output: { projectionType: FULL, status: CLOSED } }

  - name: reads_a_cancelled_case_detail_over_http
    basis: [RC-DTV-01]
    given: [{ use: case_in_CANCELLED }]
    when:
      http: { method: GET, path: "/review-cases/${c}" }
      as: manager_h1
    then: { result: SUCCESS, output: { projectionType: FULL, status: CANCELLED } }

  - name: reads_an_own_draft_over_http
    basis: [RC-SBV-03]
    given: [{ use: answered_case }]
    when:
      http: { method: GET, path: "/review-submissions/${s1}" }
      as: reviewer_h1
    then: { result: SUCCESS, output: { submissionId: "${s1}", status: DRAFT } }

  - name: reads_the_assignment_context_with_a_rereviewer_over_http
    basis: [RC-ACX-01]
    given: [{ use: rereviewer_assigned }]
    when:
      http: { method: GET, path: "/review-cases/${c}/assignment-context" }
      as: manager_h1
    then: { result: SUCCESS, output: { caseId: "${c}", "currentRereviewer.userId": u-rr1 } }

  - name: exports_a_closed_case_over_http
    basis: [RC-RPT-06]
    given: [{ use: case_in_CLOSED }]
    when:
      http:
        method: POST
        path: /reports/export
        body: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" }
      as: manager_h1
    then: { result: SUCCESS, output: { "rows[caseId=${c}]": { status: CLOSED, reviewerId: u-r1, rereviewerId: u-rr1 } } }

  - name: exports_masked_scores_for_a_system_admin_over_http
    basis: [RC-RPT-07]
    given: [{ use: case_in_CLOSED }]
    when:
      http:
        method: POST
        path: /reports/export
        body: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" }
      as: admin
    then:
      result: SUCCESS
      output: { "rows[caseId=${c}]": { status: CLOSED, reviewerId: u-r1, rereviewerId: u-rr1 } }
      only:
        "rows[*]": [caseId, hospitalId, status, reviewerId, rereviewerId, createdAt, closedAt]

  # metadata 形狀裡可為 null 的欄位（reviewerId、rereviewerId、closedAt）：這個案件都還沒有。
  - name: exports_an_unassigned_case_for_a_system_admin_over_http
    basis: [RC-RPT-07]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: POST
        path: /reports/export
        body: { reportType: REVIEW_COMPLETION, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" }
      as: admin
    then:
      result: SUCCESS
      output: { "rows[caseId=${c}]": { status: SELECTED_PENDING_ASSIGNMENT } }
      only:
        "rows[*]": [caseId, hospitalId, status, createdAt]

  # 空的列表同時符合 full 與 metadata 兩種形狀，不算違反（D-100 第 10 點，specs/README.md 第七節）。
  - name: lists_nothing_for_another_hospital_over_http
    basis: [RC-LST-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http: { method: GET, path: /review-cases, query: { batchId: "${b}" } }
      as: manager_h2
    then: { result: SUCCESS, output: { content: [], totalElements: 0 } }

  - name: exports_nothing_for_another_hospital_over_http
    basis: [RC-RPT-05]
    given: [{ use: case_in_CLOSED }]
    when:
      http:
        method: POST
        path: /reports/export
        body: { reportType: REVIEW_COMPLETION, hospitalId: H-02, from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" }
      as: admin
    then: { result: SUCCESS, output: { rows: [], totalElements: 0 } }

  # 列表的 metadata 形狀（D-100）：一個三個可為 null 的欄位都有值，一個都沒有。
  - name: lists_a_closed_case_for_a_system_admin_over_http
    basis: [RC-LST-03]
    given: [{ use: case_in_CLOSED }]
    when:
      http: { method: GET, path: /review-cases, query: { batchId: "${b}" } }
      as: admin
    then:
      result: SUCCESS
      output: { "content[caseId=${c}]": { status: CLOSED, reviewerId: u-r1, rereviewerId: u-rr1, projectionType: METADATA_ONLY } }
      only:
        "content[*]": [caseId, batchId, hospitalId, status, reviewerId, rereviewerId, dueAt, projectionType]

  - name: lists_an_unassigned_case_for_a_system_admin_over_http
    basis: [RC-LST-03]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http: { method: GET, path: /review-cases, query: { batchId: "${b}" } }
      as: admin
    then:
      result: SUCCESS
      output: { "content[caseId=${c}]": { status: SELECTED_PENDING_ASSIGNMENT, projectionType: METADATA_ONLY } }
      only:
        "content[*]": [caseId, batchId, hospitalId, status, projectionType]

  # ---------- 必填的輸入（D-088 第 11 點，H-6） ----------
  # 請求 dto 的必填檢查交給 use case：這些範例直接呼叫 use case，確認沒有 dto 也會拒絕。

  - name: rejects_reassign_without_a_reviewer
    basis: [RC-RAS-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when: { run: ReassignReviewCase, as: manager_h1, input: { caseId: "${c}", dueAt: "2026-11-28T23:59:59Z" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_rereviewer_assignment_without_a_rereviewer
    basis: [RC-ARR-02]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when: { run: AssignRereviewer, as: manager_h1, input: { caseId: "${c}", dueAt: "2026-12-03T23:59:59Z" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_rereviewer_reassignment_without_a_rereviewer
    basis: [RC-RRR-01]
    given: [{ use: rereviewer_assigned }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", dueAt: "2026-12-05T23:59:59Z" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_rereviewer_reassignment_without_a_due_date
    basis: [RC-RRR-01]
    given: [{ use: rereviewer_assigned }]
    when: { run: ReassignRereviewer, as: manager_h1, input: { caseId: "${c}", rereviewerId: u-rr2 } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_a_draft_without_answers
    basis: [RC-DRF-04]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when: { run: SaveInitialReviewDraft, as: reviewer_h1, input: { caseId: "${c}", comment: "初審評語" } }
    then: { result: REJECTED, code: VALIDATION_ERROR }

  - name: rejects_a_draft_answer_without_an_item
    basis: [RC-DRF-04, RC-INV-07]
