        finalScore: "20.00"
        "submissions[stage=INITIAL]": { submissionId: "${s1}", totalScore: "20" }
        "initialReviewContext.blockedReason": ROLE_DENIED
        "rereviewContext.blockedReason": ROLE_DENIED

