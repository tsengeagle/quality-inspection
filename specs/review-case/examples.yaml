      http:
        method: GET
        path: "/review-cases"
        query: { status: NOT_A_STATUS }
      as: manager_h1
    then: { result: REJECTED, code: BAD_REQUEST }

  - name: checks_the_role_before_the_candidate_role
    basis: [RC-G-01, RC-ACD-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: GET
        path: "/review-cases/${c}/assignment-candidates"
        query: { role: NOT_A_ROLE }
      as: reviewer_h1
    then: { result: REJECTED, code: ROLE_DENIED }

  - name: rejects_an_unknown_candidate_role
    basis: [RC-ACD-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
