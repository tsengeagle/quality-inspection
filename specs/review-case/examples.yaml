    basis: [RC-ACD-05]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: GET
        path: "/review-cases/${c}/assignment-candidates"
      as: manager_h1
    then: { result: REJECTED, code: BAD_REQUEST }


  - name: rejects_an_unreadable_page_number
    basis: [RC-LST-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: GET
        path: "/review-cases"
        query: { page: abc }
      as: manager_h1
    then: { result: REJECTED, code: BAD_REQUEST }


  - name: rejects_an_unreadable_time_in_the_query
    basis: [RC-AUD-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: GET
        path: "/audit-trails"
        query: { from: not-a-time }
      as: auditor_h1
    then: { result: REJECTED, code: BAD_REQUEST }

  - name: rejects_an_anonymous_request
    basis: [RC-G-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: GET
        path: "/review-cases"
      as: anonymous
    then: { result: REJECTED, code: UNAUTHORIZED }

  - name: assigns_a_reviewer_over_http
    basis: [RC-ASG-01]
    given: [{ use: case_in_SELECTED_PENDING_ASSIGNMENT }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/assign-reviewer"
        body: { reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" }
      as: manager_h1
    then: { result: SUCCESS }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output: { "content[caseId=${c}]": { status: PENDING_INITIAL_REVIEW, reviewerId: u-r1, dueAt: "2026-11-26T23:59:59Z" } }

  - name: reassigns_the_reviewer_over_http
    basis: [RC-RAS-02]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/reassign-reviewer"
        body: { reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" }
      as: manager_h1
    then: { result: SUCCESS }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output: { "content[caseId=${c}]": { reviewerId: u-r2, dueAt: "2026-11-28T23:59:59Z" } }

  - name: cancels_a_case_over_http
    basis: [RC-CAN-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/cancel"
        body: { reason: "病歷資料有誤" }
      as: manager_h1
    then: { result: SUCCESS }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output: { "content[caseId=${c}]": { status: CANCELLED } }

  - name: returns_the_initial_review_over_http
    basis: [RC-RET-01]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/initial-review/return"
        body: { reason: "需補充病歷資料" }
      as: manager_h1
    then: { result: SUCCESS }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output: { "content[caseId=${c}]": { status: RETURNED } }

  - name: saves_the_initial_draft_over_http
    basis: [RC-DRF-01]
    given: [{ use: case_in_INITIAL_REVIEW_IN_PROGRESS }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/initial-review/draft"
        body: { answers: [{ itemId: I1, answerValue: "20" }], comment: "初審評語" }
      as: reviewer_h1
    then: { result: SUCCESS, output: { submissionId: "${s1}", status: DRAFT } }
    observe:
      - run: GetSubmissionDetail
        as: reviewer_h1
        input: { submissionId: "${s1}" }
        expect:
          result: SUCCESS
          output: { comment: "初審評語", "answers[itemId=I1]": { answerValue: "20" } }

  - name: revises_the_initial_review_over_http
    basis: [RC-RVI-01]
    given: [{ use: low_score_completed_case }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/initial-review/submissions/${s1}/revise"
        body: { answers: [{ itemId: I1, answerValue: "3" }], comment: "修正初審" }
      as: reviewer_h1
    then: { result: SUCCESS, output: { oldSubmissionId: "${s1}", revisionNo: 2, totalScore: "3" } }

  - name: assigns_a_rereviewer_over_http
    basis: [RC-ARR-01]
    given: [{ use: case_in_PENDING_REREVIEW }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/assign-rereviewer"
        body: { rereviewerId: u-rr1, dueAt: "2026-12-03T23:59:59Z" }
      as: manager_h1
    then: { result: SUCCESS }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output: { "content[caseId=${c}]": { rereviewerId: u-rr1 } }

  - name: reassigns_the_rereviewer_over_http
    basis: [RC-RRR-03]
    given: [{ use: rereviewer_assigned }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/reassign-rereviewer"
        body: { rereviewerId: u-rr2, dueAt: "2026-12-05T23:59:59Z" }
      as: manager_h1
    then: { result: SUCCESS }
    observe:
      - run: ListReviewCases
        as: manager_h1
        input: { batchId: "${b}" }
        expect:
          result: SUCCESS
          output: { "content[caseId=${c}]": { rereviewerId: u-rr2 } }

  - name: saves_the_rereview_draft_over_http
    basis: [RC-RDR-02]
    given: [{ use: case_in_REREVIEW_IN_PROGRESS }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/rereview/draft"
        body: { submissionId: "${s2}", answers: [{ itemId: I1, answerValue: "10" }], comment: "複審評語" }
      as: rereviewer_h1
    then: { result: SUCCESS, output: { submissionId: "${s2}", status: DRAFT } }

  - name: submits_the_rereview_over_http
    basis: [RC-SRR-01]
    given: [{ use: rereview_answered }, { advance: PT2H }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/rereview/submit"
        body: { submissionId: "${s2}", comment: "複審評語" }
      as: rereviewer_h1
    then: { result: SUCCESS, output: { submissionId: "${s2}", status: SUBMITTED } }

  - name: revises_the_rereview_over_http
    basis: [RC-RVR-01]
    given: [{ use: weighted_rereview_answered }, { run: SubmitRereview, as: rereviewer_h1, input: { caseId: "${c}", submissionId: "${s2}", comment: "複審評語" } }]
    when:
      http:
        method: POST
        path: "/review-cases/${c}/rereview/submissions/${s2}/revise"
        body: { answers: [{ itemId: I1, answerValue: "5" }], comment: "修正複審" }
      as: rereviewer_h1
    then: { result: SUCCESS, output: { oldSubmissionId: "${s2}", revisionNo: 2, totalScore: "5" } }

  - name: lists_audit_trails_over_http
    basis: [RC-AUD-01]
    given: [{ use: low_score_completed_case }]
    when:
      http:
        method: GET
        path: "/audit-trails"
        query: { aggregateType: ReviewCase, aggregateId: "${c}" }
      as: manager_h1
    then: { result: SUCCESS, output: { "content[action=ASSIGNED]": { detail: '{"reviewerId":"u-r1","dueAt":"2026-11-26T23:59:59Z"}' } } }

  - name: reads_the_dashboard_over_http
    basis: [RC-DSH-01]
    given: [{ use: case_in_PENDING_INITIAL_REVIEW }]
    when:
      http:
        method: GET
        path: "/reports/dashboard-summary"
        query: { projectId: "${p}", from: "2026-11-19T00:00:00Z", to: "2026-11-20T00:00:00Z" }
      as: manager_h1
    then: { result: SUCCESS, output: { totalCases: 1, closedCases: 0 } }

not_covered:
  - item: 修正時提交不存在、不是目前有效的結果、操作者不是受指派的複審醫師或不是提交者（RC-RVI-02、RC-RVI-06、RC-RVR-02、RC-RVR-03、RC-RVR-05、RC-RVR-07）
    # D-085：修正過之後，舊的提交是 SUPERSEDED，先被 SUBMISSION_NOT_SUBMITTED 擋下；「已提交但不是目前有效」仍做不出來
    reason: 不存在與身分的檢查與既有的提交、固定、結案相同（RC-SRR、RC-CLR、RC-FIX 已有範例）；已被取代的提交先被 SUBMISSION_NOT_SUBMITTED 擋下，要做出「已提交但不是目前有效」的提交需要直接改資料（D-083）
  - item: 案件清單、詳情的逾期
    reason: 逾期只出現在儀表板與匯出的摘要（D-095 第 6 點），其他查詢沒有輸出欄位表示逾期
  - item: 準備步驟的操作者讀過完整初審
    reason: 矩陣與觀察步驟裡 manager_h1、auditor_h1、reviewer_h1 的讀取會留下讀取者紀錄（D-055 第 5 點）。受派的複審醫師只有 u-rr1，它在準備步驟裡沒有讀過初審，所以不影響結果
  - item: 分派頁的候選人（RC-ACD-01～04）
    reason: 候選人來自人員目錄的埠（AssignmentCandidateDirectoryPort），範例執行器無法把 returns 轉成它的目錄項目，查詢的輸出又是最外層的清單，路徑語法指不到。改執行器是閘門的修改，不在本次範圍；由建構 PR 以單元測試驗證（D-084）
  - item: 複審醫師讀別人的複審提交（RC-SBD-02）
    reason: 通過讀取範圍的複審醫師只有目前的複審醫師與提交過複審的人；改派只在複審開始前，所以目前的複審醫師不會遇到別人已提交的複審。不在範圍內的複審醫師先被 RC-SBD-01 擋下（D-084）
  - item: BOOLEAN 題目的作答檢查與計分、權重不是 1 時的四捨五入（RC-INV-07、RC-INV-08 的一部分）
    reason: 範例的評分表只有 FIXED 與 RANGE、權重都是 1；由建構 PR 以單元測試驗證（D-085）
  - item: 提交初審時草稿的答案不合法（RC-SUB-04）
    reason: 初審草稿保存時就檢查（RC-DRF-04），範例做不出不合法的初審草稿；由建構 PR 以單元測試驗證（D-085）
  - item: 複審草稿記錄評分表版本（RC-STR-S4、RS-INV-05）
    reason: 沒有任何查詢輸出 basedOnScoreSheetVersionId；由建構 PR 以單元測試驗證（D-085）
  - item: 案件沒有 rereviewRequired、finalConclusion、ruleSnapshotRef（RC-INV-06）
    reason: 執行器把 null 與沒有欄位視為相同，範例看不出欄位是否移除；由建構 PR 以單元測試與 migration 驗證（D-084 第 9 點）
  - item: 初審固定的目標仍是草稿（RC-FIX-05）
    reason: 案件在 INITIAL_REVIEW_COMPLETED 時，初審的提交都已提交過；草稿只在 INITIAL_REVIEW_IN_PROGRESS 出現，那時固定先被 RC-FIX-03 擋下（D-085）。RC-FIX-04 已有範例
  - item: 提交不存在（RC-RDR-04、RC-SRR-04、RC-CLR-03）與不是目前有效的複審草稿（RC-RDR-08、RC-SRR-08）
    reason: 不存在的檢查與 RC-G-04 相同，固定初審已有範例。複審草稿只有開始複審時的那一份，改派只在複審開始前，所以做不出「是草稿但不是目前有效」（D-085）。RC-CLR-07 已有範例
  - rules: [RC-RPT-10, RC-RPT-13]
    reason: 複審指派歷史不完整的案件用 use case 做不出來（指派一定寫歷史）；讀取者紀錄與案件版本沒有查詢 use case 可以觀察。由既有的整合測試驗證（D-087 第 12 點）
  - item: 稽核紀錄同時間時的順序（RC-LCY-05、RC-AUD-04 的排序部分）
    reason: 範例比對清單時不比順序（specs/README.md 第四節）；由建構 PR 的整合測試驗證（D-092 第 4 點）
