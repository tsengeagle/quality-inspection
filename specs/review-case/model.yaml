# 格式說明見 ../README.md（規格格式 v2.0，第十節）。本檔是律法（spec 類），修改需要修法紀錄與簽章。
# 範圍：從抽選到初審提交的直向切片（D-066），加上初審固定到複審結案的複審切片（D-069），
# 以及退回、重開、取消、不經複審結案（D-080）。
# 來源：docs/harness/samples/reviewcase-v2-trial/round-2/review-case/（第二輪試寫）。
spec_version: 2
kind: aggregate
name: ReviewCase
term: 審查案件

identity: { name: caseId, type: id, assigned_by: system }

sources:
  - { decision: D-024 }
  - { decision: D-031 }
  - { decision: D-033 }
  - { decision: D-035 }
  - { decision: D-054 }
  - { decision: D-055 }
  - { decision: D-053 }
  - { decision: D-066 }
  - { decision: D-069 }
  - { decision: D-080 }
  - { decision: D-082 }
  - { decision: D-083 }
  - { doc: docs/02-ddd/state-machine.md, section: "§3" }
  - { doc: docs/02-ddd/permission-matrix.md, section: "§5、§5.1、§6" }

enums:
  - name: CaseStatus
    values:
      - SELECTED_PENDING_ASSIGNMENT
      - PENDING_INITIAL_REVIEW
      - INITIAL_REVIEW_IN_PROGRESS
      - INITIAL_REVIEW_COMPLETED
      - PENDING_REREVIEW
      - REREVIEW_IN_PROGRESS
      - RETURNED
      - CLOSED
      - CANCELLED
    status: decided
    source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.1" }]

attributes:
  - { name: hospitalId, type: id,              required: true,  mutable: false }
  - { name: status,     type: enum CaseStatus, required: true,  initial: SELECTED_PENDING_ASSIGNMENT }
  - { name: reviewerId, type: id,              required: false }
  - { name: assignedAt, type: datetime,        required: false }
  - { name: dueAt,      type: datetime,        required: false }
  - { name: initialFixedAt,  type: datetime,     required: false }
  - { name: rereviewerId,    type: id,           required: false }
  - { name: rereviewerDueAt, type: datetime,     required: false }

transitions:
  - { id: RC-T-01, from: SELECTED_PENDING_ASSIGNMENT, to: PENDING_INITIAL_REVIEW,     by: AssignReviewCase,    status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
  - { id: RC-T-02, from: PENDING_INITIAL_REVIEW,      to: INITIAL_REVIEW_IN_PROGRESS, by: StartInitialReview,  status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
  - { id: RC-T-03, from: INITIAL_REVIEW_IN_PROGRESS,  to: INITIAL_REVIEW_COMPLETED,   by: SubmitInitialReview, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { decision: D-054 }] }
  - { id: RC-T-04, from: INITIAL_REVIEW_COMPLETED,    to: INITIAL_REVIEW_COMPLETED,   by: FixInitialReview,    when: 分數不大於品質線，或品質線沒有設定, status: decided, source: [{ decision: D-054 }] }
  - { id: RC-T-05, from: INITIAL_REVIEW_COMPLETED,    to: PENDING_REREVIEW,           by: FixInitialReview,    when: 分數大於品質線,                   status: decided, source: [{ decision: D-031 }, { decision: D-054 }] }
  - { id: RC-T-06, from: INITIAL_REVIEW_COMPLETED,    to: PENDING_REREVIEW,           by: SendToRereview,      status: decided, source: [{ decision: D-054 }, { doc: docs/03-contracts/api-spec.md, section: "§10.10" }] }
  - { id: RC-T-07, from: PENDING_REREVIEW,            to: REREVIEW_IN_PROGRESS,       by: StartRereview,       status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
  - { id: RC-T-08, from: REREVIEW_IN_PROGRESS,        to: REREVIEW_IN_PROGRESS,       by: SubmitRereview,      status: decided, source: [{ decision: D-032 }, { decision: D-053 }] }
  - { id: RC-T-09, from: REREVIEW_IN_PROGRESS,        to: CLOSED,                     by: CloseRereview,       status: decided, source: [{ decision: D-034 }, { decision: D-053 }] }
  - { id: RC-T-10, from: INITIAL_REVIEW_IN_PROGRESS,  to: RETURNED,                   by: ReturnInitialReview,  status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { decision: D-080 }] }
  - { id: RC-T-11, from: RETURNED,                    to: PENDING_INITIAL_REVIEW,     by: ReopenInitialReview,  status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { decision: D-080 }] }
  - { id: RC-T-12, from: INITIAL_REVIEW_COMPLETED,    to: CLOSED,                     by: CloseWithoutRereview, when: 初審已固定, status: decided, source: [{ decision: D-031 }, { decision: D-080 }] }
  - { id: RC-T-13, from: SELECTED_PENDING_ASSIGNMENT, to: CANCELLED,                  by: CancelReviewCase,     status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { decision: D-080 }] }
  - { id: RC-T-14, from: PENDING_INITIAL_REVIEW,      to: CANCELLED,                  by: CancelReviewCase,     status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { decision: D-080 }] }
  - { id: RC-T-15, from: INITIAL_REVIEW_IN_PROGRESS,  to: CANCELLED,                  by: CancelReviewCase,     status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { decision: D-080 }] }
  - { id: RC-T-16, from: RETURNED,                    to: CANCELLED,                  by: CancelReviewCase,     status: decided, source: [{ decision: D-080 }] }
  - { id: RC-T-17, from: INITIAL_REVIEW_COMPLETED,    to: CANCELLED,                  by: CancelReviewCase,     status: decided, source: [{ decision: D-080 }] }
  - { id: RC-T-18, from: PENDING_REREVIEW,            to: CANCELLED,                  by: CancelReviewCase,     status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { decision: D-080 }] }
  - { id: RC-T-19, from: REREVIEW_IN_PROGRESS,        to: CANCELLED,                  by: CancelReviewCase,     status: decided, source: [{ decision: D-080 }] }
  - { id: RC-T-20, from: PENDING_INITIAL_REVIEW,      to: PENDING_INITIAL_REVIEW,     by: ReassignReviewCase,   status: decided, source: [{ decision: D-082 }] }
  - { id: RC-T-21, from: PENDING_REREVIEW,            to: PENDING_REREVIEW,           by: ReassignRereviewer,   when: 已指派複審醫師, status: decided, source: [{ decision: D-055 }, { decision: D-082 }] }


terminal_states: [CLOSED, CANCELLED]

invariants:
  - id: RC-INV-03
    text: finalScore 在複審前等於目前有效的初審分數；複審提交或修正後 = 初審分數 × 初審權重 + 複審分數 × 複審權重，四捨五入到兩位小數
    status: decided
    source: [{ decision: D-012 }, { decision: D-020 }, { decision: D-032 }, { decision: D-083 }]
  - id: RC-INV-04
    text: 初審固定後不得修正初審；CLOSED、CANCELLED 之後不得修正、提交或再審
    status: decided
    source: [{ decision: D-006 }, { decision: D-031 }, { decision: D-032 }, { decision: D-054 }, { decision: D-083 }]
  - id: RC-INV-05
    text: 案件的初審醫師與複審醫師不是同一人
    status: decided
    source: [{ decision: D-017 }, { decision: D-083 }]
  - id: RC-INV-06
    text: 案件沒有 rereviewRequired、finalConclusion、ruleSnapshotRef（沒有任何行為寫入，D-084 第 9 點移除）
    status: decided
    source: [{ decision: D-083 }, { decision: D-084 }]
  - id: RC-INV-07
    text: 計分用的作答必須合法，否則 VALIDATION_ERROR：每一筆都有 itemId 與 answerValue；itemId 是評分表的題目；同一題只作答一次；BOOLEAN 的作答是 true 或 false；RANGE 的作答是 0 到滿分之間的數字，最多兩位小數。FIXED 的作答內容不檢查
    status: decided
    source: [{ decision: D-085 }]
  - id: RC-INV-08
    text: 題目分數：BOOLEAN 是 true 得 滿分 × 權重、false 得 0；FIXED 得 滿分 × 權重；RANGE 得 作答 × 權重。題目分數與總分四捨五入到兩位小數（HALF_UP）；總分是各題分數相加，沒有作答的題目不計分
    status: decided
    source: [{ decision: D-020 }, { decision: D-085 }]
  - id: RC-INV-02
    text: SYSTEM_ADMIN 只取得 metadata，取不到任何階段的答案、分數、評語
    status: decided
    source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5、§5.1" }]

deferred_behaviors:
  - 逾期：儀表板與匯出摘要的 overdueCases、overdueRate 保留在輸出，沒有立法。現況只看初審期限（不看複審期限）、初審準時提交但期限已過且還沒結案也算、「現在」取資料庫的時間；等逾期的規則裁決（D-087 第 5 點）
  - 永久盲審的讀取遮罩（D-033）：案件詳情、提交明細、修正歷史都已立法（RC-DTV-03、RC-SBV-01、RC-VIS-02）；複審醫師執行的命令不回傳初審分數與 finalScore（RC-SRR-S4、RC-CLR-S3）。稽核與匯出依 D-071、D-055 第 6 點
  - 必答規則 CONDITIONAL 與 conditionExpression 的求值：必答題的檢查只看 ALWAYS_REQUIRED（D-014 延後 visibilityRule，D-085 第 7 點）
  - updatedAt（D-037）：只有 SYSTEM_ADMIN 的案件詳情輸出它（RC-DTV-04）；其他查詢不輸出（D-084）
  - 品質線與權重取自專案目前的版本，不是案件建立時的版本：與 D-068 第 4 點同一題，等專案版本管理立法（D-069）
