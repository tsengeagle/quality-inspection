# 格式說明見 ../README.md（規格格式 v2.0，第十節）。本檔是律法（spec 類），修改需要修法紀錄與簽章。
# 待裁決的題目見 OPEN-QUESTIONS.md。
spec_version: 2
kind: usecases
aggregate: ReviewCase

sources:
  - { decision: D-017 }
  - { decision: D-023 }
  - { decision: D-024 }
  - { decision: D-031 }
  - { decision: D-032 }
  - { decision: D-033 }
  - { decision: D-034 }
  - { decision: D-035 }
  - { decision: D-038 }
  - { decision: D-042 }
  - { decision: D-047 }
  - { decision: D-053 }
  - { decision: D-054 }
  - { decision: D-055 }
  - { decision: D-066 }
  - { decision: D-067 }
  - { decision: D-068 }
  - { decision: D-069 }
  - { decision: D-070 }
  - { decision: D-071 }
  - { doc: docs/02-ddd/domain-events.md, section: "§6.2–§6.9、§6.12、§7.1、§7.2" }
  - { doc: docs/03-contracts/api-spec.md, section: "§4.2、§10.3、§10.5、§10.10、§11.1–§11.3、§12.1–§12.3、§13.2、§14.1、§14.2、D-034 複審獨立 Close Command 對齊" }

error_codes:
  - { code: ROLE_DENIED,                      category: denied,         status: decided,  source: [{ decision: D-023 }] }
  - { code: HOSPITAL_SCOPE_MISMATCH,          category: denied,         status: decided,  source: [{ decision: D-024 }] }
  - { code: ACCESS_DENIED,                    category: denied,         status: decided,  source: [{ decision: D-035 }] }
  - { code: CASE_NOT_FOUND,                   category: not_found,      status: decided,  source: [{ decision: D-054 }] }
  - { code: VALIDATION_ERROR,                 category: invalid_input,  status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: NO_CHANGES,                       category: conflict,       status: decided,  source: [{ decision: D-038 }] }
  - { code: CASE_NOT_ASSIGNABLE,              category: rule_violation, status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: CASE_NOT_IN_INITIAL_REVIEW_STAGE, category: rule_violation, status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: SUBMISSION_NOT_OWNED_BY_ACTOR,    category: denied,         status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: NOT_ASSIGNED_REVIEWER,            category: denied,         status: decided,  source: [{ decision: D-067 }] }
  - { code: REQUIRED_ITEMS_NOT_ANSWERED,      category: rule_violation, status: decided,  source: [{ decision: D-067 }] }
  - { code: SUBMISSION_NOT_FOUND,              category: not_found,      status: decided,  source: [{ decision: D-054 }] }
  - { code: CASE_TERMINAL,                     category: conflict,       status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: INVALID_STATE_TRANSITION,          category: conflict,       status: decided,  source: [{ decision: D-054 }] }
  - { code: CASE_NOT_INITIAL_REVIEW_COMPLETED, category: conflict,       status: decided,  source: [{ decision: D-054 }, { doc: docs/03-contracts/api-spec.md, section: "§10.10" }] }
  - { code: CONFLICT,                          category: conflict,       status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: SUBMISSION_NOT_SUBMITTED,          category: conflict,       status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: SUBMISSION_NOT_DRAFT,              category: conflict,       status: decided,  source: [{ decision: D-069 }] }
  - { code: NOT_SUBMISSION_OWNER,              category: denied,         status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: CASE_NOT_IN_REREVIEW_STAGE,        category: rule_violation, status: decided,  source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: NOT_ASSIGNED_REREVIEWER,           category: denied,         status: decided,  source: [{ decision: D-068 }] }
  - { code: NO_REREVIEWER_ASSIGNED,            category: rule_violation, status: decided,  source: [{ decision: D-069 }] }
  - { code: REREVIEWER_SAME_AS_REVIEWER,       category: rule_violation, status: decided,  source: [{ decision: D-017 }, { decision: D-069 }] }

# 順序依 D-024：角色 → 載入 → 院區範圍 → 領域規則。
guards:
  - id: RC-G-01
    when: 操作者不具備這支 use case 的 actor.roles 中任何一個角色
    outcome: { result: REJECTED, code: ROLE_DENIED }
    status: decided
    source: [{ decision: D-023 }]
  - id: RC-G-02
    when: caseId 找不到對應的案件
    outcome: { result: REJECTED, code: CASE_NOT_FOUND }
    status: decided
    source: [{ decision: D-054 }]
  - id: RC-G-03
    when: 操作者的院區與案件的 hospitalId 不同
    outcome: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }
    status: decided
    source: [{ decision: D-024 }]
  - id: RC-G-04
    when: submissionId 找不到對應的提交
    outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
    status: decided
    source: [{ decision: D-054 }]

input_types:
  AnswerInput:
    - { name: itemId,      type: text, required: true }
    - { name: answerValue, type: text, required: true }

# 欄位對誰可見不寫在這裡，留在規則與範例。
output_types:
  CaseSummary:
    - { name: caseId,        type: id }
    - { name: batchId,       type: id }
    - { name: hospitalId,    type: id }
    - { name: sourceCaseKey, type: text }
    - { name: status,        type: enum CaseStatus }
    - { name: reviewerId,    type: id }
    - { name: rereviewerId,  type: id }
    - { name: assignedAt,    type: datetime }
    - { name: dueAt,         type: datetime }
  RevisionEntry:
    - { name: submissionId, type: id }
    - { name: stage,        type: enum ReviewStage }
    - { name: revisionNo,   type: int }
    - { name: status,       type: enum SubmissionStatus }
    - { name: reviewerId,   type: id }
    - { name: submittedAt,  type: datetime }
    - { name: totalScore,   type: decimal(2) }
    - { name: comment,      type: text }
    - { name: supersededBySubmissionId, type: id }

  AuditEntry:
    - { name: id,            type: id }
    - { name: entityType,    type: text }
    - { name: entityId,      type: id }
    - { name: action,        type: text }
    - { name: actorUserId,   type: id }
    - { name: hospitalId,    type: id }
    - { name: occurredAt,    type: datetime }
    - { name: detail,        type: text }

usecases:

  # ---------- 列出案件 ----------

  - name: ListReviewCases
    kind: query
    summary: 列出操作者院區範圍內的案件
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: batchId, type: id,              required: false }
      - { name: status,  type: enum CaseStatus, required: false }
    guards: [RC-G-01]
    rules:
      - id: RC-LST-01
        when: 操作者不是 SYSTEM_ADMIN
        text: 只列出院區等於操作者院區的案件；輸入不能指定別的院區
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-042 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md }]
      fields:
        - { name: content, type: "list<CaseSummary>" }

  # ---------- 分派 ----------

  - name: AssignReviewCase
    kind: command
    summary: 指派初審醫師與期限
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId,     type: id,       required: true }
      - { name: reviewerId, type: id,       required: true }
      - { name: dueAt,      type: datetime, required: true, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }] }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-ASG-01
        when: 案件的 status 不是 SELECTED_PENDING_ASSIGNMENT
        outcome: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }, { doc: docs/02-ddd/state-machine.md, section: "§3.2" }]
      - id: RC-ASG-02
        when: reviewerId 或 dueAt 沒有給
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-067 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2、§10.3" }]
    success:
      state:
        - { id: RC-ASG-S1, text: status = PENDING_INITIAL_REVIEW,                  status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
        - { id: RC-ASG-S2, text: reviewerId、dueAt 等於輸入，assignedAt 是指派當時的時間, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }] }
        - { id: RC-ASG-S3, text: ReviewCaseAssigned 帶有 caseId 與 assignedReviewerId, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.2" }, { decision: D-066 }] }
      emits:
        - { event: ReviewCaseAssigned, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.2" }] }

  # ---------- 初審 ----------

  - name: StartInitialReview
    kind: command
    summary: 受指派的初審醫師開始初審，建立初審草稿
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-STI-01
        when: 操作者不是這個案件受指派的初審醫師
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REVIEWER }
        status: decided
        source: [{ decision: D-067 }]
      - id: RC-STI-02
        when: 案件的 status 不是 PENDING_INITIAL_REVIEW
        outcome: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
    success:
      state:
        - { id: RC-STI-S1, text: status = INITIAL_REVIEW_IN_PROGRESS,                          status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
        - { id: RC-STI-S2, text: 建立一份初審階段的提交，狀態 DRAFT、revisionNo = 1、醫師是操作者, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
        - { id: RC-STI-S3, text: InitialReviewStarted 帶有 caseId、submissionId 與 reviewerId, status: decided, source: [{ decision: D-067 }, { doc: docs/02-ddd/domain-events.md, section: "§6.3" }] }
      emits:
        - { event: InitialReviewStarted, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.3" }] }
    output:
      fields:
        - { name: submissionId, type: id }

  - name: SaveInitialReviewDraft
    kind: command
    summary: 保存初審草稿的答案與評語
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId,  type: id,                  required: true }
      - { name: answers, type: "list<AnswerInput>", required: true }
      - { name: comment, type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-DRF-01
        when: 操作者不是這份初審草稿的醫師
        outcome: { result: REJECTED, code: SUBMISSION_NOT_OWNED_BY_ACTOR }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-DRF-02
        when: 答案與評語和已保存的草稿完全相同
        outcome: { result: REJECTED, code: NO_CHANGES, no_change: true }
        status: decided
        source: [{ decision: D-038 }]
      - id: RC-DRF-03
        when: 案件的 status 不是 INITIAL_REVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }
        status: decided
        source: [{ decision: D-068 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
    success:
      state:
        - { id: RC-DRF-S1, text: 草稿的答案與評語等於輸入, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
        - { id: RC-DRF-S2, text: ReviewDraftSaved 帶有 submissionId 與 caseId, status: decided, source: [{ decision: D-067 }, { doc: docs/02-ddd/domain-events.md, section: "§7.1" }] }
      emits:
        - { event: ReviewDraftSaved, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§7.1" }] }

  - name: SubmitInitialReview
    kind: command
    summary: 提交初審；不固定、不進複審、不結案
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-SUB-01
        when: 操作者不是這份初審草稿的醫師
        outcome: { result: REJECTED, code: SUBMISSION_NOT_OWNED_BY_ACTOR }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2、§11.3" }]
      - id: RC-SUB-02
        when: 案件的 status 不是 INITIAL_REVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }
        status: decided
        source: [{ decision: D-067 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-SUB-03
        when: 評分表有必答的題目沒有作答
        outcome: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }
        status: decided
        source: [{ decision: D-067 }]
    success:
      state:
        - { id: RC-SUB-S1, text: status = INITIAL_REVIEW_COMPLETED，不論分數與品質線的關係, status: decided, source: [{ decision: D-031 }, { decision: D-054 }] }
        - { id: RC-SUB-S2, text: 初審提交的狀態是 SUBMITTED，submittedAt 是提交當時的時間,  status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
        - { id: RC-SUB-S3, text: ReviewSubmissionSubmitted 帶有 caseId 與 submissionId, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§7.2" }, { decision: D-066 }] }
        - { id: RC-SUB-S4, text: InitialReviewCompleted 帶有 caseId 與 submissionId, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.4" }, { decision: D-067 }] }
      emits:
        - { event: ReviewSubmissionSubmitted, status: decided,  source: [{ doc: docs/02-ddd/domain-events.md, section: "§7.2" }] }
        - { event: InitialReviewCompleted,    status: decided,  source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.4" }, { decision: D-067 }] }
    output:
      fields:
        - { name: submissionId, type: id }
        - { name: caseStatus,   type: enum CaseStatus }
        - { name: totalScore,   type: decimal(2) }

  # ---------- 初審固定與送複審（D-069） ----------

  - name: FixInitialReview
    kind: command
    summary: 初審醫師固定自己目前有效的初審結果；分數大於品質線就進複審
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId,       type: id, required: true }
      - { name: submissionId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-04, RC-G-03]
    rules:
      - id: RC-FIX-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-02
        when: 案件的初審已經固定
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-03
        when: 案件的 status 不是 INITIAL_REVIEW_COMPLETED
        outcome: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-04
        when: 這份提交不屬於本案、不是初審階段，或不是本案目前有效的初審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-05
        when: 這份提交還是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-06
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-054 }]
    success:
      state:
        - { id: RC-FIX-S1, text: 被固定那份提交的分數大於專案的品質線時，status = PENDING_REREVIEW, status: decided, source: [{ decision: D-031 }, { decision: D-054 }] }
        - { id: RC-FIX-S2, text: 分數不大於品質線，或品質線沒有設定時，status 維持 INITIAL_REVIEW_COMPLETED, status: decided, source: [{ decision: D-054 }] }
        - { id: RC-FIX-S3, text: 輸出的 fixedAt 是固定當時的時間, status: decided, source: [{ decision: D-054 }] }
        - { id: RC-FIX-S4, text: InitialReviewFixed 帶有 caseId 與 submissionId，不帶分數, status: decided, source: [{ decision: D-054 }, { decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.12" }] }
        - { id: RC-FIX-S5, text: 進複審時，ReviewCaseEscalatedToRereview 帶有 caseId、projectId、triggeredBySubmissionId、initialScore、qualityThreshold, status: decided, source: [{ decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }
      emits:
        - { event: InitialReviewFixed,            status: decided, source: [{ decision: D-054 }, { doc: docs/02-ddd/domain-events.md, section: "§6.12" }] }
        - { event: ReviewCaseEscalatedToRereview, status: decided, source: [{ decision: D-054 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }
    output:
      status: decided
      source: [{ decision: D-054 }]
      fields:
        - { name: caseId,       type: id }
        - { name: caseStatus,   type: enum CaseStatus }
        - { name: submissionId, type: id }
        - { name: fixedAt,      type: datetime }

  - name: SendToRereview
    kind: command
    summary: 管理者把初審已固定、沒有自動進複審的案件送複審
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-SND-01
        when: 案件的 status 不是 INITIAL_REVIEW_COMPLETED
        outcome: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.10" }]
      - id: RC-SND-02
        when: 案件的初審還沒有固定
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: decided
        source: [{ decision: D-054 }]
    success:
      state:
        - { id: RC-SND-S1, text: status = PENDING_REREVIEW, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.10" }] }
        - { id: RC-SND-S2, text: ReviewCaseEscalatedToRereview 帶有 caseId 與 projectId, status: decided, source: [{ decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }
      emits:
        - { event: ReviewCaseEscalatedToRereview, status: decided, source: [{ decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }

  # ---------- 複審（D-069） ----------

  - name: AssignRereviewer
    kind: command
    summary: 指派複審醫師與期限
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId,       type: id,       required: true }
      - { name: rereviewerId, type: id,       required: true }
      - { name: dueAt,        type: datetime, required: true, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.5" }] }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-ARR-01
        when: 案件的 status 不是 PENDING_REREVIEW
        outcome: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }
        status: decided
        source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-ARR-02
        when: rereviewerId 或 dueAt 沒有給
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§10.5" }]
      - id: RC-ARR-03
        when: rereviewerId 是本案的初審醫師
        outcome: { result: REJECTED, code: REREVIEWER_SAME_AS_REVIEWER }
        status: decided
        source: [{ decision: D-017 }]
    success:
      state:
        - { id: RC-ARR-S1, text: rereviewerId 等於輸入，status 維持 PENDING_REREVIEW, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.5" }, { scenario: TS-RR-001 }] }
        - { id: RC-ARR-S2, text: RereviewerAssigned 帶有 caseId、rereviewerId、dueAt, status: decided, source: [{ decision: D-070 }, { doc: docs/02-ddd/domain-events.md, section: "§6.6" }] }
      emits:
        - { event: RereviewerAssigned, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.6" }] }

  - name: StartRereview
    kind: command
    summary: 受指派的複審醫師開始複審，建立複審草稿
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-STR-01
        when: 案件已指派複審醫師，但操作者不是
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }
        status: decided
        source: [{ decision: D-068 }]
      - id: RC-STR-02
        when: 案件的 status 不是 PENDING_REREVIEW
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-STR-03
        when: 案件還沒有指派複審醫師
        outcome: { result: REJECTED, code: NO_REREVIEWER_ASSIGNED }
        status: decided
        source: [{ decision: D-069 }]
    success:
      state:
        - { id: RC-STR-S1, text: status = REREVIEW_IN_PROGRESS, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { scenario: TS-RR-002 }] }
        - { id: RC-STR-S2, text: 建立一份複審階段的提交，狀態 DRAFT、revisionNo = 1、醫師是操作者, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }, { decision: D-069 }] }
        - { id: RC-STR-S3, text: RereviewStarted 帶有 caseId、submissionId、rereviewerId, status: decided, source: [{ decision: D-070 }, { doc: docs/02-ddd/domain-events.md, section: "§6.7" }] }
      emits:
        - { event: RereviewStarted, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.7" }] }
    output:
      fields:
        - { name: submissionId, type: id }

  - name: SaveRereviewDraft
    kind: command
    summary: 保存複審草稿的答案與評語
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId,       type: id,                  required: true }
      - { name: submissionId, type: id,                  required: true }
      - { name: answers,      type: "list<AnswerInput>", required: true }
      - { name: comment,      type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-RDR-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-02
        when: 案件的 status 不是 REREVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-RDR-03
        when: 操作者不是這個案件受指派的複審醫師
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }
        status: decided
        source: [{ decision: D-068 }]
      - id: RC-RDR-04
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-RDR-05
        when: 這份提交不屬於本案，或不是複審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-06
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-07
        when: 這份提交不是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_DRAFT }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-RDR-08
        when: 這份提交不是本案目前有效的複審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-09
        when: 答案與評語和已保存的草稿完全相同
        outcome: { result: REJECTED, code: NO_CHANGES, no_change: true }
        status: decided
        source: [{ decision: D-038 }]
    success:
      state:
        - { id: RC-RDR-S1, text: 草稿的答案與評語等於輸入, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }

  - name: SubmitRereview
    kind: command
    summary: 提交複審；系統計分、計算 finalScore，不結案
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId,       type: id,                  required: true }
      - { name: submissionId, type: id,                  required: true, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§12.3" }] }
      - { name: answers,      type: "list<AnswerInput>", required: false }
      - { name: comment,      type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-SRR-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-SRR-02
        when: 案件的 status 不是 REREVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-SRR-03
        when: 操作者不是這個案件受指派的複審醫師
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }
        status: decided
        source: [{ decision: D-068 }, { scenario: TS-RR-004 }]
      - id: RC-SRR-04
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-SRR-05
        when: 這份提交不屬於本案，或不是複審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-SRR-06
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-SRR-07
        when: 這份提交不是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_DRAFT }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-SRR-08
        when: 這份提交不是本案目前有效的複審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
    success:
      state:
        - { id: RC-SRR-S1, text: status 維持 REREVIEW_IN_PROGRESS，不結案、不固定, status: decided, source: [{ decision: D-032 }, { decision: D-053 }, { scenario: TS-RR-003 }] }
        - { id: RC-SRR-S2, text: 複審提交的狀態是 SUBMITTED，submittedAt 是提交當時的時間；totalScore 由系統依評分表計算, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }, { decision: D-032 }] }
        - { id: RC-SRR-S3, text: RereviewCompleted 帶有 caseId、submissionId、rereviewerId、rereviewScore、finalScore；finalScore 依 D-012、D-020 由初審與複審分數加權, status: decided, source: [{ decision: D-070 }, { doc: docs/02-ddd/domain-events.md, section: "§6.8、§14" }] }
        - { id: RC-SRR-S4, text: 輸出沒有 finalScore，也沒有初審的分數, status: decided, source: [{ decision: D-033 }, { decision: D-053 }] }
      emits:
        - { event: RereviewCompleted, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.8" }] }
    output:
      fields:
        - { name: submissionId, type: id }
        - { name: status,       type: enum SubmissionStatus }
        - { name: caseId,       type: id }
        - { name: caseStatus,   type: enum CaseStatus }

  - name: CloseRereview
    kind: command
    summary: 目前有效複審結果的提交醫師結案；結案即固定複審結果
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId,       type: id, required: true }
      - { name: submissionId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-CLR-01
        when: 案件的 status 是 CLOSED 或 CANCELLED（含重複結案）
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-02
        when: 案件的 status 不是 REREVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-CLR-03
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-04
        when: 這份提交不屬於本案，或不是複審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-05
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-06
        when: 這份提交還是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-07
        when: 這份提交不是本案目前有效的複審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
    success:
      state:
        - { id: RC-CLR-S1, text: status = CLOSED, status: decided, source: [{ decision: D-034 }, { decision: D-053 }] }
        - { id: RC-CLR-S2, text: ReviewCaseClosed 帶有 caseId 與 submissionId（結案時固定的那份複審提交）, status: decided, source: [{ decision: D-070 }, { decision: D-053 }, { doc: docs/02-ddd/domain-events.md, section: "§6.9" }] }
        - { id: RC-CLR-S3, text: 輸出沒有 finalScore, status: decided, source: [{ decision: D-033 }, { decision: D-053 }] }
      emits:
        - { event: ReviewCaseClosed, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.9" }, { decision: D-053 }] }
    output:
      status: decided
      source: [{ decision: D-053 }]
      fields:
        - { name: caseId,       type: id }
        - { name: caseStatus,   type: enum CaseStatus }
        - { name: submissionId, type: id }

  # ---------- revision 歷程 ----------

  - name: GetRevisionHistory
    kind: query
    summary: 查詢案件各階段、各版本的提交歷程；內容依角色遮罩
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    guard_exceptions:
      - { guard: RC-G-03, text: SYSTEM_ADMIN 的讀取不受院區限制, status: decided, source: [{ decision: D-047 }] }
    rules:
      - id: RC-RVH-01
        when: 操作者同時具備兩個以上的角色
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-035 }, { decision: D-055 }]
      - id: RC-RVH-02
        when: 操作者是 REVIEWER 或 REREVIEWER，但不是這個案件該階段受指派的醫師，也沒有在該階段提交過
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5" }]
      - id: RC-VIS-01
        when: 操作者是 HOSPITAL_MANAGER、AUDITOR，或本案的初審醫師，且不是本案現任或曾經的複審醫師
        text: 每一筆歷程都有 totalScore 與 comment
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5" }, { decision: D-055 }]
      - id: RC-VIS-03
        when: 操作者是 SYSTEM_ADMIN
        text: 每一筆歷程都沒有 totalScore 與 comment
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { rule: RC-INV-02 }]
      - id: RC-VIS-05
        when: 操作者是 SYSTEM_ADMIN
        text: 每一筆歷程只有 submissionId、stage、revisionNo、status、submittedAt、reviewerId、supersededBySubmissionId（permission-matrix 的 submittedBy 是 reviewerId；isCurrentEffective 由 status 與 supersededBySubmissionId 表示）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { decision: D-067 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§13.2" }]
      fields:
        - { name: caseId,  type: id }
        - { name: entries, type: "list<RevisionEntry>" }

  # ---------- 稽核：生命週期與稽核軌跡（D-071） ----------
  # 帶分數的 action（D-071 第 1 點）：INITIAL_REVIEW_COMPLETED、CASE_ESCALATED_TO_REREVIEW（帶 score 時）、
  # REREVIEW_SUBMITTED、REREVIEW_REVISED、CASE_CLOSED_WITHOUT_REREVIEW。
  # 遮罩條件依案件「目前」的狀態與複審指派歷史判斷，不依事件發生時（D-071 第 2 點）。

  - name: GetCaseLifecycle
    kind: query
    summary: 查詢一個案件的稽核紀錄；帶分數的 detail 依 D-071 遮罩
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01]
    rules:
      - id: RC-LCY-01
        when: 操作者持有 REREVIEWER 或 SYSTEM_ADMIN（不論同時持有哪些角色）
        text: 每一筆紀錄都沒有 detail
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-033 }, { decision: D-071 }]
      - id: RC-LCY-02
        when: 案件目前的狀態不是 REREVIEW_IN_PROGRESS、CLOSED、CANCELLED，或操作者是本案現任或曾經的複審醫師，或本案的複審指派歷史不完整
        text: 帶分數的 action 那幾筆沒有 detail；其他 action 的 detail 照常
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-071 }]
      - id: RC-LCY-03
        when: RC-LCY-01、RC-LCY-02 都不成立
        text: 每一筆紀錄的 detail 照常，包含帶分數的 action
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-071 }]
      - id: RC-LCY-04
        when: 讀取成功
        text: 讀取不寫入初審讀取者紀錄，也不遞增案件版本
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-071 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§14.1" }, { decision: D-071 }]
      fields:
        - { name: entries, type: "list<AuditEntry>" }

  - name: ListAuditTrails
    kind: query
    summary: 查詢稽核軌跡（分頁）；帶分數的 detail 依 D-071 逐列遮罩
    actor: { roles: [SYSTEM_ADMIN, HOSPITAL_MANAGER, AUDITOR] }
    input:
      - { name: aggregateType, type: text,     required: false }
      - { name: aggregateId,   type: id,       required: false }
      - { name: hospitalId,    type: id,       required: false }
      - { name: eventName,     type: text,     required: false }
      - { name: from,          type: datetime, required: false }
      - { name: to,            type: datetime, required: false }
      - { name: page,          type: int,      required: false }
      - { name: size,          type: int,      required: false }
    guards: [RC-G-01]
    rules:
      - id: RC-AUD-01
        when: 操作者持有 REREVIEWER 或 SYSTEM_ADMIN（不論同時持有哪些角色）
        text: 每一筆紀錄都沒有 detail
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-033 }, { decision: D-071 }]
      - id: RC-AUD-02
        when: 某一筆是 ReviewCase 帶分數的 action，且該案符合 RC-LCY-02 的條件
        text: 這一筆沒有 detail；其他筆不受影響
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-071 }, { rule: RC-LCY-02 }]
      - id: RC-AUD-03
        when: 讀取成功
        text: 讀取不寫入初審讀取者紀錄，也不遞增案件版本
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-071 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§14.2" }, { decision: D-071 }]
      fields:
        - { name: content, type: "list<AuditEntry>" }
