# 格式說明見 ../README.md（規格格式 v2.0，第十節）。本檔是律法（spec 類），修改需要修法紀錄與簽章。
# 待裁決的題目見 OPEN-QUESTIONS.md。
spec_version: 2
kind: usecases
aggregate: ReviewCase

sources:
  - { decision: D-017 }
  - { decision: D-023 }
  - { decision: D-024 }
  - { decision: D-031 }
  - { decision: D-032 }
  - { decision: D-033 }
  - { decision: D-034 }
  - { decision: D-035 }
  - { decision: D-038 }
  - { decision: D-042 }
  - { decision: D-047 }
  - { decision: D-053 }
  - { decision: D-054 }
  - { decision: D-055 }
  - { decision: D-066 }
  - { decision: D-067 }
  - { decision: D-068 }
  - { decision: D-069 }
  - { decision: D-070 }
  - { decision: D-071 }
  - { decision: D-073 }
  - { decision: D-076 }
  - { decision: D-080 }
  - { decision: D-081 }
  - { decision: D-082 }
  - { decision: D-083 }
  - { decision: D-087 }
  - { doc: docs/02-ddd/domain-events.md, section: "§6.2–§6.12、§7.1、§7.2" }
  - { doc: docs/03-contracts/api-spec.md, section: "§4.2、§10.3–§10.11、§11.4、§12.4、§11.1–§11.3、§12.1–§12.3、§13.2、§14.1、§14.2、D-034 複審獨立 Close Command 對齊" }

error_codes:
  - { code: ROLE_DENIED,                      category: denied,         status: decided,  source: [{ decision: D-023 }] }
  - { code: HOSPITAL_SCOPE_MISMATCH,          category: denied,         status: decided,  source: [{ decision: D-024 }] }
  - { code: ACCESS_DENIED,                    category: denied,         status: decided,  source: [{ decision: D-035 }] }
  - { code: CASE_NOT_FOUND,                   category: not_found,      status: decided,  source: [{ decision: D-054 }] }
  - { code: VALIDATION_ERROR,                 category: invalid_input,  status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: NO_CHANGES,                       category: conflict,       status: decided,  source: [{ decision: D-038 }] }
  - { code: CASE_NOT_ASSIGNABLE,              category: rule_violation, status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: CASE_NOT_IN_INITIAL_REVIEW_STAGE, category: rule_violation, status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: SUBMISSION_NOT_OWNED_BY_ACTOR,    category: denied,         status: decided,  source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: NOT_ASSIGNED_REVIEWER,            category: denied,         status: decided,  source: [{ decision: D-067 }] }
  - { code: REQUIRED_ITEMS_NOT_ANSWERED,      category: rule_violation, status: decided,  source: [{ decision: D-067 }] }
  - { code: SUBMISSION_NOT_FOUND,              category: not_found,      status: decided,  source: [{ decision: D-054 }] }
  - { code: CASE_TERMINAL,                     category: conflict,       status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: INVALID_STATE_TRANSITION,          category: conflict,       status: decided,  source: [{ decision: D-054 }] }
  - { code: CASE_NOT_INITIAL_REVIEW_COMPLETED, category: conflict,       status: decided,  source: [{ decision: D-054 }, { doc: docs/03-contracts/api-spec.md, section: "§10.10" }] }
  - { code: CONFLICT,                          category: conflict,       status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: SUBMISSION_NOT_SUBMITTED,          category: conflict,       status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: SUBMISSION_NOT_DRAFT,              category: conflict,       status: decided,  source: [{ decision: D-069 }] }
  - { code: NOT_SUBMISSION_OWNER,              category: denied,         status: decided,  source: [{ decision: D-053 }, { decision: D-054 }] }
  - { code: CASE_NOT_IN_REREVIEW_STAGE,        category: rule_violation, status: decided,  source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }] }
  - { code: NOT_ASSIGNED_REREVIEWER,           category: denied,         status: decided,  source: [{ decision: D-068 }] }
  - { code: NO_REREVIEWER_ASSIGNED,            category: rule_violation, status: decided,  source: [{ decision: D-069 }] }
  - { code: REREVIEWER_SAME_AS_REVIEWER,       category: rule_violation, status: decided,  source: [{ decision: D-017 }, { decision: D-069 }] }
  - { code: CASE_NOT_IN_PROGRESS,              category: conflict,       status: decided,  source: [{ decision: D-080 }] }
  - { code: CASE_NOT_RETURNED,                 category: conflict,       status: decided,  source: [{ decision: D-080 }, { doc: docs/03-contracts/api-spec.md, section: "§10.11" }] }
  - { code: REREVIEWER_HAS_READ_INITIAL,       category: rule_violation, status: decided,  source: [{ decision: D-055 }, { decision: D-084 }] }
  - { code: BAD_REQUEST,                       category: invalid_input,  status: decided,  source: [{ decision: D-057 }, { decision: D-087 }] }

# 順序依 D-024：角色 → 載入 → 院區範圍 → 領域規則。
guards:
  - id: RC-G-01
    when: 操作者不具備這支 use case 的 actor.roles 中任何一個角色
    outcome: { result: REJECTED, code: ROLE_DENIED }
    status: decided
    source: [{ decision: D-023 }]
  - id: RC-G-02
    when: caseId 找不到對應的案件
    outcome: { result: REJECTED, code: CASE_NOT_FOUND }
    status: decided
    source: [{ decision: D-054 }]
  - id: RC-G-03
    when: 操作者的院區與案件的 hospitalId 不同
    outcome: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }
    status: decided
    source: [{ decision: D-024 }]
  - id: RC-G-04
    when: submissionId 找不到對應的提交
    outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
    status: decided
    source: [{ decision: D-054 }]
  # 請求端的規則（D-073）：在讀取請求本文時、進入 use case 之前檢查，所以不列在任何 use case 的 guards。
  # 範例是 examples.yaml 的 http 步驟（D-074，格式 v2.1）。
  - id: RC-G-05
    when: 請求本文的時間不帶時區
    outcome: { result: REJECTED, code: VALIDATION_ERROR }
    status: decided
    source: [{ decision: D-073 }]

input_types:
  AnswerInput:
    - { name: itemId,      type: text, required: true }
    - { name: answerValue, type: text, required: true }

# 欄位對誰可見不寫在這裡，留在規則與範例。
output_types:
  DashboardSummary:
    - { name: totalCases,      type: int }
    - { name: closedCases,     type: int }
    - { name: rereviewedCases, type: int }
    - { name: overdueCases,    type: int }
    - { name: completionRate,  type: decimal }
    - { name: rereviewRate,    type: decimal }
    - { name: overdueRate,     type: decimal }
  ExportRow:
    - { name: caseId,       type: id }
    - { name: projectId,    type: id }
    - { name: hospitalId,   type: id }
    - { name: status,       type: enum CaseStatus }
    - { name: reviewerId,   type: id }
    - { name: rereviewerId, type: id }
    - { name: initialScore, type: decimal(2) }
    - { name: finalScore,   type: decimal(2) }
    - { name: createdAt,    type: datetime }
    - { name: closedAt,     type: datetime }
    - { name: maskedFields, type: "list<text>" }
  # D-100：SYSTEM_ADMIN 的匯出列（RC-RPT-07）。
  ExportRowMetadata:
    - { name: caseId,       type: id }
    - { name: hospitalId,   type: id }
    - { name: status,       type: enum CaseStatus }
    - { name: reviewerId,   type: id }
    - { name: rereviewerId, type: id }
    - { name: createdAt,    type: datetime }
    - { name: closedAt,     type: datetime }
  # D-101：案件的評分表（GetReviewCaseScoreSheet）。欄位與 score-sheet 的章節查詢相同；
  # scoreType、requiredRule 的值是 specs/score-sheet/model.yaml 的 ScoreType、RequiredRule。
  CaseScoreSheetSection:
    - { name: sectionId, type: id }
    - { name: title,     type: text }
    - { name: items,     type: "list<CaseScoreSheetItem>" }
  CaseScoreSheetItem:
    - { name: itemId,              type: id }
    - { name: code,                type: text }
    - { name: title,               type: text }
    - { name: scoreType,           type: text }
    - { name: maxScore,            type: decimal(2) }
    - { name: weight,              type: decimal(4) }
    - { name: requiredRule,        type: text }
    - { name: conditionExpression, type: text }
  # D-100：SYSTEM_ADMIN 的列表項目（RC-LST-03）。
  CaseSummaryMetadata:
    - { name: caseId,         type: id }
    - { name: batchId,        type: id }
    - { name: hospitalId,     type: id }
    - { name: status,         type: enum CaseStatus }
    - { name: reviewerId,     type: id }
    - { name: rereviewerId,   type: id }
    - { name: dueAt,          type: datetime }
    - { name: projectionType, type: text }
  CaseSummary:
    - { name: caseId,        type: id }
    - { name: batchId,       type: id }
    - { name: hospitalId,    type: id }
    - { name: sourceCaseKey, type: text }
    - { name: status,        type: enum CaseStatus }
    - { name: reviewerId,    type: id }
    - { name: rereviewerId,  type: id }
    - { name: createdAt,     type: datetime }   # D-088 第 3 點
    - { name: assignedAt,    type: datetime }
    - { name: dueAt,         type: datetime }
  RevisionEntry:
    - { name: submissionId, type: id }
    - { name: stage,        type: enum ReviewStage }
    - { name: revisionNo,   type: int }
    - { name: status,       type: enum SubmissionStatus }
    - { name: reviewerId,   type: id }
    - { name: submittedAt,  type: datetime }
    - { name: totalScore,   type: decimal(2) }
    - { name: comment,      type: text }
    - { name: supersededBySubmissionId, type: id }

  SubmissionSummary:
    - { name: submissionId, type: id }
    - { name: stage,        type: enum ReviewStage }
    - { name: reviewerId,   type: id }
    - { name: revisionNo,   type: int }
    - { name: status,       type: enum SubmissionStatus }
    - { name: totalScore,   type: decimal(2) }
    - { name: submittedAt,  type: datetime }
  ReviewPageContext:
    - { name: pageMode,       type: text }
    - { name: blocked,        type: bool }
    - { name: blockedReason,  type: text }
    - { name: allowedActions, type: "list<text>" }
    - { name: currentSubmission,   type: SubmissionRef }
    - { name: editableSubmission,  type: SubmissionRef }
    - { name: basedOnVersion,      type: SubmissionRef }
    - { name: initialReviewerId,   type: id }
    - { name: initialTotalScore,   type: decimal(2) }
    - { name: finalScore,          type: decimal(2) }
  AssigneeSummary:
    - { name: userId,       type: id }
    - { name: displayName,  type: text }
    - { name: displayLabel, type: text }
    - { name: assignedAt,   type: datetime }
  AssignmentCandidate:
    - { name: userId,        type: id }
    - { name: displayName,   type: text }
    - { name: displayLabel,  type: text }
    - { name: role,          type: text }
    - { name: active,        type: bool }
    - { name: selectable,    type: bool }
    - { name: blockedReason, type: text }

  AuditEntry:
    - { name: id,            type: id }
    - { name: entityType,    type: text }
    - { name: entityId,      type: id }
    - { name: action,        type: text }
    - { name: actorUserId,   type: id }
    - { name: hospitalId,    type: id }
    - { name: occurredAt,    type: datetime }
    - { name: detail,        type: text }

usecases:

  # ---------- 列出案件 ----------

  - name: ListReviewCases
    kind: query
    summary: 列出操作者院區範圍內的案件
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    # D-100 第 8 點：輸入照程式補齊。page、size 的預設值與上限沒有規則，也沒有範例。
    input:
      - { name: hospitalId,        type: id,              required: false }
      - { name: projectId,         type: id,              required: false }
      - { name: batchId,           type: id,              required: false }
      - { name: status,            type: enum CaseStatus, required: false }
      - { name: reviewerId,        type: id,              required: false }
      - { name: rereviewerId,      type: id,              required: false }
      - { name: medicalRecordType, type: text,            required: false }
      - { name: page,              type: int,             required: false }
      - { name: size,              type: int,             required: false }
    guards: [RC-G-01]
    rules:
      - id: RC-LST-01
        when: 操作者不是 SYSTEM_ADMIN
        text: 只列出院區等於操作者院區的案件；輸入不能指定別的院區
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-042 }]
      - id: RC-LST-02
        when: status 有給，但不是 CaseStatus 的值（在角色檢查之後）
        outcome: { result: REJECTED, code: BAD_REQUEST }
        status: decided
        source: [{ decision: D-088 }]
      - id: RC-LST-03
        when: 操作者是 SYSTEM_ADMIN
        text: 每一筆只有 caseId、batchId、hospitalId、status、reviewerId、rereviewerId、dueAt 與 projectionType（值是 METADATA_ONLY）。status 就是白名單的 caseStatus；projectionType 是視角的標記，不是案件的資料，不受白名單管
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-036 }, { doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { decision: D-100 }]
      - id: RC-LST-04
        when: 操作者是 SYSTEM_ADMIN
        text: 列出所有院區的案件；輸入有 hospitalId 時只列出那個院區的
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-047 }, { decision: D-100 }]
      - id: RC-LST-05
        when: 操作者是 SYSTEM_ADMIN，輸入有 medicalRecordType
        text: medicalRecordType 不採用（當成沒有給）：它不在白名單裡，用它篩選會透露它的值。projectId 照常採用。其他角色的 medicalRecordType 照常採用
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-100 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md }]
      fields:
        # 操作者是 SYSTEM_ADMIN 時每一項是 CaseSummaryMetadata（RC-LST-03）。
        - { name: content, type: "list<CaseSummary>" }

  # ---------- 分派 ----------

  - name: AssignReviewCase
    kind: command
    summary: 指派初審醫師與期限
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId,     type: id,       required: true }
      - { name: reviewerId, type: id,       required: true }
      - { name: dueAt,      type: datetime, required: true, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }] }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-ASG-01
        when: 案件的 status 不是 SELECTED_PENDING_ASSIGNMENT
        outcome: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }, { doc: docs/02-ddd/state-machine.md, section: "§3.2" }]
      - id: RC-ASG-02
        when: reviewerId 或 dueAt 沒有給
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-067 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2、§10.3" }]
    success:
      state:
        - { id: RC-ASG-S1, text: status = PENDING_INITIAL_REVIEW,                  status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
        - { id: RC-ASG-S2, text: reviewerId、dueAt 等於輸入，assignedAt 是指派當時的時間, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }] }
        - { id: RC-ASG-S3, text: ReviewCaseAssigned 帶有 caseId 與 assignedReviewerId, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.2" }, { decision: D-066 }] }
      emits:
        - { event: ReviewCaseAssigned, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.2" }] }

  # ---------- 初審 ----------

  - name: StartInitialReview
    kind: command
    summary: 受指派的初審醫師開始初審，建立初審草稿
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-STI-01
        when: 操作者不是這個案件受指派的初審醫師
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REVIEWER }
        status: decided
        source: [{ decision: D-067 }]
      - id: RC-STI-02
        when: 案件的 status 不是 PENDING_INITIAL_REVIEW
        outcome: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
    success:
      state:
        - { id: RC-STI-S1, text: status = INITIAL_REVIEW_IN_PROGRESS,                          status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
        - { id: RC-STI-S2, text: 案件還沒有初審提交時，建立一份初審階段的提交，狀態 DRAFT、revisionNo = 1、醫師是操作者, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
        - { id: RC-STI-S4, text: 案件已有初審提交、它是 DRAFT、且它的醫師是操作者（退回後重開）時，沿用這份提交，不建立新的；輸出的 submissionId 是原本的提交，作答與評語保留, status: decided, source: [{ decision: D-080 }, { decision: D-081 }] }
        - { id: RC-STI-S5, text: 案件已有初審提交、它是 DRAFT、但它的醫師不是操作者（重開後改派）時，建立一份新的初審提交（同 RC-STI-S2），原本的提交維持 DRAFT、留在修正歷史, status: decided, source: [{ decision: D-081 }] }
        - { id: RC-STI-S3, text: InitialReviewStarted 帶有 caseId、submissionId 與 reviewerId, status: decided, source: [{ decision: D-067 }, { doc: docs/02-ddd/domain-events.md, section: "§6.3" }] }
      emits:
        - { event: InitialReviewStarted, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.3" }] }
    output:
      fields:
        - { name: submissionId, type: id }

  - name: SaveInitialReviewDraft
    kind: command
    summary: 保存初審草稿的答案與評語
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId,  type: id,                  required: true }
      - { name: answers, type: "list<AnswerInput>", required: true }
      - { name: comment, type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-DRF-01
        when: 操作者不是這份初審草稿的醫師
        outcome: { result: REJECTED, code: SUBMISSION_NOT_OWNED_BY_ACTOR }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-DRF-02
        when: 答案與評語和已保存的草稿完全相同
        outcome: { result: REJECTED, code: NO_CHANGES, no_change: true }
        status: decided
        source: [{ decision: D-038 }]
      - id: RC-DRF-03
        when: 案件的 status 不是 INITIAL_REVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }
        status: decided
        source: [{ decision: D-068 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-DRF-04
        when: 輸入的 answers 不合法（RC-INV-07），在狀態、提交歸屬的檢查之後、沒有變更的檢查之前
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-085 }, { rule: RC-INV-07 }]
    success:
      state:
        - { id: RC-DRF-S1, text: 草稿的答案與評語等於輸入, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
        - { id: RC-DRF-S2, text: ReviewDraftSaved 帶有 submissionId 與 caseId, status: decided, source: [{ decision: D-067 }, { doc: docs/02-ddd/domain-events.md, section: "§7.1" }] }
      emits:
        - { event: ReviewDraftSaved, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§7.1" }] }

  - name: SubmitInitialReview
    kind: command
    summary: 提交初審；不固定、不進複審、不結案
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-SUB-01
        when: 操作者不是這份初審草稿的醫師
        outcome: { result: REJECTED, code: SUBMISSION_NOT_OWNED_BY_ACTOR }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§4.2、§11.3" }]
      - id: RC-SUB-02
        when: 案件的 status 不是 INITIAL_REVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_INITIAL_REVIEW_STAGE }
        status: decided
        source: [{ decision: D-067 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-SUB-03
        when: 評分表有必答的題目沒有作答
        outcome: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }
        status: decided
        source: [{ decision: D-067 }]
      - id: RC-SUB-04
        when: 草稿的答案不合法（RC-INV-07），在必答題的檢查之前
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-085 }, { rule: RC-INV-07 }]
    success:
      state:
        - { id: RC-SUB-S1, text: status = INITIAL_REVIEW_COMPLETED，不論分數與品質線的關係, status: decided, source: [{ decision: D-031 }, { decision: D-054 }] }
        - { id: RC-SUB-S2, text: 初審提交的狀態是 SUBMITTED，submittedAt 是提交當時的時間,  status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
        - { id: RC-SUB-S3, text: ReviewSubmissionSubmitted 帶有 caseId 與 submissionId, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§7.2" }, { decision: D-066 }] }
        - { id: RC-SUB-S4, text: InitialReviewCompleted 帶有 caseId 與 submissionId, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.4" }, { decision: D-067 }] }
        - { id: RC-SUB-S5, text: ReviewSubmissionSubmitted 的 stage 是 INITIAL, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§7.2" }, { decision: D-076 }] }
      emits:
        - { event: ReviewSubmissionSubmitted, status: decided,  source: [{ doc: docs/02-ddd/domain-events.md, section: "§7.2" }] }
        - { event: InitialReviewCompleted,    status: decided,  source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.4" }, { decision: D-067 }] }
    output:
      fields:
        - { name: submissionId, type: id }
        - { name: caseStatus,   type: enum CaseStatus }
        - { name: totalScore,   type: decimal(2) }

  # ---------- 初審固定與送複審（D-069） ----------

  - name: FixInitialReview
    kind: command
    summary: 初審醫師固定自己目前有效的初審結果；分數大於品質線就進複審
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId,       type: id, required: true }
      - { name: submissionId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-04, RC-G-03]
    rules:
      - id: RC-FIX-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-02
        when: 案件的初審已經固定
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-03
        when: 案件的 status 不是 INITIAL_REVIEW_COMPLETED
        outcome: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-04
        when: 這份提交不屬於本案、不是初審階段，或不是本案目前有效的初審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-05
        when: 這份提交還是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-FIX-06
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-054 }]
    success:
      state:
        - { id: RC-FIX-S1, text: 被固定那份提交的分數大於專案的品質線時，status = PENDING_REREVIEW, status: decided, source: [{ decision: D-031 }, { decision: D-054 }] }
        - { id: RC-FIX-S2, text: 分數不大於品質線，或品質線沒有設定時，status 維持 INITIAL_REVIEW_COMPLETED, status: decided, source: [{ decision: D-054 }] }
        - { id: RC-FIX-S3, text: 輸出的 fixedAt 是固定當時的時間, status: decided, source: [{ decision: D-054 }] }
        - { id: RC-FIX-S4, text: InitialReviewFixed 帶有 caseId 與 submissionId，不帶分數, status: decided, source: [{ decision: D-054 }, { decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.12" }] }
        - { id: RC-FIX-S5, text: 進複審時，ReviewCaseEscalatedToRereview 帶有 caseId、projectId、triggeredBySubmissionId、initialScore、qualityThreshold, status: decided, source: [{ decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }
      emits:
        - { event: InitialReviewFixed,            status: decided, source: [{ decision: D-054 }, { doc: docs/02-ddd/domain-events.md, section: "§6.12" }] }
        - { event: ReviewCaseEscalatedToRereview, status: decided, source: [{ decision: D-054 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }
    output:
      status: decided
      source: [{ decision: D-054 }]
      fields:
        - { name: caseId,       type: id }
        - { name: caseStatus,   type: enum CaseStatus }
        - { name: submissionId, type: id }
        - { name: fixedAt,      type: datetime }

  - name: SendToRereview
    kind: command
    summary: 管理者把初審已固定、沒有自動進複審的案件送複審
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-SND-01
        when: 案件的 status 不是 INITIAL_REVIEW_COMPLETED
        outcome: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.10" }]
      - id: RC-SND-02
        when: 案件的初審還沒有固定
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: decided
        source: [{ decision: D-054 }]
    success:
      state:
        - { id: RC-SND-S1, text: status = PENDING_REREVIEW, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.10" }] }
        - { id: RC-SND-S2, text: ReviewCaseEscalatedToRereview 帶有 caseId 與 projectId, status: decided, source: [{ decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }
      emits:
        - { event: ReviewCaseEscalatedToRereview, status: decided, source: [{ decision: D-069 }, { doc: docs/02-ddd/domain-events.md, section: "§6.5" }] }

  # ---------- 複審（D-069） ----------

  - name: AssignRereviewer
    kind: command
    summary: 指派複審醫師與期限
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId,       type: id,       required: true }
      - { name: rereviewerId, type: id,       required: true }
      - { name: dueAt,        type: datetime, required: true, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.5" }] }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-ARR-01
        when: 案件的 status 不是 PENDING_REREVIEW
        outcome: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }
        status: decided
        source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-ARR-02
        when: rereviewerId 或 dueAt 沒有給
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§10.5" }]
      - id: RC-ARR-03
        when: rereviewerId 是本案的初審醫師
        outcome: { result: REJECTED, code: REREVIEWER_SAME_AS_REVIEWER }
        status: decided
        source: [{ decision: D-017 }]
      - id: RC-ARR-04
        when: rereviewerId 讀過本案的完整初審（案件詳情、提交明細或修正歷史留下的讀取者紀錄），在前面的檢查都通過之後
        outcome: { result: REJECTED, code: REREVIEWER_HAS_READ_INITIAL }
        status: decided
        source: [{ decision: D-055 }, { decision: D-082 }, { decision: D-084 }]
    success:
      state:
        - { id: RC-ARR-S1, text: rereviewerId 等於輸入，status 維持 PENDING_REREVIEW, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.5" }, { scenario: TS-RR-001 }] }
        - { id: RC-ARR-S2, text: RereviewerAssigned 帶有 caseId、rereviewerId、dueAt, status: decided, source: [{ decision: D-070 }, { doc: docs/02-ddd/domain-events.md, section: "§6.6" }] }
      emits:
        - { event: RereviewerAssigned, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.6" }] }

  - name: StartRereview
    kind: command
    summary: 受指派的複審醫師開始複審，建立複審草稿
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-STR-01
        when: 案件已指派複審醫師，但操作者不是
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }
        status: decided
        source: [{ decision: D-068 }]
      - id: RC-STR-02
        when: 案件的 status 不是 PENDING_REREVIEW
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }, { doc: docs/03-contracts/api-spec.md, section: "§4.2" }]
      - id: RC-STR-03
        when: 案件還沒有指派複審醫師
        outcome: { result: REJECTED, code: NO_REREVIEWER_ASSIGNED }
        status: decided
        source: [{ decision: D-069 }]
    success:
      state:
        - { id: RC-STR-S1, text: status = REREVIEW_IN_PROGRESS, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§3.2" }, { scenario: TS-RR-002 }] }
        - { id: RC-STR-S2, text: 建立一份複審階段的提交，狀態 DRAFT、revisionNo = 1、醫師是操作者, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }, { decision: D-069 }] }
        - { id: RC-STR-S4, text: 複審草稿的 basedOnScoreSheetVersionId 是案件的評分表版本（scoreSheetVersionRef）；修正照舊帶過去, status: decided, source: [{ decision: D-085 }] }
        - { id: RC-STR-S3, text: RereviewStarted 帶有 caseId、submissionId、rereviewerId, status: decided, source: [{ decision: D-070 }, { doc: docs/02-ddd/domain-events.md, section: "§6.7" }] }
      emits:
        - { event: RereviewStarted, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.7" }] }
    output:
      fields:
        - { name: submissionId, type: id }

  - name: SaveRereviewDraft
    kind: command
    summary: 保存複審草稿的答案與評語
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId,       type: id,                  required: true }
      - { name: submissionId, type: id,                  required: true }
      - { name: answers,      type: "list<AnswerInput>", required: true }
      - { name: comment,      type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-RDR-10
        when: submissionId 或 answers 沒有給，在狀態檢查之前
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-088 }]
      - id: RC-RDR-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-02
        when: 案件的 status 不是 REREVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-RDR-03
        when: 操作者不是這個案件受指派的複審醫師
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }
        status: decided
        source: [{ decision: D-068 }]
      - id: RC-RDR-04
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-RDR-05
        when: 這份提交不屬於本案，或不是複審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-06
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-07
        when: 這份提交不是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_DRAFT }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-RDR-08
        when: 這份提交不是本案目前有效的複審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RDR-09
        when: 答案與評語和已保存的草稿完全相同
        outcome: { result: REJECTED, code: NO_CHANGES, no_change: true }
        status: decided
        source: [{ decision: D-038 }]
    success:
      state:
        - { id: RC-RDR-S1, text: 草稿的答案與評語等於輸入, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
        - { id: RC-RDR-S2, text: ReviewDraftSaved 帶有 submissionId 與 caseId, status: decided, source: [{ decision: D-076 }, { doc: docs/02-ddd/domain-events.md, section: "§7.1" }] }
      emits:
        - { event: ReviewDraftSaved, status: decided, source: [{ decision: D-076 }, { doc: docs/02-ddd/domain-events.md, section: "§7.1" }] }

  - name: SubmitRereview
    kind: command
    summary: 提交複審；系統計分、計算 finalScore，不結案
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId,       type: id,                  required: true }
      - { name: submissionId, type: id,                  required: true, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§12.3" }] }
      - { name: answers,      type: "list<AnswerInput>", required: false }
      - { name: comment,      type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-SRR-11
        when: submissionId 沒有給，在狀態檢查之前
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-088 }]
      - id: RC-SRR-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-SRR-02
        when: 案件的 status 不是 REREVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-SRR-03
        when: 操作者不是這個案件受指派的複審醫師
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }
        status: decided
        source: [{ decision: D-068 }, { scenario: TS-RR-004 }]
      - id: RC-SRR-04
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-SRR-05
        when: 這份提交不屬於本案，或不是複審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-SRR-06
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-SRR-07
        when: 這份提交不是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_DRAFT }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-SRR-08
        when: 這份提交不是本案目前有效的複審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-SRR-09
        when: 這次提交採用的答案（輸入有 answers 就是它，否則是草稿的答案）裡，評分表有必答的題目沒有作答
        outcome: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }
        status: decided
        source: [{ decision: D-076 }]
      - id: RC-SRR-10
        when: 這次提交採用的答案不合法（RC-INV-07），在必答題的檢查之前。複審草稿保存時不計分（D-069 第 7 點），所以不合法的作答在提交時才擋下
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-085 }, { rule: RC-INV-07 }]
    success:
      state:
        - { id: RC-SRR-S1, text: status 維持 REREVIEW_IN_PROGRESS，不結案、不固定, status: decided, source: [{ decision: D-032 }, { decision: D-053 }, { scenario: TS-RR-003 }] }
        - { id: RC-SRR-S2, text: 複審提交的狀態是 SUBMITTED，submittedAt 是提交當時的時間；totalScore 由系統依評分表計算, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }, { decision: D-032 }] }
        - { id: RC-SRR-S3, text: RereviewCompleted 帶有 caseId、submissionId、rereviewerId、rereviewScore、finalScore；finalScore 依 D-012、D-020 由初審與複審分數加權, status: decided, source: [{ decision: D-070 }, { doc: docs/02-ddd/domain-events.md, section: "§6.8、§14" }] }
        - { id: RC-SRR-S4, text: 輸出沒有 finalScore，也沒有初審的分數, status: decided, source: [{ decision: D-033 }, { decision: D-053 }] }
        - { id: RC-SRR-S5, text: ReviewSubmissionSubmitted 帶有 caseId 與 submissionId，stage 是 REREVIEW, status: decided, source: [{ decision: D-076 }, { doc: docs/02-ddd/domain-events.md, section: "§7.2" }] }
      emits:
        - { event: ReviewSubmissionSubmitted, status: decided, source: [{ decision: D-076 }, { doc: docs/02-ddd/domain-events.md, section: "§7.2" }] }
        - { event: RereviewCompleted, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.8" }] }
    output:
      fields:
        - { name: submissionId, type: id }
        - { name: status,       type: enum SubmissionStatus }
        - { name: caseId,       type: id }
        - { name: caseStatus,   type: enum CaseStatus }

  - name: CloseRereview
    kind: command
    summary: 目前有效複審結果的提交醫師結案；結案即固定複審結果
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId,       type: id, required: true }
      - { name: submissionId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-CLR-01
        when: 案件的 status 是 CLOSED 或 CANCELLED（含重複結案）
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-02
        when: 案件的 status 不是 REREVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_REREVIEW_STAGE }
        status: decided
        source: [{ decision: D-069 }]
      - id: RC-CLR-03
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-04
        when: 這份提交不屬於本案，或不是複審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-05
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-06
        when: 這份提交還是草稿
        outcome: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-CLR-07
        when: 這份提交不是本案目前有效的複審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
    success:
      state:
        - { id: RC-CLR-S1, text: status = CLOSED, status: decided, source: [{ decision: D-034 }, { decision: D-053 }] }
        - { id: RC-CLR-S2, text: ReviewCaseClosed 帶有 caseId 與 submissionId（結案時固定的那份複審提交）, status: decided, source: [{ decision: D-070 }, { decision: D-053 }, { doc: docs/02-ddd/domain-events.md, section: "§6.9" }] }
        - { id: RC-CLR-S3, text: 輸出沒有 finalScore, status: decided, source: [{ decision: D-033 }, { decision: D-053 }] }
      emits:
        - { event: ReviewCaseClosed, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.9" }, { decision: D-053 }] }
    output:
      status: decided
      source: [{ decision: D-053 }]
      fields:
        - { name: caseId,       type: id }
        - { name: caseStatus,   type: enum CaseStatus }
        - { name: submissionId, type: id }

  # ---------- 退回、重開、取消、不經複審結案（D-080） ----------

  - name: ReviseInitialReview
    kind: command
    summary: 原醫師修正已提交、還沒固定的初審（append-only）
    actor: { roles: [REVIEWER] }
    input:
      - { name: caseId,       type: id,                  required: true }
      - { name: submissionId, type: id,                  required: true }
      - { name: answers,      type: "list<AnswerInput>", required: true }
      - { name: comment,      type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-RVI-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-006 }, { decision: D-032 }]
      - id: RC-RVI-02
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-RVI-03
        when: 這份提交不屬於本案，或不是初審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-083 }]
      - id: RC-RVI-04
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-054 }, { doc: docs/03-contracts/api-spec.md, section: "§11.4" }]
      - id: RC-RVI-05
        when: 這份提交不是 SUBMITTED（草稿或已被取代）
        outcome: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-RVI-06
        when: 這份提交不是本案目前有效的初審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-RVI-07
        when: 初審已固定
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: decided
        source: [{ decision: D-031 }, { decision: D-054 }]
      - id: RC-RVI-08
        when: 輸入的 answers 裡，評分表有必答的題目沒有作答
        outcome: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }
        status: decided
        source: [{ decision: D-083 }]
      - id: RC-RVI-09
        when: answers 與 comment 都和這份提交相同
        outcome: { result: REJECTED, code: NO_CHANGES }
        status: decided
        source: [{ decision: D-038 }, { decision: D-083 }]
      - id: RC-RVI-10
        when: 輸入的 answers 不合法（RC-INV-07），在未固定的檢查之後、必答題之前（D-083 第 7 點的順序加上這一步）
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-085 }, { rule: RC-INV-07 }]
    success:
      state:
        - { id: RC-RVI-S1, text: 建立新的初審提交，狀態 SUBMITTED、revisionNo 加 1、醫師與評分表版本同原提交；原提交改為 SUPERSEDED 並指向新提交；案件改指新提交，status 不變, status: decided, source: [{ decision: D-032 }, { decision: D-083 }, { doc: docs/03-contracts/api-spec.md, section: "§11.4" }] }
        - { id: RC-RVI-S2, text: 初審分數與 finalScore 改為新提交的 totalScore, status: decided, source: [{ decision: D-083 }] }
        - { id: RC-RVI-S3, text: ReviewSubmissionRevised 帶有 caseId、oldSubmissionId、newSubmissionId、stage = INITIAL、revisionNo；不帶分數, status: decided, source: [{ decision: D-083 }, { doc: docs/02-ddd/domain-events.md, section: "§8.1" }] }
      emits:
        - { event: ReviewSubmissionRevised, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§8.1" }] }
    output:
      fields:
        - { name: newSubmissionId, type: id }
        - { name: oldSubmissionId, type: id }
        - { name: revisionNo,      type: int }
        - { name: totalScore,      type: decimal(2) }
        - { name: status,          type: enum SubmissionStatus }
        - { name: stage,           type: enum ReviewStage }
        - { name: caseId,          type: id }

  - name: ReviseRereview
    kind: command
    summary: 複審醫師修正已提交、還沒結案的複審（append-only）
    actor: { roles: [REREVIEWER] }
    input:
      - { name: caseId,       type: id,                  required: true }
      - { name: submissionId, type: id,                  required: true }
      - { name: answers,      type: "list<AnswerInput>", required: true }
      - { name: comment,      type: text,                required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-RVR-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-032 }]
      - id: RC-RVR-02
        when: 操作者不是這個案件受指派的複審醫師
        outcome: { result: REJECTED, code: NOT_ASSIGNED_REREVIEWER }
        status: decided
        source: [{ decision: D-068 }]
      - id: RC-RVR-03
        when: submissionId 找不到對應的提交
        outcome: { result: REJECTED, code: SUBMISSION_NOT_FOUND }
        status: decided
        source: [{ decision: D-054 }]
      - id: RC-RVR-04
        when: 這份提交不屬於本案，或不是複審階段
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }, { decision: D-083 }]
      - id: RC-RVR-05
        when: 操作者不是這份提交的醫師
        outcome: { result: REJECTED, code: NOT_SUBMISSION_OWNER }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RVR-06
        when: 這份提交不是 SUBMITTED（草稿或已被取代）
        outcome: { result: REJECTED, code: SUBMISSION_NOT_SUBMITTED }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RVR-07
        when: 這份提交不是本案目前有效的複審結果
        outcome: { result: REJECTED, code: CONFLICT }
        status: decided
        source: [{ decision: D-053 }]
      - id: RC-RVR-08
        when: 輸入的 answers 裡，評分表有必答的題目沒有作答
        outcome: { result: REJECTED, code: REQUIRED_ITEMS_NOT_ANSWERED }
        status: decided
        source: [{ decision: D-083 }]
      - id: RC-RVR-09
        when: answers 與 comment 都和這份提交相同
        outcome: { result: REJECTED, code: NO_CHANGES }
        status: decided
        source: [{ decision: D-038 }, { decision: D-083 }]
      - id: RC-RVR-10
        when: 輸入的 answers 不合法（RC-INV-07），在目前有效的檢查之後、必答題之前
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-085 }, { rule: RC-INV-07 }]
    success:
      state:
        - { id: RC-RVR-S1, text: 建立新的複審提交，狀態 SUBMITTED、revisionNo 加 1；原提交改為 SUPERSEDED 並指向新提交；案件改指新提交，status 維持 REREVIEW_IN_PROGRESS, status: decided, source: [{ decision: D-032 }, { decision: D-083 }] }
        - { id: RC-RVR-S2, text: finalScore 依 D-012、D-020 以固定的初審分數與新的複審分數重算, status: decided, source: [{ decision: D-032 }] }
        - { id: RC-RVR-S3, text: RereviewRevised 帶有 caseId、oldSubmissionId、newSubmissionId、rereviewScore、finalScore；ReviewSubmissionRevised 帶有 caseId、oldSubmissionId、newSubmissionId、stage = REREVIEW、revisionNo, status: decided, source: [{ decision: D-083 }, { doc: docs/02-ddd/domain-events.md, section: "§8.1、§8.2" }] }
        - { id: RC-RVR-S4, text: 輸出沒有 finalScore，也沒有初審的分數, status: decided, source: [{ decision: D-033 }] }
      emits:
        - { event: ReviewSubmissionRevised, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§8.1" }] }
        - { event: RereviewRevised, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§8.2" }] }
    output:
      fields:
        - { name: newSubmissionId, type: id }
        - { name: oldSubmissionId, type: id }
        - { name: revisionNo,      type: int }
        - { name: totalScore,      type: decimal(2) }
        - { name: status,          type: enum SubmissionStatus }
        - { name: stage,           type: enum ReviewStage }
        - { name: caseId,          type: id }

  - name: ReassignReviewCase
    kind: command
    summary: 管理者在初審開始前改派初審醫師或期限
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId,     type: id,       required: true }
      - { name: reviewerId, type: id,       required: true }
      - { name: dueAt,      type: datetime, required: true, status: decided, source: [{ decision: D-073 }, { doc: docs/03-contracts/api-spec.md, section: "§10.4" }] }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-RAS-01
        when: reviewerId 或 dueAt 沒有給（空白也算），在狀態檢查之前
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-082 }]
      - id: RC-RAS-02
        when: 案件的 status 不是 PENDING_INITIAL_REVIEW
        outcome: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }
        status: decided
        source: [{ decision: D-082 }]
    success:
      state:
        - { id: RC-RAS-S1, text: status 維持 PENDING_INITIAL_REVIEW；reviewerId、dueAt 等於輸入；原本的醫師不能再開始初審, status: decided, source: [{ decision: D-082 }] }
        - { id: RC-RAS-S2, text: 改派給原本的醫師也成功（只改期限），照樣發出事件, status: decided, source: [{ decision: D-082 }] }
        - { id: RC-RAS-S3, text: "ReviewCaseReassigned 帶有 caseId、previousReviewerId、newReviewerId、dueAt；稽核 detail 是 {\"previousReviewerId\":…,\"newReviewerId\":…,\"dueAt\":…}", status: decided, source: [{ decision: D-082 }, { doc: docs/02-ddd/domain-events.md, section: "§6.15" }] }
      emits:
        - { event: ReviewCaseReassigned, status: decided, source: [{ decision: D-082 }, { doc: docs/02-ddd/domain-events.md, section: "§6.15" }] }

  - name: ReassignRereviewer
    kind: command
    summary: 管理者在複審開始前改派複審醫師或期限
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId,       type: id,       required: true }
      - { name: rereviewerId, type: id,       required: true }
      - { name: dueAt,        type: datetime, required: true, status: decided, source: [{ decision: D-073 }, { doc: docs/03-contracts/api-spec.md, section: "§10.6" }] }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-RRR-01
        when: rereviewerId 或 dueAt 沒有給（空白也算），在狀態檢查之前
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-082 }]
      - id: RC-RRR-02
        when: 案件的 status 不是 PENDING_REREVIEW（含 REREVIEW_IN_PROGRESS）
        outcome: { result: REJECTED, code: CASE_NOT_ASSIGNABLE }
        status: decided
        source: [{ decision: D-055 }, { decision: D-069 }, { decision: D-082 }]
      - id: RC-RRR-03
        when: 案件還沒有指派複審醫師
        outcome: { result: REJECTED, code: NO_REREVIEWER_ASSIGNED }
        status: decided
        source: [{ decision: D-082 }]
      - id: RC-RRR-04
        when: rereviewerId 是本案的初審醫師
        outcome: { result: REJECTED, code: REREVIEWER_SAME_AS_REVIEWER }
        status: decided
        source: [{ decision: D-017 }]
      - id: RC-RRR-05
        when: rereviewerId 讀過本案的完整初審（案件詳情、提交明細或修正歷史留下的讀取者紀錄），在前面的檢查都通過之後
        outcome: { result: REJECTED, code: REREVIEWER_HAS_READ_INITIAL }
        status: decided
        source: [{ decision: D-055 }, { decision: D-082 }, { decision: D-084 }]
    success:
      state:
        - { id: RC-RRR-S1, text: status 維持 PENDING_REREVIEW；rereviewerId、dueAt 等於輸入；原本的複審醫師不能再開始複審, status: decided, source: [{ decision: D-082 }] }
        - { id: RC-RRR-S2, text: 改派給原本的複審醫師也成功（只改期限），照樣發出事件, status: decided, source: [{ decision: D-082 }] }
        - { id: RC-RRR-S3, text: RereviewerAssigned 帶有 caseId、rereviewerId、dueAt，reassignment 為 true（指派時為 false）, status: decided, source: [{ decision: D-070 }, { decision: D-082 }, { doc: docs/02-ddd/domain-events.md, section: "§6.6" }] }
      emits:
        - { event: RereviewerAssigned, status: decided, source: [{ doc: docs/02-ddd/domain-events.md, section: "§6.6" }] }

  - name: ReturnInitialReview
    kind: command
    summary: 管理者把初審中的案件退回
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId, type: id,   required: true }
      - { name: reason, type: text, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-RET-01
        when: 案件的 status 不是 INITIAL_REVIEW_IN_PROGRESS
        outcome: { result: REJECTED, code: CASE_NOT_IN_PROGRESS }
        status: decided
        source: [{ decision: D-080 }, { doc: docs/02-ddd/state-machine.md, section: "§3.2" }]
      - id: RC-RET-02
        when: reason 是空白
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-080 }]
    success:
      state:
        - { id: RC-RET-S1, text: status = RETURNED；進行中的初審提交維持 DRAFT, status: decided, source: [{ decision: D-080 }, { doc: docs/02-ddd/state-machine.md, section: "§3.2" }] }
        - { id: RC-RET-S2, text: ReviewCaseReturned 帶有 caseId 與 reason, status: decided, source: [{ decision: D-080 }, { doc: docs/02-ddd/domain-events.md, section: "§6.10" }] }
        - { id: RC-RET-S3, text: "稽核紀錄的 detail 是合法的 JSON {\"reason\":…}，reason 含引號、反斜線、換行時照樣跳脫", status: decided, source: [{ decision: D-080 }] }
      emits:
        - { event: ReviewCaseReturned, status: decided, source: [{ decision: D-080 }, { doc: docs/02-ddd/domain-events.md, section: "§6.10" }] }

  - name: ReopenInitialReview
    kind: command
    summary: 管理者把退回的案件重新開放初審
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-REO-01
        when: 案件的 status 不是 RETURNED
        outcome: { result: REJECTED, code: CASE_NOT_RETURNED }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.11" }]
    success:
      state:
        - { id: RC-REO-S1, text: status = PENDING_INITIAL_REVIEW；初審醫師與期限不變（要換人或改期限，重開後改派）, status: decided, source: [{ decision: D-080 }, { doc: docs/03-contracts/api-spec.md, section: "§10.11" }] }
        - { id: RC-REO-S2, text: 發出 ReviewCaseReopened，帶有 caseId、reviewerId 與 dueAt；不發 ReviewCaseAssigned, status: decided, source: [{ decision: D-080 }] }
      emits:
        - { event: ReviewCaseReopened, status: decided, source: [{ decision: D-080 }] }

  - name: CancelReviewCase
    kind: command
    summary: 管理者取消還沒終止的案件
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId, type: id,   required: true }
      - { name: reason, type: text, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-CAN-01
        when: 案件的 status 是 CLOSED 或 CANCELLED
        outcome: { result: REJECTED, code: CASE_TERMINAL }
        status: decided
        source: [{ decision: D-006 }, { decision: D-080 }]
      - id: RC-CAN-02
        when: reason 是空白
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: decided
        source: [{ decision: D-080 }]
    success:
      state:
        - { id: RC-CAN-S1, text: 從任何還沒終止的狀態都可以取消，status = CANCELLED, status: decided, source: [{ decision: D-080 }, { decision: D-006 }] }
        - { id: RC-CAN-S2, text: ReviewCaseCancelled 帶有 caseId 與 reason, status: decided, source: [{ decision: D-080 }, { doc: docs/02-ddd/domain-events.md, section: "§6.11" }] }
        - { id: RC-CAN-S3, text: "稽核紀錄的 detail 是合法的 JSON {\"reason\":…}，reason 含引號、反斜線、換行時照樣跳脫", status: decided, source: [{ decision: D-080 }] }
      emits:
        - { event: ReviewCaseCancelled, status: decided, source: [{ decision: D-080 }, { doc: docs/02-ddd/domain-events.md, section: "§6.11" }] }

  - name: CloseWithoutRereview
    kind: command
    summary: 管理者把初審已固定、不需複審的案件直接結案
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-CWR-01
        when: 案件的 status 不是 INITIAL_REVIEW_COMPLETED
        outcome: { result: REJECTED, code: CASE_NOT_INITIAL_REVIEW_COMPLETED }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.9" }]
      - id: RC-CWR-02
        when: 案件的初審還沒有固定
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: decided
        source: [{ decision: D-031 }, { decision: D-054 }]
    success:
      state:
        - { id: RC-CWR-S1, text: status = CLOSED；finalScore 是初審分數, status: decided, source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.9" }] }
        - { id: RC-CWR-S2, text: 發出 CaseClosedWithoutRereview（稽核 action CASE_CLOSED_WITHOUT_REREVIEW），帶有 caseId；不發 ReviewCaseClosed, status: decided, source: [{ decision: D-080 }] }
      emits:
        - { event: CaseClosedWithoutRereview, status: decided, source: [{ decision: D-080 }] }

  # ---------- revision 歷程 ----------

  - name: GetRevisionHistory
    kind: query
    summary: 查詢案件各階段、各版本的提交歷程；內容依角色遮罩
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    guard_exceptions:
      - { guard: RC-G-03, text: SYSTEM_ADMIN 的讀取不受院區限制, status: decided, source: [{ decision: D-047 }] }
    rules:
      - id: RC-RVH-01
        when: 操作者同時具備兩個以上的角色（院區範圍 RC-G-03 先檢查，D-084 第 1 點）
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-035 }, { decision: D-055 }, { decision: D-084 }]
      - id: RC-RVH-02
        when: 操作者是 REVIEWER 或 REREVIEWER，但不是這個案件該階段受指派的醫師，也沒有在該階段提交過
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5" }]
      - id: RC-VIS-01
        when: 操作者是 HOSPITAL_MANAGER、AUDITOR，或本案的初審醫師，且不是本案現任或曾經的複審醫師
        text: 每一筆歷程都有 totalScore 與 comment
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5" }, { decision: D-055 }]
      - id: RC-VIS-02
        when: 操作者是 REREVIEWER（本案目前的複審醫師或提交過複審的人）
        text: 初審的每一筆沒有 totalScore 與 comment；自己的複審那幾筆有 totalScore 與 comment
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-033 }, { decision: D-085 }]
      - id: RC-VIS-04
        when: 操作者是本案的初審醫師
        text: 複審的每一筆也有 totalScore 與 comment
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-084 }, { decision: D-085 }]
      - id: RC-VIS-03
        when: 操作者是 SYSTEM_ADMIN
        text: 每一筆歷程都沒有 totalScore 與 comment
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { rule: RC-INV-02 }]
      - id: RC-VIS-05
        when: 操作者是 SYSTEM_ADMIN
        text: 每一筆歷程只有 submissionId、stage、revisionNo、status、submittedAt、reviewerId、supersededBySubmissionId（permission-matrix 的 submittedBy 是 reviewerId；isCurrentEffective 由 status 與 supersededBySubmissionId 表示）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { decision: D-067 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§13.2" }]
      fields:
        - { name: caseId,  type: id }
        - { name: entries, type: "list<RevisionEntry>" }

  # ---------- 讀取：案件詳情、提交明細（D-084） ----------
  # 完整讀取的授權（ReviewReadAccessPolicy）三個查詢共用：GetRevisionHistory、GetReviewCaseDetail、GetSubmissionDetail。
  # 准許 HOSPITAL_MANAGER、AUDITOR、REVIEWER 的完整讀取時寫入讀取者紀錄（D-055 第 5 點），所以這兩個查詢會產生寫入。

  - name: GetReviewCaseDetail
    kind: query
    summary: 查詢一個案件的詳情；內容依角色投影（完整、複審盲審、metadata）
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    guard_exceptions:
      - { guard: RC-G-03, text: SYSTEM_ADMIN 的讀取不受院區限制, status: decided, source: [{ decision: D-047 }] }
    rules:
      - id: RC-DET-01
        when: 操作者同時具備兩個以上的角色（院區範圍先檢查）
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-035 }, { decision: D-055 }, { decision: D-084 }]
      - id: RC-DET-02
        when: 操作者是 REVIEWER，但不是本案的初審醫師，也沒有提交過本案的初審；或是 REREVIEWER，但不是本案目前的複審醫師，也沒有提交過本案的複審
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5" }, { decision: D-084 }]
      - id: RC-DET-03
        when: 操作者是 HOSPITAL_MANAGER、AUDITOR 或 REVIEWER，而且是本案目前或曾經的複審醫師，或本案的複審指派歷史不完整
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-035 }, { decision: D-055 }]
      - id: RC-DTV-01
        when: 操作者是 HOSPITAL_MANAGER、AUDITOR 或 REVIEWER，通過前面的檢查
        text: 完整投影：projectionType = FULL，有 initialReviewScore、finalScore，每一筆提交都有 totalScore；寫入讀取者紀錄（同一人同一案一筆）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-084 }]
      - id: RC-DTV-02
        when: 操作者是 REVIEWER
        text: 看得到複審的分數與 finalScore（D-033 只保護複審醫師）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5" }, { decision: D-084 }]
      - id: RC-DTV-03
        when: 操作者是 REREVIEWER
        text: 盲審投影：沒有 initialReviewScore、finalScore；初審提交的 totalScore 是 null；rereviewContext 沒有 initialTotalScore、finalScore。初審醫師的身分（reviewerId、rereviewContext.initialReviewerId）與初審提交的 ID、版本、提交時間可見。不寫入讀取者紀錄
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-033 }, { decision: D-084 }]
      - id: RC-DTV-04
        when: 操作者是 SYSTEM_ADMIN
        text: 只有 metadata 白名單：caseId、caseStatus、projectName、hospitalId、reviewerId、rereviewerId、updatedAt（D-094 第 9 點移除 latestRevisionSummary）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { decision: D-037 }, { rule: RC-INV-02 }]
      - id: RC-DTC-01
        when: 操作者是本案的初審醫師
        text: initialReviewContext 的 pageMode、allowedActions：有自己的草稿是 EDIT_DRAFT（SAVE_INITIAL_REVIEW_DRAFT、SUBMIT_INITIAL_REVIEW）；有已提交的是 REVISION（REVISE_INITIAL_REVIEW，案件是 INITIAL_REVIEW_COMPLETED、未固定且是目前有效的提交時另有 FIX_INITIAL_REVIEW）；都沒有是 NEW_INITIAL_REVIEW（START_INITIAL_REVIEW）。結案、取消、固定後是 READONLY_BLOCKED（CASE_ALREADY_CLOSED、CASE_ALREADY_CANCELLED、INITIAL_REVIEW_FIXED）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-032 }, { decision: D-054 }, { decision: D-084 }]
      - id: RC-DTC-02
        when: 操作者是本案目前的複審醫師
        text: rereviewContext 的 pageMode、allowedActions：有自己的草稿是 EDIT_DRAFT（SAVE_REREVIEW_DRAFT、SUBMIT_REREVIEW）；有已提交的是 REVISION（REVISE_REREVIEW、CLOSE_REREVIEW）；都沒有是 NEW_REREVIEW（START_REREVIEW）。結案、取消後是 READONLY_BLOCKED（CASE_ALREADY_CLOSED、CASE_ALREADY_CANCELLED）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-032 }, { decision: D-034 }, { decision: D-053 }, { decision: D-084 }]
      - id: RC-DTC-03
        when: 操作者不是該頁的角色（例如管理者讀初審頁）
        text: 該頁的 context 是 READONLY_BLOCKED、blockedReason = ROLE_DENIED、allowedActions 是空的
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-084 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.2" }, { decision: D-084 }]
      fields:
        - { name: caseId,                     type: id }
        - { name: projectId,                  type: id }
        - { name: batchId,                    type: id }
        - { name: hospitalId,                 type: id }
        - { name: status,                     type: enum CaseStatus }
        - { name: reviewerId,                 type: id }
        - { name: rereviewerId,               type: id }
        - { name: medicalRecordType,          type: text }
        - { name: sourceCaseKey,              type: text }
        - { name: initialReviewScore,         type: decimal(2) }
        - { name: finalScore,                 type: decimal(2) }
        - { name: createdAt,                  type: datetime }
        - { name: assignedAt,                 type: datetime }
        - { name: dueAt,                      type: datetime }
        - { name: closedAt,                   type: datetime }
        - { name: cancelledAt,                type: datetime }
        - { name: latestInitialSubmissionId,  type: id }
        - { name: latestRereviewSubmissionId, type: id }
        - { name: scoreSheetVersionRef,       type: text }
        - { name: submissions,                type: "list<SubmissionSummary>" }
        - { name: projectionType,             type: text }
        - { name: actorRole,                  type: text }
        - { name: initialReviewContext,       type: ReviewPageContext }
        - { name: rereviewContext,            type: ReviewPageContext }

  - name: GetReviewCaseScoreSheet
    kind: query
    summary: 查詢一個案件要用的評分表：章節與題目。審查醫師作答時的題目來源（D-101）
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-CSS-01
        when: 操作者同時具備兩個以上的角色（院區範圍先檢查）
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-101 }, { rule: RC-DET-01 }]
      - id: RC-CSS-02
        when: 操作者是 REVIEWER，但不是本案的初審醫師，也沒有提交過本案的初審；或是 REREVIEWER，但不是本案目前的複審醫師，也沒有提交過本案的複審
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-101 }, { rule: RC-DET-02 }]
      - id: RC-CSS-03
        when: 通過前面的檢查，不論案件的狀態
        text: caseId 等於輸入；scoreSheetVersionId 是案件的評分表版本；sections 是那份評分表的章節與題目，內容與 score-sheet 的 GetScoreSheetSections 相同
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-101 }, { decision: D-094 }]
      - id: RC-CSS-04
        when: 任何成功的讀取
        text: 不寫入讀取者紀錄；讀過題目的人之後仍然可以被指派為本案的複審醫師
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-101 }, { decision: D-055 }]
      - id: RC-CSS-05
        when: 操作者是 HOSPITAL_MANAGER、AUDITOR 或 REVIEWER，而且是本案目前或曾經的複審醫師
        text: 照常成功。題目裡沒有任何初審的資訊，RC-DET-03 不適用於這支查詢
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-101 }, { decision: D-033 }]
    output:
      status: decided
      source: [{ decision: D-101 }]
      fields:
        - { name: caseId,              type: id }
        - { name: scoreSheetVersionId, type: id }
        - { name: sections,            type: "list<CaseScoreSheetSection>" }

  - name: GetSubmissionDetail
    kind: query
    summary: 查詢一份提交的明細；內容依角色遮罩
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: submissionId, type: id, required: true }
    guards: [RC-G-01, RC-G-04, RC-G-03]
    guard_exceptions:
      - { guard: RC-G-03, text: 院區是提交所屬案件的院區；SYSTEM_ADMIN 的讀取不受院區限制, status: decided, source: [{ decision: D-047 }, { decision: D-058 }] }
    rules:
      - id: RC-SBD-01
        when: 案件詳情的授權不通過（RC-DET-01～03，以提交所屬的案件判斷）
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-035 }, { decision: D-055 }, { decision: D-084 }]
      - id: RC-SBD-02
        when: 操作者是 REREVIEWER，提交是複審，但不是他的
        outcome: { result: REJECTED, code: ACCESS_DENIED }
        status: decided
        source: [{ decision: D-033 }]
      - id: RC-SBV-01
        when: 操作者是 REREVIEWER，提交是初審；或操作者是 SYSTEM_ADMIN
        text: answers、comment、totalScore、attachmentRefsJson 是 null，maskedFields 依序列出這四個
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-010 }, { decision: D-033 }, { doc: docs/03-contracts/api-spec.md, section: "§13.1" }]
      - id: RC-SBV-02
        when: 操作者是 SYSTEM_ADMIN
        text: 只輸出白名單裡有的欄位：submissionId、caseId、stage、revisionNo、status、reviewerId（submittedBy）、submittedAt，以及 maskedFields；沒有 createdAt
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { decision: D-084 }]
      - id: RC-SBV-03
        when: 其他通過授權的情況（HOSPITAL_MANAGER、AUDITOR、REVIEWER，或 REREVIEWER 讀自己的複審）
        text: 完整內容，沒有 maskedFields；HOSPITAL_MANAGER、AUDITOR、REVIEWER 寫入讀取者紀錄。初審醫師也看得到複審的分數與評語（D-084 第 2 點）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-084 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§13.1" }, { decision: D-084 }]
      fields:
        - { name: submissionId,       type: id }
        - { name: caseId,             type: id }
        - { name: stage,              type: enum ReviewStage }
        - { name: revisionNo,         type: int }
        - { name: status,             type: enum SubmissionStatus }
        - { name: reviewerId,         type: id }
        - { name: answers,            type: "list<AnswerDetail>" }
        - { name: comment,            type: text }
        - { name: attachmentRefsJson, type: text }
        - { name: totalScore,         type: decimal(2) }
        - { name: createdAt,          type: datetime }
        - { name: submittedAt,        type: datetime }
        - { name: maskedFields,       type: "list<text>" }

  # ---------- 讀取：分派頁（D-084） ----------

  - name: GetCaseAssignmentContext
    kind: query
    summary: 分派頁（UI-011）的狀態、可執行動作與目前的醫師與期限
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-ACX-01
        when: 案件是 SELECTED_PENDING_ASSIGNMENT
        text: pageMode = ASSIGN_INITIAL，allowedActions = [ASSIGN_REVIEWER]
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }]
      - id: RC-ACX-02
        when: 案件是 PENDING_INITIAL_REVIEW
        text: pageMode = REASSIGN_INITIAL，allowedActions = [REASSIGN_REVIEWER]
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-082 }]
      - id: RC-ACX-03
        when: 案件是 PENDING_REREVIEW
        text: pageMode = MIXED_ASSIGNMENT；還沒指派複審醫師是 [ASSIGN_REREVIEWER]，已指派是 [REASSIGN_REREVIEWER]；effectiveDueAt 是複審期限
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-069 }, { decision: D-082 }]
      - id: RC-ACX-04
        when: 案件是 RETURNED、INITIAL_REVIEW_IN_PROGRESS、INITIAL_REVIEW_COMPLETED 或 REREVIEW_IN_PROGRESS
        text: pageMode = READONLY_BLOCKED，blockedReason = CASE_NOT_ASSIGNABLE_IN_CURRENT_STATUS，allowedActions 是空的（RETURNED 要先重開，D-080、D-082）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-080 }, { decision: D-082 }, { decision: D-084 }]
      - id: RC-ACX-05
        when: 案件是 CLOSED 或 CANCELLED
        text: pageMode = READONLY_BLOCKED，blockedReason 是 CASE_ALREADY_CLOSED 或 CASE_ALREADY_CANCELLED，allowedActions 是空的
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-084 }]
      - id: RC-ACX-06
        when: 任何狀態
        text: currentReviewer、currentRereviewer 是目前的醫師（userId、displayName、displayLabel、assignedAt），沒有指派時是 null；人員目錄找不到時 displayName、displayLabel 用 userId。effectiveDueAt 在 PENDING_REREVIEW 是複審期限，其他狀態是初審期限
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }, { decision: D-084 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }]
      fields:
        - { name: caseId,            type: id }
        - { name: projectId,         type: id }
        - { name: projectName,       type: text }
        - { name: batchId,           type: id }
        - { name: hospitalId,        type: id }
        - { name: sourceCaseKey,     type: text }
        - { name: medicalRecordType, type: text }
        - { name: status,            type: enum CaseStatus }
        - { name: pageMode,          type: text }
        - { name: blocked,           type: bool }
        - { name: blockedReason,     type: text }
        - { name: allowedActions,    type: "list<text>" }
        - { name: currentReviewer,   type: AssigneeSummary }
        - { name: currentRereviewer, type: AssigneeSummary }
        - { name: reviewerDueAt,     type: datetime }
        - { name: rereviewerDueAt,   type: datetime }
        - { name: effectiveDueAt,    type: datetime }

  - name: ListCaseAssignmentCandidates
    kind: query
    summary: 分派頁的初審或複審醫師候選人
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: caseId,  type: id,   required: true }
      - { name: role,    type: "enum REVIEWER|REREVIEWER", required: true }
      - { name: keyword, type: text, required: false }
    guards: [RC-G-01, RC-G-02, RC-G-03]
    rules:
      - id: RC-ACD-05
        when: role 沒有給，或不是 REVIEWER、REREVIEWER（在角色、載入、院區範圍的檢查之後）
        outcome: { result: REJECTED, code: BAD_REQUEST }
        status: decided
        source: [{ decision: D-088 }]
      - id: RC-ACD-01
        when: 候選人不是在職
        text: selectable = false，blockedReason = CANDIDATE_INACTIVE
        outcome: { result: SUCCESS }
        status: decided
        source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }]
      - id: RC-ACD-02
        when: 這個角色的指派或改派不在分派頁的 allowedActions 裡（與 GetCaseAssignmentContext 同一份判斷，RETURNED 也一樣）
        text: selectable = false，blockedReason = INITIAL_ASSIGNMENT_NOT_ALLOWED 或 REREVIEW_ASSIGNMENT_NOT_ALLOWED
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-084 }]
      - id: RC-ACD-03
        when: 複審候選人是本案的初審醫師
        text: selectable = false，blockedReason = REREVIEWER_SAME_AS_REVIEWER
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-017 }]
      - id: RC-ACD-04
        when: 複審候選人讀過本案的完整初審
        text: selectable = false，blockedReason = REREVIEWER_HAS_READ_INITIAL（與 RC-ARR-04、RC-RRR-05 一致；查詢只讀，不寫入紀錄）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-084 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§10.3" }]
      fields:
        - { name: candidates, type: "list<AssignmentCandidate>" }

  # ---------- 稽核：生命週期與稽核軌跡（D-071） ----------
  # 帶分數的 action（D-071 第 1 點）：INITIAL_REVIEW_COMPLETED、CASE_ESCALATED_TO_REREVIEW（帶 score 時）、
  # REREVIEW_SUBMITTED、REREVIEW_REVISED、CASE_CLOSED_WITHOUT_REREVIEW。
  # D-078：ReviewSubmission 的 DRAFT_SAVED、SUBMITTED 也帶分數，以所屬案件判斷（只有稽核軌跡會回傳）。
  # 遮罩條件依案件「目前」的狀態與複審指派歷史判斷，不依事件發生時（D-071 第 2 點）。

  - name: GetCaseLifecycle
    kind: query
    summary: 查詢一個案件的稽核紀錄；帶分數的 detail 依 D-071 遮罩
    actor: { roles: [HOSPITAL_MANAGER, REVIEWER, REREVIEWER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: caseId, type: id, required: true }
    guards: [RC-G-01]
    rules:
      - id: RC-LCY-01
        when: 操作者持有 REREVIEWER 或 SYSTEM_ADMIN（不論同時持有哪些角色）
        text: 每一筆紀錄都沒有 detail
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-033 }, { decision: D-071 }]
      - id: RC-LCY-02
        when: 案件目前的狀態不是 REREVIEW_IN_PROGRESS、CLOSED、CANCELLED，或操作者是本案現任或曾經的複審醫師，或本案的複審指派歷史不完整
        text: 帶分數的 action 那幾筆沒有 detail；其他 action 的 detail 照常
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-071 }]
      - id: RC-LCY-03
        when: RC-LCY-01、RC-LCY-02 都不成立
        text: 每一筆紀錄的 detail 照常，包含帶分數的 action
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-071 }]
      - id: RC-LCY-04
        when: 讀取成功
        text: 讀取不寫入初審讀取者紀錄，也不遞增案件版本
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-071 }]
      - id: RC-LCY-05
        when: 讀取成功
        text: 每一筆紀錄的 occurredAt 是發出該事件的 use case 執行時注入的時鐘的時間，與該 use case 寫入 aggregate 的時間相同。依 occurredAt 遞增排列；同時間的紀錄依發出的順序
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-092 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§14.1" }, { decision: D-071 }]
      fields:
        - { name: entries, type: "list<AuditEntry>" }

  - name: ListAuditTrails
    kind: query
    summary: 查詢稽核軌跡（分頁）；帶分數的 detail 依 D-071 逐列遮罩
    actor: { roles: [SYSTEM_ADMIN, HOSPITAL_MANAGER, AUDITOR] }
    input:
      - { name: aggregateType, type: text,     required: false }
      - { name: aggregateId,   type: id,       required: false }
      - { name: hospitalId,    type: id,       required: false }
      - { name: eventName,     type: text,     required: false }
      - { name: from,          type: datetime, required: false }
      - { name: to,            type: datetime, required: false }
      - { name: page,          type: int,      required: false }
      - { name: size,          type: int,      required: false }
    guards: [RC-G-01]
    rules:
      - id: RC-AUD-01
        when: 操作者持有 REREVIEWER 或 SYSTEM_ADMIN（不論同時持有哪些角色）
        text: 每一筆紀錄都沒有 detail
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-033 }, { decision: D-071 }]
      - id: RC-AUD-02
        when: 某一筆是帶分數的紀錄（ReviewCase 帶分數的 action，或 ReviewSubmission 的 DRAFT_SAVED、SUBMITTED），且所屬案件符合 RC-LCY-02 的條件；ReviewSubmission 的紀錄找不到所屬案件時也算
        text: 這一筆沒有 detail；其他筆不受影響
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-071 }, { decision: D-078 }, { rule: RC-LCY-02 }]
      - id: RC-AUD-03
        when: 讀取成功
        text: 讀取不寫入初審讀取者紀錄，也不遞增案件版本
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-071 }]
      - id: RC-AUD-04
        when: 讀取成功
        text: occurredAt 與 RC-LCY-05 相同；同一支 use case 發出的多個事件 occurredAt 相同。依 occurredAt 遞減排列；同時間的紀錄依發出的相反順序
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-092 }, { rule: RC-LCY-05 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§14.2" }, { decision: D-071 }]
      fields:
        - { name: content, type: "list<AuditEntry>" }

  # ---------- 報表與儀表板（D-087）。報表不是 aggregate，查的是審查案件，所以寫在這裡 ----------

  - name: GetDashboardSummary
    kind: query
    summary: 儀表板（UI-015）的件數與比率
    actor: { roles: [HOSPITAL_MANAGER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: hospitalId, type: id,       required: false }
      - { name: projectId,  type: id,       required: false }
      - { name: from,       type: datetime, required: false }
      - { name: to,         type: datetime, required: false }
    guards: [RC-G-01]
    rules:
      - id: RC-DSH-01
        when: from、to 只給了其中一個
        outcome: { result: REJECTED, code: BAD_REQUEST }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }]
      - id: RC-DSH-02
        when: from、to 都有給，但 from 不早於 to
        outcome: { result: REJECTED, code: BAD_REQUEST }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }]
      - id: RC-DSH-03
        when: 操作者不是 SYSTEM_ADMIN
        text: 只統計院區等於操作者院區的案件；輸入的 hospitalId 不採用
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-042 }, { decision: D-087 }]
      - id: RC-DSH-04
        when: 操作者是 SYSTEM_ADMIN
        text: 統計所有院區的案件；輸入有 hospitalId 時只統計那個院區的
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-047 }, { decision: D-087 }]
      - id: RC-DSH-05
        when: 輸入有 projectId
        text: 只統計那個專案的案件；不檢查專案是否存在，沒有符合的案件時件數都是 0
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-087 }]
      - id: RC-DSH-06
        when: from、to 都有給
        text: 只統計建立時間在 from（含）到 to（不含）之間的案件；都沒有給時不依時間篩選
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }]
      - id: RC-DSH-07
        when: 任何查詢
        text: 已取消（CANCELLED）的案件不計入任何件數。totalCases 是範圍內其餘案件的數目；closedCases 是其中 status = CLOSED 的；rereviewedCases 是其中已指派複審醫師的（不代表複審已完成）
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-087 }]
      - id: RC-DSH-08
        when: 任何查詢
        text: completionRate = closedCases ÷ totalCases，rereviewRate = rereviewedCases ÷ totalCases，overdueRate = overdueCases ÷ totalCases；totalCases 是 0 時都是 0。不四捨五入
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-087 }]
      - id: RC-DSH-09
        when: 任何查詢
        text: overdueCases 是目前階段的期限早於現在的案件數。初審階段（PENDING_INITIAL_REVIEW、INITIAL_REVIEW_IN_PROGRESS）看初審期限 dueAt；複審階段（PENDING_REREVIEW、REREVIEW_IN_PROGRESS）在已指派複審醫師時看複審期限。其他狀態都不算逾期。期限等於現在不算。重開不改初審期限
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-095 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§15.1" }, { decision: D-087 }]
      fields:
        - { name: totalCases,      type: int }
        - { name: closedCases,     type: int }
        - { name: rereviewedCases, type: int }
        - { name: overdueCases,    type: int }
        - { name: completionRate,  type: decimal }
        - { name: rereviewRate,    type: decimal }
        - { name: overdueRate,     type: decimal }

  - name: ExportReport
    kind: query
    summary: 匯出統計報表：逐案資料列（分頁）與同一個範圍的摘要
    actor: { roles: [HOSPITAL_MANAGER, AUDITOR, SYSTEM_ADMIN] }
    input:
      - { name: reportType, type: text,     required: true }
      - { name: hospitalId, type: id,       required: false }
      - { name: from,       type: datetime, required: true }
      - { name: to,         type: datetime, required: true }
      - { name: page,       type: int,      required: false }
      - { name: size,       type: int,      required: false }
    guards: [RC-G-01]
    rules:
      - id: RC-RPT-01
        when: reportType 不是 REVIEW_COMPLETION
        outcome: { result: REJECTED, code: BAD_REQUEST }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }]
      - id: RC-RPT-02
        when: from 或 to 沒有給
        outcome: { result: REJECTED, code: BAD_REQUEST }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }]
      - id: RC-RPT-03
        when: from 不早於 to
        outcome: { result: REJECTED, code: BAD_REQUEST }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }]
      - id: RC-RPT-04
        when: 操作者不是 SYSTEM_ADMIN
        text: 只匯出院區等於操作者院區的案件；輸入的 hospitalId 不採用
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-042 }, { decision: D-056 }]
      - id: RC-RPT-05
        when: 操作者是 SYSTEM_ADMIN
        text: 匯出所有院區的案件；輸入有 hospitalId 時只匯出那個院區的
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-047 }, { decision: D-056 }]
      - id: RC-RPT-06
        when: 任何匯出
        text: rows 是建立時間在 from（含）到 to（不含）之間的案件，包含已取消的，依 caseId 遞增，一次一頁。size 沒有給或不是正數時是 100，最大 1000；page 從 0 開始，沒有給或是負數時是 0；輸出的 page、size 是實際使用的值。totalElements、totalPages 以整個範圍計算；超出範圍的頁，rows 是空的
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }]
      - id: RC-RPT-07
        when: 操作者是 SYSTEM_ADMIN
        text: 每一列只有 caseId、hospitalId、status、reviewerId、rereviewerId、createdAt、closedAt；沒有 projectId、initialScore、finalScore、maskedFields。RC-RPT-08～11 不適用。status 就是白名單的 caseStatus
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-036 }, { decision: D-055 }, { doc: docs/02-ddd/permission-matrix.md, section: "§5.1" }, { decision: D-100 }, { rule: RC-INV-02 }]
      - id: RC-RPT-08
        when: 某一列的案件 status 不是 REREVIEW_IN_PROGRESS、CLOSED、CANCELLED（之後還可能指派或改派複審醫師）
        text: 這一列的 initialScore、finalScore 是 null，maskedFields 列出這兩個欄位
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }]
      - id: RC-RPT-09
        when: 操作者是某一列案件目前的複審醫師，或出現在它的複審指派歷史裡（不論現在用哪個角色）
        text: 這一列的 initialScore、finalScore 是 null，maskedFields 列出這兩個欄位；結案後也不解除
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-033 }, { decision: D-055 }]
      - id: RC-RPT-10
        when: 某一列案件的複審指派歷史不完整
        text: 這一列的 initialScore、finalScore 是 null，maskedFields 列出這兩個欄位
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-035 }, { decision: D-055 }]
      - id: RC-RPT-11
        when: 某一列不符合 RC-RPT-07～10 的任何一條
        text: initialScore、finalScore 照常輸出，maskedFields 是空的清單
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }]
      - id: RC-RPT-12
        when: 任何匯出
        text: summary 是同一個院區範圍與時間區間的儀表板摘要（RC-DSH-07、RC-DSH-08、RC-DSH-09），不受分頁影響。已取消的案件在 rows 與 totalElements 裡，不在 summary 的件數裡
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-057 }, { decision: D-087 }, { rule: RC-DSH-07 }, { rule: RC-DSH-09 }]
      - id: RC-RPT-13
        when: 匯出成功
        text: 不寫入初審讀取者紀錄，不遞增案件版本，不發事件
        outcome: { result: SUCCESS }
        status: decided
        source: [{ decision: D-055 }, { decision: D-087 }]
    output:
      status: decided
      source: [{ doc: docs/03-contracts/api-spec.md, section: "§15.2" }, { decision: D-057 }]
      fields:
        - { name: reportType,    type: text }
        # 操作者是 SYSTEM_ADMIN 時每一項是 ExportRowMetadata（RC-RPT-07）。
        - { name: rows,          type: "list<ExportRow>" }
        - { name: summary,       type: DashboardSummary }
        - { name: page,          type: int }
        - { name: size,          type: int }
        - { name: totalElements, type: int }
        - { name: totalPages,    type: int }
