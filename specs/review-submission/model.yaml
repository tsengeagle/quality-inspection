# 格式說明見 ../README.md（規格格式 v2.0，第十節）。本檔是律法（spec 類），修改需要修法紀錄與簽章。
# 提交是另一個 aggregate，有自己的目錄；改變它的 use case 定義在 review-case/，by 寫成 <目錄>.<use case>。
spec_version: 2
kind: aggregate
name: ReviewSubmission
term: 審查提交

identity: { name: submissionId, type: id, assigned_by: system }

sources:
  - { doc: docs/02-ddd/state-machine.md, section: "§4" }

enums:
  - name: SubmissionStatus
    values: [DRAFT, SUBMITTED, SUPERSEDED]
    status: decided
    source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.1" }]
  - name: ReviewStage
    values: [INITIAL, REREVIEW]
    status: decided
    source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.1" }]

transitions:
  - { id: RS-T-01, from: DRAFT, to: DRAFT,     by: review-case.SaveInitialReviewDraft, status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }
  - { id: RS-T-02, from: DRAFT, to: SUBMITTED, by: review-case.SubmitInitialReview,    status: decided, source: [{ doc: docs/02-ddd/state-machine.md, section: "§4.2" }] }

deferred_transitions:
  - { from: SUBMITTED, to: SUPERSEDED, by: ReviseInitialReview, note: 修正已提交的初審；同時建立一份新的 SUBMITTED }
  - { from: DRAFT,     to: DRAFT,      by: SaveRereviewDraft,   note: 複審 }
  - { from: DRAFT,     to: SUBMITTED,  by: SubmitRereview,      note: 複審 }
  - { from: SUBMITTED, to: SUPERSEDED, by: ReviseRereview,      note: 複審 }
