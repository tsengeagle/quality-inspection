name: backend-check

# 不設 paths 篩選：之後要把這個檢查設為必要檢查，被篩掉的必要檢查會永遠停在等待中。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/quality-inspection-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v4

      # 與開發者、AI 在本機跑的是同一個指令
      - run: ./gradlew check

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/quality-inspection-service/build/reports/tests/test
            services/quality-inspection-service/build/reports/known-failures
          if-no-files-found: warn

  # 同一個閘門在 Windows 上再跑一次，用 Windows 開發者實際使用的 gradlew.bat
  check-windows:
    name: check (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/quality-inspection-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - shell: cmd
        run: gradlew.bat check
