name: backend-check

# Harness 的主要閘門（P1）：開發者、AI、CI 跑同一個指令 `./gradlew check`。
# 不設 paths 過濾：這個檢查要設為必要檢查，被過濾掉的執行會讓 PR 永遠等不到結果。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gradle check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/quality-inspection-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: gradle check
        run: ./gradlew check --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            services/quality-inspection-service/build/reports/tests/test
            services/quality-inspection-service/build/test-results/test
          if-no-files-found: warn
