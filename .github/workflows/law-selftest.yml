name: law-selftest

# 判決程式自己的測試。這裡執行的是 PR 帶來的版本，所以只給唯讀權限。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    name: law-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests of the verdict script
        run: python3 -m unittest discover -s harness-core/tests -v
      - name: The installed workflow matches the template in harness-core
        run: diff -u harness-core/ci/github/law-check.yml .github/workflows/law-check.yml

  # 同一組測試在 Windows 上再跑一次：核准者與開發者可能用 Windows
  selftest-windows:
    name: law-selftest (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests of the verdict script
        run: python -m unittest discover -s harness-core/tests -v
      - name: The verdict script runs in isolated mode and prints its report
        shell: bash
        run: |
          python -I harness-core/law_check.py --base HEAD --head HEAD
      # .gitattributes 定死換行：Windows 的 runner 預設 core.autocrlf=true，
      # 沒有它的話所有文字檔簽出後都會變成 CRLF。
      # 混用 LF 與 CRLF 的檔案也算錯：gradlew 只要第一行是 CRLF 就無法執行。
      - name: Line endings in the index and working tree follow .gitattributes
        shell: bash
        run: |
          git ls-files --eol > "$RUNNER_TEMP/eol.txt"
          eol="$RUNNER_TEMP/eol.txt"
          status=0
          # 版本庫裡不得有 CRLF 或混用
          bad=$(awk '$1 == "i/crlf" || $1 == "i/mixed" {print $NF}' "$eol")
          if [ -n "$bad" ]; then echo "版本庫裡有 CRLF 或混用換行的檔案："; echo "$bad"; status=1; fi
          # 工作目錄：.bat、.cmd 以外的文字檔不得有 CRLF 或混用
          bad=$(awk '($2 == "w/crlf" || $2 == "w/mixed") && $NF !~ /\.(bat|cmd)$/ {print $NF}' "$eol")
          if [ -n "$bad" ]; then echo "工作目錄裡有 .bat、.cmd 以外的 CRLF 或混用換行檔案："; echo "$bad"; status=1; fi
          # .bat、.cmd 必須是 CRLF
          bad=$(awk '$NF ~ /\.(bat|cmd)$/ && $2 != "w/crlf" {print $NF}' "$eol")
          if [ -n "$bad" ]; then echo "這些批次檔應該是 CRLF："; echo "$bad"; status=1; fi
          grep -q 'services/quality-inspection-service/gradlew.bat$' "$eol" || { echo "找不到 gradlew.bat，檢查範圍不對"; status=1; }
          exit $status
