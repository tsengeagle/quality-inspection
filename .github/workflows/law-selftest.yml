name: law-selftest

# 判決程式自己的測試。這裡執行的是 PR 帶來的版本，所以只給唯讀權限。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    name: law-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests of the verdict script
        run: python3 -m unittest discover -s harness-core/tests -v
      - name: The installed workflow matches the template in harness-core
        run: diff -u harness-core/ci/github/law-check.yml .github/workflows/law-check.yml

  # 同一組測試在 Windows 上再跑一次：核准者與開發者可能用 Windows
  selftest-windows:
    name: law-selftest (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests of the verdict script
        run: python -m unittest discover -s harness-core/tests -v
      - name: The verdict script runs in isolated mode and prints its report
        shell: bash
        run: |
          python -I harness-core/law_check.py --base HEAD --head HEAD
      # .gitattributes 定死換行：Windows 的 runner 預設 core.autocrlf=true，
      # 沒有它的話所有文字檔簽出後都會變成 CRLF
      - name: Line endings in the working tree follow .gitattributes
        shell: bash
        run: |
          git ls-files --eol | awk '$2 == "w/crlf"' | awk '{print $NF}' > crlf.txt
          cat crlf.txt
          if grep -qv '\.\(bat\|cmd\)$' crlf.txt; then
            echo "工作目錄裡有 .bat、.cmd 以外的 CRLF 檔案"; exit 1
          fi
          grep -qx 'services/quality-inspection-service/gradlew.bat' crlf.txt || { echo "gradlew.bat 應該是 CRLF"; exit 1; }
