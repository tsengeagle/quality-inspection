<section class="batch-list-page">
  <div class="batch-list-page-header">
    <h1 class="batch-list-title">抽選批次列表</h1>
    <p class="batch-list-summary">{{ pageSummary }}</p>
    <p class="projection-notice" *ngIf="isMetadataOnly">SYSTEM_ADMIN 僅可檢視 metadata-only 欄位。</p>
  </div>

  <app-batch-status-tab
    class="batch-list-tabs"
    [tabs]="availableTabs"
    [activeTab]="uiState.tab"
    (tabChange)="onTabChange($event)">
  </app-batch-status-tab>

  <app-batch-filter-bar
    [metadataOnly]="isMetadataOnly"
    (filterChange)="onFilterChange($event)">
  </app-batch-filter-bar>

  <app-batch-table
    [batches]="batches"
    [role]="role"
    (viewCases)="onViewCases($event)"
    (retryBatch)="openRetryConfirm($event)">
  </app-batch-table>

  <p class="helper-note">批次詳情功能規劃中；展示流程請使用「查看案件」延續操作。</p>

  <app-retry-confirm-modal
    [visible]="showRetryModal"
    [batchId]="retryTargetBatchId ?? ''"
    (confirm)="confirmRetry($event)"
    (cancel)="cancelRetry()">
  </app-retry-confirm-modal>
</section>
