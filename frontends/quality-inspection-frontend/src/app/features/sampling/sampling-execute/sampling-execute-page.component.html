<section class="sampling-execute-page">
  <div class="sampling-page-header-placeholder">
    <h1 class="sampling-page-title">抽選執行頁</h1>
    <p class="sampling-page-subtitle">projectId: {{ projectId }}</p>
  </div>

  <div class="mode-indicator-strip">{{ modeLabel }}</div>

  <app-sampling-blocked-banner
    *ngIf="mode === 'READONLY_BLOCKED'"
    [reason]="blockedReason">
  </app-sampling-blocked-banner>

  <div class="page-content" *ngIf="context">
    <app-sampling-rule-summary [ruleSnapshot]="context.ruleSummary"></app-sampling-rule-summary>

    <div class="preview-action-zone" *ngIf="mode === 'READY_FOR_PREVIEW' || mode === 'EXECUTE_FAILED'">
      <button type="button" class="preview-btn" (click)="openPreviewStub()">
        {{ mode === 'EXECUTE_FAILED' ? '重新預估' : '預估抽選人數' }}
      </button>
    </div>

    <app-sampling-preview-stats
      *ngIf="context.previewStats && (mode === 'PREVIEW_COMPLETED' || mode === 'EXECUTING' || mode === 'EXECUTE_FAILED')"
      [stats]="context.previewStats">
    </app-sampling-preview-stats>

    <div class="execute-confirm-zone" *ngIf="mode === 'PREVIEW_COMPLETED'">
      <button type="button" class="execute-btn" (click)="openExecuteConfirm()">正式執行抽選</button>
    </div>

    <div class="executing-hint" *ngIf="mode === 'EXECUTING'">抽選執行中，請稍候。</div>

    <app-sampling-post-execute-region
      *ngIf="context.postExecuteSummary && (mode === 'EXECUTE_SUCCESS' || mode === 'EXECUTE_FAILED')"
      [result]="context.postExecuteSummary">
    </app-sampling-post-execute-region>

    <div class="post-execute-actions" *ngIf="mode === 'EXECUTE_SUCCESS'">
      <button type="button" class="navigate-btn" (click)="navigateToBatchList()">前往抽選批次列表</button>
    </div>
  </div>

  <app-sampling-execute-confirm-modal
    [visible]="showConfirmModal"
    [projectId]="projectId"
    (confirmed)="onConfirmModalConfirm()"
    (cancelled)="onConfirmModalCancel()">
  </app-sampling-execute-confirm-modal>
</section>
