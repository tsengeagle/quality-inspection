<app-case-summary-header
	[caseId]="caseId"
	[caseTitle]="context.caseTitle"
	[status]="context.status"
	[stageLabel]="context.stageLabel">
</app-case-summary-header>

<app-status-or-blocked-banner
	*ngIf="showBlockedBanner"
	tone="blocked"
	[message]="bannerMessage">
</app-status-or-blocked-banner>

<app-status-or-blocked-banner
	*ngIf="showCommandFeedback"
	[tone]="commandFeedbackTone"
	[message]="commandFeedbackMessage">
</app-status-or-blocked-banner>

<app-mode-indicator-strip [modeLabel]="modeLabel"></app-mode-indicator-strip>

<app-review-form-summary-strip [mode]="modeLabel"></app-review-form-summary-strip>

<app-review-version-summary-region
	[isRevisionMode]="showVersionSummary"
	[basedOnVersion]="context.basedOnVersion">
</app-review-version-summary-region>

<section class="initial-review-shell">
	<h1 class="initial-review-title">初審作業頁</h1>

	<div *ngIf="mode === 'REVISION'" class="append-only-baseline" data-testid="initial-review-append-only-baseline">
		系統將建立新 revision，不會覆寫既有提交。
	</div>

	<div *ngIf="mode === 'READONLY_BLOCKED'" class="readonly-form-guard" data-testid="initial-review-readonly-guard">
		主作業表單已鎖定，僅保留 readonly grammar 與 placeholder 結構。
	</div>

	<section class="review-form-placeholder" data-testid="initial-review-form-placeholder">
		<h2>主作業表單</h2>
		<p>limited deep payload wiring：僅綁定既有 answer rows，不自行發明新的 score items。</p>

		<div *ngIf="formAnswers.length > 0; else initialReviewNoAnswers">
			<label *ngFor="let answer of formAnswers; let index = index" class="review-answer-row">
				<span>{{ answer.itemId }}</span>
				<input
					type="text"
					[name]="'initial-review-answer-' + index"
					[ngModel]="answer.answerValue"
					(ngModelChange)="onAnswerValueChange(index, $event)"
					[disabled]="formLocked"
					[attr.data-testid]="'initial-review-answer-input-' + index">
			</label>
		</div>

		<ng-template #initialReviewNoAnswers>
			<p data-testid="initial-review-answer-empty">目前沒有可編輯 answer rows；本輪不自行補 score item 清單。</p>
		</ng-template>
	</section>

	<section class="commentary-placeholder" data-testid="initial-review-commentary-placeholder">
		<label class="review-commentary-field">
			<span>評語</span>
			<textarea
				name="initial-review-comment"
				[ngModel]="formComment"
				(ngModelChange)="onCommentChange($event)"
				[disabled]="formLocked"
				data-testid="initial-review-comment-input"></textarea>
		</label>
	</section>

	<section class="attachment-placeholder" data-testid="initial-review-attachment-placeholder">
		attachment region placeholder：本輪仍不接 payload
	</section>
</section>

<app-review-command-bar
	*ngIf="showCommandBar"
	[primaryLabel]="commandPrimaryLabel"
	[secondaryLabel]="commandSecondaryLabel"
	[disabled]="false"
	[primaryDisabled]="commandPrimaryDisabled"
	[secondaryDisabled]="commandSecondaryDisabled"
	(primaryClick)="onPrimaryAction()"
	(secondaryClick)="onSecondaryAction()">
</app-review-command-bar>
