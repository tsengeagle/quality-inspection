# 草稿，尚未經人工審核。格式說明見 ../README.md
spec_version: 0.1-draft
kind: usecases
aggregate: ReviewProject

sources:
  - docs/01-requirements/decision-log.md D-020, D-023, D-024
  - docs/02-ddd/application-service.md §5, §5.1
  - docs/02-ddd/domain-events.md §4.1–§4.4
  - docs/03-contracts/api-spec.md §4.2, §7.1–§7.8
  - docs/04-testing/specification-by-example.md EX-018
  - docs/04-testing/test-scenarios.md TS-PV-001–TS-PV-004

# 分類給實作端決定對外的狀態碼用；規格本身不寫 HTTP。
error_codes:
  - { code: ROLE_DENIED,                     category: denied,         source: decision-log.md D-023 }
  - { code: HOSPITAL_SCOPE_MISMATCH,         category: denied,         source: decision-log.md D-024 }
  - { code: PROJECT_NOT_FOUND,               category: not_found,      source: api-spec.md }
  - { code: VALIDATION_ERROR,                category: invalid_input,  source: api-spec.md §4.2 }
  - { code: INVALID_STATE_TRANSITION,        category: conflict,       source: api-spec.md §4.2 }
  - { code: PROJECT_VERSION_NOT_PUBLISHABLE, category: rule_violation, source: api-spec.md §4.2 }

# 多支 use case 共用的前置檢查。use case 用 guards 依序引用。
# 順序依 D-024：角色 → 載入 → 院區範圍 → 領域規則。
guards:
  - id: RP-G-01
    when: 操作者不具備這支 use case 的 actor.roles 中任何一個角色
    outcome: { result: REJECTED, code: ROLE_DENIED }
    source: [decision-log.md D-023, api-spec.md §7]
    status: decided
  - id: RP-G-02
    when: projectId 找不到對應的專案
    outcome: { result: REJECTED, code: PROJECT_NOT_FOUND }
    source: api-spec.md（錯誤代碼存在；哪些 use case 適用未逐一寫明）
    status: decided
  - id: RP-G-03
    when: 操作者的院區與專案的 hospitalId 不同
    outcome: { result: REJECTED, code: HOSPITAL_SCOPE_MISMATCH }
    source: api-spec.md §4.2（說明寫「案件/專案院所不符」）
    status: proposed
    question: Q-11

usecases:

  - name: CreateReviewProject
    kind: command
    summary: 建立審查專案草稿
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: name,               type: text,                        required: true }
      - { name: description,        type: text,                        required: false, status: proposed, question: Q-05 }
      - { name: medicalRecordTypes, type: "set<enum MedicalRecordType>", required: true }
    guards: [RP-G-01]
    rules:
      - id: RP-CRT-01
        when: name 為 null 或空白
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: proposed
        question: Q-14
    success:
      output:
        - { name: projectId, type: id }
      state:
        - { id: RP-CRT-S1, text: status = DRAFT, source: test-scenarios.md TS-PV-001, status: decided }
        - { id: RP-CRT-S2, text: hospitalId = 操作者的院區（不由輸入指定）, status: proposed, question: Q-05 }
        - { id: RP-CRT-S3, text: currentVersion.versionNo = 1 且 published = false, status: proposed, question: Q-08 }
        - { id: RP-CRT-S4, text: 兩個權重都是 0.50, source: decision-log.md D-020, status: decided }
        - { id: RP-CRT-S5, text: name、description、medicalRecordTypes 等於輸入, status: decided, source: api-spec.md §7.1 }
      emits:
        - { event: ReviewProjectCreated, source: domain-events.md §4.1, status: decided }

  - name: UpdateReviewProjectDraft
    kind: command
    summary: 更新尚未發布的專案草稿
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: projectId,          type: id,                          required: true }
      - { name: name,               type: text,                        required: true }
      - { name: description,        type: text,                        required: false, status: proposed, question: Q-05 }
      - { name: medicalRecordTypes, type: "set<enum MedicalRecordType>", required: true }
    open_inputs:
      - text: qualityThreshold 與兩個權重從哪一支 use case 設定，文件沒有寫
        question: Q-10
    guards: [RP-G-01, RP-G-02, RP-G-03]
    rules:
      - id: RP-UPD-01
        when: currentVersion.published = true
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        source: [specification-by-example.md EX-018, api-spec.md §7.2, model RP-INV-01]
        status: proposed
        question: Q-07
        note: 「要拒絕」已有依據；用哪個錯誤代碼沒有（TS-PV-004 寫的是「409 或 422」）
      - id: RP-UPD-02
        when: name 為 null 或空白
        outcome: { result: REJECTED, code: VALIDATION_ERROR }
        status: proposed
        question: Q-14
    success:
      state:
        - { id: RP-UPD-S1, text: name、description、medicalRecordTypes 被輸入整組取代（不是只改有給的欄位）, status: proposed, question: Q-05 }
        - { id: RP-UPD-S2, text: status 與 currentVersion 不變, status: proposed, question: Q-07 }
      emits:
        - { event: ReviewProjectDraftUpdated, status: proposed, question: Q-13 }

  - name: PublishReviewProjectVersion
    kind: command
    summary: 把目前的草稿版本發布為正式版本
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: projectId, type: id, required: true }
    guards: [RP-G-01, RP-G-02, RP-G-03]
    rules:
      - id: RP-PUB-01
        when: currentVersion.published = true
        outcome: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
        status: proposed
        question: Q-08
      - id: RP-PUB-02
        when: 專案尚未綁定評分表
        outcome: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
        source: test-scenarios.md TS-PV-003（前置條件「綁定合法 score sheet version」）
        status: proposed
        question: Q-09
      - id: RP-PUB-03
        when: 權重不符合 RP-INV-02
        outcome: { result: REJECTED, code: PROJECT_VERSION_NOT_PUBLISHABLE }
        source: decision-log.md D-020（「publish API 時應驗證」）
        status: proposed
        question: Q-14
        note: 「發布時要驗證」已決定；錯誤代碼未定
    success:
      state:
        - { id: RP-PUB-S1, text: currentVersion.published = true, status: decided, source: domain-events.md §4.4 }
        - { id: RP-PUB-S2, text: versionNo 不變；status 不變, status: proposed, question: Q-08 }
      emits:
        - { event: ReviewProjectVersionPublished, source: domain-events.md §4.4, status: decided }

  - name: ActivateReviewProject
    kind: command
    summary: 啟用專案，使它可以用於正式抽選
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: projectId, type: id, required: true }
    guards: [RP-G-01, RP-G-02, RP-G-03]
    rules:
      - id: RP-ACT-01
        when: status = ACTIVE
        outcome: { result: SUCCESS, no_change: true }
        status: proposed
        question: Q-04
        note: domain-events.md §4.2 寫「由非啟用轉為啟用」才發 event，暗示重複啟用不發
      - id: RP-ACT-02
        when: status = DEACTIVATED
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: proposed
        question: Q-03
      - id: RP-ACT-03
        when: currentVersion.published = false
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        source: permission-matrix.md §6（抽選需要 project active + published version）
        status: proposed
        question: Q-02
    success:
      state:
        - { id: RP-ACT-S1, text: status = ACTIVE, source: domain-events.md §4.2, status: decided }
      emits:
        - { event: ReviewProjectActivated, source: domain-events.md §4.2, status: decided }

  - name: DeactivateReviewProject
    kind: command
    summary: 停用專案，不再供新的抽選批次使用
    actor: { roles: [HOSPITAL_MANAGER] }
    input:
      - { name: projectId, type: id, required: true }
    guards: [RP-G-01, RP-G-02, RP-G-03]
    rules:
      - id: RP-DEA-01
        when: status = DEACTIVATED
        outcome: { result: SUCCESS, no_change: true }
        status: proposed
        question: Q-04
      - id: RP-DEA-02
        when: status = DRAFT
        outcome: { result: REJECTED, code: INVALID_STATE_TRANSITION }
        status: proposed
        question: Q-03
    success:
      state:
        - { id: RP-DEA-S1, text: status = DEACTIVATED, source: domain-events.md §4.3, status: proposed, question: Q-01 }
      emits:
        - { event: ReviewProjectDeactivated, source: domain-events.md §4.3, status: decided }

  - name: GetReviewProjectDetail
    kind: query
    summary: 查詢單一專案與它目前的版本
    actor:
      roles: [SYSTEM_ADMIN, HOSPITAL_MANAGER, AUDITOR]
      open:
        - text: api-spec.md §7.7 寫 REVIEWER / REREVIEWER「僅限唯讀必要範圍」，沒有定義範圍
          question: Q-12
    input:
      - { name: projectId, type: id, required: true }
    guards: [RP-G-01, RP-G-02, RP-G-03]
    guard_exceptions:
      - text: SYSTEM_ADMIN 是否不受 RP-G-03 限制
        question: Q-12
    output:
      status: proposed
      question: Q-12
      fields:
        - { name: projectId,          type: id }
        - { name: hospitalId,         type: ref Hospital }
        - { name: name,               type: text }
        - { name: description,        type: text }
        - { name: medicalRecordTypes, type: "set<enum MedicalRecordType>" }
        - { name: status,             type: enum ProjectStatus }
        - { name: versionNo,          type: int }
        - { name: versionPublished,   type: boolean }
        - { name: qualityThreshold,   type: decimal(2) }
        - { name: initialReviewWeight, type: decimal(2) }
        - { name: rereviewWeight,     type: decimal(2) }
