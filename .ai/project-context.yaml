project:
  system: 品質審查系統
  repo_name: quality-inspection
  module_name: solution
  role: solution-architecture
  description: >
    品質審查系統的 solution-level authoritative project context。
    本檔為 repository 內第一優先的 project authority context，
    收斂目前已確認的 docs authority、implementation area 規劃、
    核心業務語意、bounded contexts、以及 assumptions / pending confirmations。
  criticality: high
  legacy: false

organization:
  architecture_style:
    - solution-level
    - document-driven
    - ddd-oriented
  repo_scope: single-solution-repository
  cross_repo_assumption: forbidden

repository:
  authority_root: docs
  operating_guide: AGENTS.md
  implementation_areas:
    backend:
      path: services/quality-inspection-service
      status: confirmed
      role: backend-implementation-area
    frontend:
      path: frontends/quality-inspection-frontend
      status: confirmed
      role: frontend-implementation-area

docs_authority:
  root: docs
  structure:
    requirements:
      path: docs/01-requirements
      files:
        - 0_品質審查系統規格草案.md
        - decision-log.md
        - glossary.md
      role: requirements-and-decision-authority

    ddd:
      path: docs/02-ddd
      files:
        - application-service.md
        - context-map.md
        - domain-events.md
        - domain-model.md
        - permission-matrix.md
        - state-machine.md
      role: domain-and-application-design-authority

    contracts:
      path: docs/03-contracts
      files:
        - api-spec.md
        - persistence-model.md
      role: api-and-persistence-contract-authority

    testing:
      path: docs/04-testing
      files:
        - example-to-test-case-skeleton.md
        - example-to-test-level-matrix.md
        - specification-by-example.md
        - test-scenario-template-and-guidelines.md
        - test-scenarios.md
      role: testing-authority

    ui:
      path: docs/05-ui
      files:
        - ui-information-architecture.md
        - ui-page-inventory.md
        - ui-page-spec-ui006抽選執行頁.md
        - ui-page-spec-ui007抽選批次列表頁.md
        - ui-page-spec-ui009案件列表頁.md
        - ui-page-spec-ui010案件詳情頁.md
        - ui-page-spec-ui011案件分派頁.md
        - ui-page-spec-ui012初審作業頁.md
        - ui-page-spec-ui013複審作業頁.md
        - ui-page-spec-ui014revision歷程頁.md
      role: ui-and-page-spec-authority

    archive:
      path: docs/99-archive
      files:
        - aggregate-design-notes-v1.md
      role: historical-reference-only
      authority: false

document_precedence:
  - docs/01-requirements/decision-log.md
  - docs/01-requirements/0_品質審查系統規格草案.md
  - docs/01-requirements/glossary.md
  - docs/02-ddd/*
  - docs/03-contracts/*
  - docs/04-testing/*
  - docs/05-ui/*
  - docs/99-archive/*

business_domain:
  core_capabilities:
    - 審查專案管理
    - 評分表版本管理
    - 抽選執行
    - 抽選批次管理
    - 案件管理
    - 案件分派
    - 初審作業
    - 複審作業
    - revision 歷程追蹤
    - 權限與可見性控制
    - API 契約
    - persistence 設計
    - 測試情境設計
    - 稽核與報表

  core_domain_concepts:
    - ReviewProject
    - ScoreSheetDefinition
    - SamplingBatch
    - ReviewCase
    - ReviewSubmission
    - RuleSnapshot
    - Revision

  bounded_contexts:
    - name: Review Project Configuration
      role: 專案設定、規則、生效與版本
    - name: Sampling
      role: 一次抽選執行、規則快照、抽選結果與重跑關聯
    - name: Assignment and Review
      role: 案件生命週期、初審、複審、revision
    - name: Audit and Reporting
      role: 查詢、統計、報表、稽核與歷程投影

  supporting_contexts:
    - Medical Record Source
    - Identity and Access
    - Notification

architecture:
  style:
    - solution-level
    - layered-per-implementation-area
    - document-driven
  backend:
    module_root: services/quality-inspection-service
    status: planned-path-confirmed
    source_tree_status: confirmed
    language: Java
    framework: Spring Boot
    build_tool: Gradle
    build_dsl: Groovy DSL
    tech_stack_status: confirmed
    integration_baseline: must integrate with organization existing api-gateway
    skeleton:
      build_file: build.gradle
      settings_file: settings.gradle
      gradle_wrapper: gradle/wrapper/gradle-wrapper.properties
      application_entry: src/main/java/com/tzuchi/his/quality/inspection/QualityInspectionApplication.java
      application_config: src/main/resources/application.yml
      test_entry: src/test/java/com/tzuchi/his/quality/inspection/QualityInspectionApplicationTests.java
      layers: [domain, application, interfaces, infrastructure, reporting]
      package_root: com.tzuchi.his.quality.inspection
    commands:
      build: "./gradlew build"
      test: "./gradlew test"
      run: "./gradlew bootRun"
  frontend:
    module_root: frontends/quality-inspection-frontend
    status: planned-path-confirmed
    source_tree_status: confirmed
    framework: Angular
    baseline_version: Angular 14
    architecture_style: microfrontend
    package_manager: npm
    build_dev_tool: Angular CLI
    state_management: NgRx
    unit_test_baseline: Karma + Jasmine
    e2e_test_baseline: Playwright
    module_federation_reference: "@angular-architects/module-federation"
    tech_stack_status: confirmed
    integration_baseline: must integrate with organization existing MFE shell
    skeleton:
      package_json: package.json
      angular_json: angular.json
      tsconfig: tsconfig.json
      proxy_config: proxy.conf.json
      webpack_config: webpack.config.js
      karma_config: karma.conf.js
      playwright_config: playwright.config.ts
      app_module: src/app/app.module.ts
      app_component: src/app/app.component.ts
      environments: [src/environments/environment.ts, src/environments/environment.prod.ts]
      modules: [core, shared, features, shell]
      e2e_root: e2e/src
    commands:
      install: "npm install"
      start: "npm start"
      start_standalone: "npm run start:standalone"
      build: "npm run build"
      test: "npm test"
      e2e: "npm run e2e"
  microfrontend:
    status: confirmed
    basis: user confirmed Angular microfrontend architecture
  ui_governance:
    status: partial
    authority:
      - docs/05-ui/ui-information-architecture.md
      - docs/05-ui/ui-page-inventory.md
      - docs/05-ui/ui-page-spec-*.md
    organization_ui_style: must align with organization existing UI style
    shared_ui_library:
      name: portal51-lib
      version: "0.0.16"
      role: shared UI library baseline and wrapper/style priority reference
      status: confirmed
    note: >
      UI authority 已存在。frontend 必須參考組織內既有 UI 風格。
      portal51-lib@0.0.16 已確認為 shared UI library baseline 與 wrapper/style 優先參考來源。
      component-level 使用細節（具體 wrapper pattern、design token mechanism）
      仍為 pending confirmation。若需要更精準落地，可向使用者索取既有 UI component 範例檔案。
  development_mode:
    formal_topology:
      frontend: Angular microfrontend -> organization existing MFE shell
      backend: Java Spring Boot service -> organization existing API Gateway
      note: 正式拓樸不因開發便利而改變。
    api_baseline:
      formal_base_path: "/api/quality-inspection/**"
      required_auth_header: api-key
      note: >
        正式 API 經由 organization existing API Gateway 提供，
        base path 為 /api/quality-inspection/**，必須攜帶 api-key header。
    shell_baseline:
      shell_provides: login and user context
      note: >
        organization existing MFE shell 負責完成登入並提供 user context。
        frontend 在 standalone mode 需自行模擬 user context。
    layered_substitute_strategy:
      principle: >
        開發期若正式 shell / gateway / upstream services 尚未齊備，
        採用分層替身策略：正式 contract 與 integration boundary 不變，
        以可控替身模擬缺的那一層，替身僅限 development / non-production。
      gateway_layer_substitute:
        method: local dev proxy
        rule: >
          frontend 仍使用正式 gateway-style API path（/api/quality-inspection/**），
          不得寫死 backend service 直連 URL。
          proxy 須至少模擬必要 auth header（api-key）。
          proxy 僅作 development substitute，不得寫成正式 topology。
      shell_layer_substitute:
        method: standalone mode
        rule: >
          frontend 同時考慮 standalone mode 與 future MFE integrated mode。
          standalone mode 是開發期替身，不代表正式架構不是 MFE。
          standalone mode 需自行模擬 shell 原本提供的 user context。
      upstream_service_substitute:
        method: adapter-level stub / mock provider
        rule: >
          interface / adapter boundary 保持不變，production 與 dev stub 分離。
          不得把 stub 行為寫成正式業務真相。
    modes:
      - name: backend-only mode
        purpose: 後端先行開發 domain / application / API / persistence / tests
        topology: test client -> local quality-inspection-service
      - name: frontend standalone mode
        purpose: 前端先行開發 page flow / UI state / API integration
        topology: Browser -> Angular standalone app -> local dev proxy -> local quality-inspection-service
      - name: integrated mode
        purpose: 驗證 MFE shell + API Gateway + backend service 的正式整合
        topology: Browser -> organization MFE shell -> API Gateway -> quality-inspection-service

