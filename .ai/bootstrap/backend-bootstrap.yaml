project:
  system: 品質審查系統
  repo_name: quality-inspection-solution
  module_name: quality-inspection-service
  role: backend-implementation
  description: >
    品質審查系統 backend implementation area bootstrap。
    本模組預期承接 domain、application、API、persistence、authorization、audit 與 reporting query support。
  criticality: high
  legacy: false

organization:
  architecture_style:
    - layered-backend
    - document-driven
    - ddd-oriented
  repo_scope: monorepo-backend-area
  cross_repo_assumption: forbidden

module_structure:
  module_root: services/quality-inspection-service
  readme: services/quality-inspection-service/README.md
  source_status: pending_confirmation
  expected_layers:
    - interfaces
    - application
    - domain
    - infrastructure
    - reporting

solution_authority:
  docs_root: 品質審查系統/docs
  requirements_root: 品質審查系統/docs/01-requirements
  ddd_root: 品質審查系統/docs/02-ddd
  contracts_root: 品質審查系統/docs/03-contracts
  testing_root: 品質審查系統/docs/04-testing
  ui_root: 品質審查系統/docs/05-ui
  archive_root: 品質審查系統/docs/99-archive

requirements_authority:
  primary_spec: 品質審查系統/docs/01-requirements/0_品質審查系統規格草案.md
  decision_log: 品質審查系統/docs/01-requirements/decision-log.md
  glossary: 品質審查系統/docs/01-requirements/glossary.md

ddd_authority:
  context_map: 品質審查系統/docs/02-ddd/context-map.md
  domain_model: 品質審查系統/docs/02-ddd/domain-model.md
  state_machine: 品質審查系統/docs/02-ddd/state-machine.md
  permission_matrix: 品質審查系統/docs/02-ddd/permission-matrix.md
  domain_events: 品質審查系統/docs/02-ddd/domain-events.md
  application_service: 品質審查系統/docs/02-ddd/application-service.md

contract_authority:
  api_spec: 品質審查系統/docs/03-contracts/api-spec.md
  persistence_model: 品質審查系統/docs/03-contracts/persistence-model.md

testing_authority:
  specification_by_example: 品質審查系統/docs/04-testing/specification-by-example.md
  test_scenarios: 品質審查系統/docs/04-testing/test-scenarios.md
  example_to_test_case_skeleton: 品質審查系統/docs/04-testing/example-to-test-case-skeleton.md
  example_to_test_level_matrix: 品質審查系統/docs/04-testing/example-to-test-level-matrix.md
  test_scenario_template_and_guidelines: 品質審查系統/docs/04-testing/test-scenario-template-and-guidelines.md

ui_reference:
  information_architecture: 品質審查系統/docs/05-ui/ui-information-architecture.md
  page_inventory: 品質審查系統/docs/05-ui/ui-page-inventory.md
  note: >
    UI 文件可作 backend query shape、command timing、頁面互動語意參考，
    但不是 backend domain / contract 的第一 authority。

archive_policy:
  archive_is_authority: false
  archive_root: 品質審查系統/docs/99-archive
  note: >
    archive 僅供歷史參考，不作現行 backend implementation authority。
    若 archive 與 requirements / ddd / contracts 衝突，現行文件優先。

business_scope:
  core_capabilities:
    - 審查專案管理
    - 評分表版本管理
    - 抽選執行
    - 抽選批次管理
    - 案件管理
    - 案件分派
    - 初審提交
    - 複審提交
    - revision append-only 管理
    - 權限與可見性 enforcement
    - API contract 落地
    - persistence contract 落地
    - audit 與 traceability
    - reporting query support
  core_domain_concepts:
    - ReviewProject
    - ScoreSheetDefinition
    - SamplingBatch
    - ReviewCase
    - ReviewSubmission
  bounded_contexts:
    - Review Project Configuration
    - Sampling
    - Assignment and Review
    - Audit and Reporting

backend_responsibilities:
  must_implement:
    - domain_invariants
    - state_transition_guards
    - application_orchestration
    - authorization_and_scope_enforcement
    - api_contract_implementation
    - persistence_model_mapping
    - audit_trail_support
    - traceability_support
  must_not_replace_authority:
    - requirements_authority
    - decision_log
    - glossary
    - ddd_documents
    - api_spec
    - ui_page_spec
  anti_patterns:
    - controller_redefines_domain_rules
    - repository_hides_business_decisions
    - database_trigger_replaces_state_machine
    - ui_behavior_becomes_domain_truth

expected_code_placement:
  interfaces:
    purpose:
      - controller
      - request_response_dto
      - error_mapping
      - authorization_entry
  application:
    purpose:
      - use_case_orchestration
      - command_handler
      - transaction_boundary
      - audit_outbox_publish
  domain:
    purpose:
      - aggregate
      - entity
      - value_object
      - policy
      - domain_service_if_needed
  infrastructure:
    purpose:
      - repository_implementation
      - persistence_mapping
      - external_adapter
      - configuration
      - migration
  reporting:
    purpose:
      - read_model
      - query_projection
      - reporting_support

working_conventions:
  document_precedence:
    - decision-log
    - primary-spec
    - glossary
    - ddd-documents
    - contracts
    - testing
    - ui-reference
    - archive
  placement_rules:
    - domain_rules_go_to_domain
    - orchestration_goes_to_application
    - http_mapping_goes_to_interfaces
    - persistence_and_external_integration_go_to_infrastructure
    - query_projection_goes_to_reporting
  cannot_claim_verified_without_evidence: true
  archive_is_not_authority: true
  no_incidental_refactor: true

ai_governance:
  pilot_scope: backend-bootstrap
  use_shared_rules: true
  workflows:
    - init
    - continue
    - implement-change
    - fix-bug
    - review-code
  commit_protocol: pending_confirmation
  required_output:
    - authority-source-summary
    - backend-placement-decision
    - assumptions-and-pending-confirmation
    - minimal-change-summary
    - validation-summary

assumptions_and_pending_confirmation:
  - id: BB-001
    category: source_tree
    item: actual backend source root under module
    status: pending_confirmation
    basis: module path 已確認，但 src/main/src/test 等實際樹尚未提供
    action_required: 待 backend implementation skeleton 建立後確認

  - id: BB-002
    category: tech_stack
    item: backend language
    status: pending_confirmation
    basis: 尚未看到 source files 或 build files
    action_required: 待 source 或 build files 出現後確認

  - id: BB-003
    category: tech_stack
    item: backend framework
    status: pending_confirmation
    basis: 尚未看到 framework evidence
    action_required: 待 source 或 build files 出現後確認

  - id: BB-004
    category: build_tool
    item: build tool
    status: pending_confirmation
    basis: 尚未看到 gradle/maven 或其他 build files
    action_required: 待工程骨架建立後確認

  - id: BB-005
    category: test_tooling
    item: test runner and test layout
    status: pending_confirmation
    basis: testing authority 已存在，但 backend test tooling 尚未有工程 evidence
    action_required: 待 test skeleton 建立後確認

  - id: BB-006
    category: gate_inventory
    item: lint / formatter / static analysis / ci entrypoints
    status: pending_confirmation
    basis: 尚未提供任何 backend gate 入口 evidence
    action_required: 待工程骨架建立後盤點

  - id: BB-007
    category: persistence
    item: actual database / migration tooling
    status: pending_confirmation
    basis: persistence model 文件已存在，但實際 DB tech 與 migration tool 尚未驗證
    action_required: 待 infrastructure skeleton 建立後確認

  - id: BB-008
    category: reporting
    item: reporting read model implementation strategy
    status: pending_confirmation
    basis: reporting context 已在 DDD 中定義，但實作方式尚未落檔
    action_required: 待 reporting module skeleton 或 query implementation 策略確認後補齊

  - id: BB-009
    category: repo_identity
    item: exact repository name
    status: assumption
    basis: 目前 solution 名稱已知，但正式 repo name 未見 evidence
    action_required: 以實際 repository name 覆蓋 quality-inspection-solution