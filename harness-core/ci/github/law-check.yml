name: law-check

# 修法檢查（P6、P4）。這份檔案是 harness-core/ci/github/law-check.yml 的副本，兩者必須相同；
# law-selftest 會檢查。說明見 harness-core/README.md。
#
# 為什麼用 pull_request_target：它執行 base 分支上的 workflow，PR 改不了這份檔案。
# 判決程式也取自 base：用 git show 從 base 的 commit 抽出來，放到工作目錄之外再執行。
# 工作目錄裡是 PR 的檔案，這個 job 只用 git 讀它們，不執行其中任何程式。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  amendment:
    name: law-check
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # fetch-depth: 0 會一併取得所有分支的歷史，base 的 commit 也在裡面
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the verdict script from the base commit
        run: |
          if ! git show "${BASE_SHA}:harness-core/law_check.py" > "${RUNNER_TEMP}/law-check.py"; then
            echo "修法檢查：無法評估 — base（${BASE_SHA}）上沒有 harness-core/law_check.py。無法評估不算通過。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

      - name: law-check
        run: |
          python3 -I "${RUNNER_TEMP}/law-check.py" --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # 後援：合併進 main 之後，用合併前的判決程式再檢查一次這次帶進來的律法修改。
  # 只能事後發現，不能事前阻擋。
  post-merge:
    name: law-check (post-merge)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BEFORE_SHA: ${{ github.event.before }}
      AFTER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Take the verdict script from the commit before the push
        run: |
          if ! git show "${BEFORE_SHA}:harness-core/law_check.py" > "${RUNNER_TEMP}/law-check.py"; then
            echo "修法檢查：無法評估 — 推送前的 commit（${BEFORE_SHA}）上沒有 harness-core/law_check.py。無法評估不算通過。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

      - name: law-check
        run: |
          python3 -I "${RUNNER_TEMP}/law-check.py" --base "$BEFORE_SHA" --head "$AFTER_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
