# Test profile: each Spring context gets its own empty in-memory database.
# The local demo data seed (@Profile("local")) is not loaded.
spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  # D-045 Flyway rollout, step 1: Flyway is on the classpath but disabled for tests, so the
  # Oracle-syntax migrations added in step 2 never run on this plain-H2 database. Step 3 switches
  # this profile to H2 Oracle mode, the Oracle dialect, Flyway on and ddl-auto=validate together.
  flyway:
    enabled: false
