# ArchUnit 凍結基線的設定。
# 基線放在 archunit_store/，記錄各規則在凍結當下的既有違規；只擋新增的違規。
# 平常不允許建立或改寫基線：違規修掉後基線必須跟著縮短，否則測試失敗。
# 更新基線：./gradlew test -PupdateArchBaseline（只會移除已修掉的違規，或為新規則建立基線）
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
