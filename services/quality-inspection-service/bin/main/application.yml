server:
  port: 8080
  servlet:
    context-path: /api/quality-inspection

spring:
  application:
    name: quality-inspection-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      # D-037: case updatedAt is a UTC instant in a TIMESTAMP column without a time zone. Hibernate 5
      # converts JDBC timestamps with the JVM default zone unless told otherwise, so a node in
      # Asia/Taipei would store 10:00Z as 18:00 and a UTC node would read it back as 18:00Z.
      # LocalDateTime columns are converted the same way and round-trip unchanged on every node.
      hibernate.jdbc.time_zone: UTC

quality-inspection:
  hospital-id: ${QUALITY_INSPECTION_HOSPITAL_ID:}

---
# Local development profile
spring:
  config:
    activate:
      on-profile: local
  # D-045: production is Oracle 19c+. Locally H2 runs in Oracle compatibility mode with the Oracle
  # dialect, and Flyway (db/migration) builds the schema; Hibernate does not create or alter tables.
  datasource:
    url: jdbc:h2:mem:quality-inspection;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: none
    show-sql: true

# NOTE: In production, this service sits behind the organization existing API Gateway.
# The API Gateway enforces auth via api-key header.
# In local development mode, direct calls or a local dev proxy may be used
# as a gateway-layer substitute. See AGENTS.md §9.4 for layered substitute strategy.
