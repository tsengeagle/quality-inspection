plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.tzuchi.his.quality'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

// 原始碼一律是 UTF-8。不指定的話，JDK 17 在 Windows 會用系統編碼編譯，
// 中文字串（包含架構規則的描述，它是凍結基線的索引鍵）會被讀錯。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 驗收範例的執行器依參數名稱把規格的輸入對到 use case 的 execute 參數（不維護對照表），
    // 所以位元組碼要保留參數名稱。
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // D-045：正式資料庫為 Oracle 19c 以上，schema 由 Flyway 管理。版本跟隨 Spring Boot 2.7.18 的 BOM（8.5.13），
    // 免費版支援 Oracle 12.2 以上；Flyway 10 以上需要 Java 17。
    implementation 'org.flywaydb:flyway-core'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

// 已知失敗清單（凍結基線）：實際失敗的測試必須與 known-test-failures.txt 完全相同。
// 新增的失敗、清單上的測試不再失敗（通過或被跳過）、清單上的測試沒有執行，都算未通過。
def knownFailuresFile = file('known-test-failures.txt')

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'

    // ArchUnit 凍結基線平常唯讀（見 src/test/resources/archunit.properties）
    if (project.hasProperty('updateArchBaseline')) {
        systemProperty 'archunit.freeze.store.default.allowStoreCreation', 'true'
        systemProperty 'archunit.freeze.store.default.allowStoreUpdate', 'true'
    }

    inputs.file(knownFailuresFile)
    // ARCH-04 直接讀原始碼。不宣告的話，位元組碼沒變的修改（例如多一個 import）不會讓 test 重跑。
    inputs.dir('src/main/java').withPropertyName('arch04MainSources')
    inputs.dir('src/test/java').withPropertyName('arch04SampleSources')
    // 驗收範例（第 4 期）讀 repo 根目錄的規格。不宣告的話，只改規格不會讓 test 重跑。
    inputs.dir('../../specs').withPropertyName('acceptanceSpecs')
    // HTTP 契約（D-061）：試做中的契約放在 spec-draft/，只列出、不擋；改了也要讓 test 重跑。
    inputs.dir('../../spec-draft').withPropertyName('httpContractDrafts')
    ignoreFailures = true

    // HTTP 契約（D-061）：測試 JVM 結束時，acceptance/http/ 的觀察器把報告寫到這裡，第一行是本次的執行識別碼。
    // 識別碼不是 test 的輸入（不影響 up-to-date 判斷），在 doFirst 才交給測試 JVM。
    def httpContractReport = layout.buildDirectory.file('reports/http-contract/report.txt').get().asFile
    def httpContractRunId = UUID.randomUUID().toString()
    doFirst {
        def full = filter.includePatterns.isEmpty() && filter.commandLineIncludePatterns.isEmpty()
        systemProperty 'http.contract.runId', httpContractRunId
        systemProperty 'http.contract.fullRun', full.toString()
        systemProperty 'http.contract.report', httpContractReport.absolutePath
    }

    def executed = new TreeSet<String>()
    def failed = new TreeMap<String, Integer>()   // 方法 -> 失敗的呼叫次數
    def skipped = new TreeSet<String>()
    def badNames = new TreeSet<String>()           // 含空白的動態測試名稱
    def suiteErrors = new TreeSet<String>()        // 測試套件本身的錯誤（不是其中某個測試失敗）

    // 測試用的 JVM 崩潰（例如 OutOfMemoryError）、@BeforeAll 失敗等，屬於套件層級的錯誤，afterTest 看不到，
    // 之後的測試也不會執行。只核對 afterTest 的結果，閘門會把「沒有評估完」當成通過。
    afterSuite { desc, result ->
        if (!result.exceptions.isEmpty()) {
            suiteErrors << "${desc.displayName}：${result.exceptions.collect { it.toString() }.join('；')}".toString()
        }
    }

    afterTest { desc, result ->
        // 動態測試（@TestFactory，例如驗收範例）的名稱是「方法()[序號]」，序號會隨範例增減而變，
        // 所以改用顯示名稱當身分，一個範例一筆。參數化測試的每次呼叫則歸到同一個方法。
        // 顯示名稱不做任何改寫：改寫會讓兩個不同的範例變成同一筆（例如空白換成底線）。
        // 清單一行一個身分、以空白分隔次數，所以含空白的顯示名稱直接判為閘門錯誤。
        def dynamic = desc.name ==~ /^[^(\s]+\(\)\[\d+\]$/
        if (dynamic && desc.displayName =~ /\s/) {
            badNames << "${desc.className}#${desc.displayName}".toString()
        }
        def method = dynamic ? desc.displayName : desc.name.replaceAll(/[(\[].*$/, '')
        def id = "${desc.className}#${method}".toString()
        executed << id
        if (result.resultType == TestResult.ResultType.FAILURE) {
            failed[id] = (failed[id] ?: 0) + 1
        } else if (result.resultType == TestResult.ResultType.SKIPPED) {
            skipped << id
        }
    }

    doLast {
        def known = new TreeMap<String, Integer>()
        knownFailuresFile.readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') }.each {
            def m = it =~ /^(\S+)(?:\s+x(\d+))?$/
            if (!m.matches()) {
                throw new GradleException("${knownFailuresFile.name} 格式錯誤：${it}")
            }
            known[m.group(1)] = (m.group(2) ?: '1') as Integer
        }
        def fullRun = filter.includePatterns.isEmpty() && filter.commandLineIncludePatterns.isEmpty()

        def format = { id, n -> n > 1 ? "${id} x${n}" : id }
        def unexpected = failed.findAll { id, n -> !known.containsKey(id) }.collect(format)
        def countChanged = failed.findAll { id, n -> known.containsKey(id) && known[id] != n }
                .collect { id, n -> "${id}（清單 ${known[id]} 次，實際 ${n} 次）" }
        def noLongerFailing = known.keySet().findAll { it in executed && !failed.containsKey(it) }
        def notExecuted = fullRun ? known.keySet() - executed : []

        def actualFile = layout.buildDirectory.file('reports/known-failures/actual-failures.txt').get().asFile
        actualFile.parentFile.mkdirs()
        actualFile.setText(failed.collect(format).join('\n') + (failed ? '\n' : ''), 'UTF-8')

        logger.lifecycle("測試閘門：執行 ${executed.size()} 個測試方法，其中失敗 ${failed.size()}（清單 ${known.size()}），跳過 ${skipped.size()}" +
                (fullRun ? '' : '；本次有篩選條件，只核對有執行的測試'))

        def problems = []
        if (badNames) {
            problems << "動態測試的名稱不能有空白，否則無法在清單裡唯一識別（${badNames.size()}）：\n  " + badNames.join('\n  ')
        }
        if (suiteErrors) {
            problems << "測試套件層級的錯誤，其後的測試可能沒有執行，閘門無法完整評估（${suiteErrors.size()}）：\n  " + suiteErrors.join('\n  ')
        }
        if (fullRun && executed.isEmpty()) {
            problems << '沒有執行任何測試'
        }
        if (unexpected) {
            problems << "不在清單上的失敗（${unexpected.size()}）：\n  " + unexpected.join('\n  ')
        }
        if (countChanged) {
            problems << "失敗的呼叫次數與清單不同（${countChanged.size()}）：\n  " + countChanged.join('\n  ')
        }
        if (noLongerFailing) {
            problems << "清單上的測試不再失敗，通過者請從清單移除，被跳過者請恢復執行（${noLongerFailing.size()}）：\n  " + noLongerFailing.join('\n  ')
        }
        if (notExecuted) {
            problems << "清單上的測試沒有執行，可能已改名或刪除（${notExecuted.size()}）：\n  " + notExecuted.join('\n  ')
        }

        // HTTP 契約（D-061）：specs/ 的契約有任何問題就未通過。報告必須是本次執行產生的：
        // 觀察器被關掉、或只留下上一次的報告，完整執行時都算未通過。有篩選條件時只判每一筆回應，涵蓋不判。
        def contractText = httpContractReport.exists() ? httpContractReport.getText('UTF-8') : ''
        if (!contractText.startsWith("run-id: ${httpContractRunId}\n")) {
            if (fullRun) {
                problems << "HTTP 契約報告不存在，或不是本次執行產生的（${httpContractReport}）：觀察器沒有運作，契約沒有被評估"
            }
        } else {
            def enforced = contractText =~ /(?m)^enforced-problems: (\d+)$/
            if (!enforced.find()) {
                problems << "HTTP 契約報告的格式不對（${httpContractReport}），契約沒有被評估"
            } else if ((enforced.group(1) as Integer) > 0) {
                def blocked = contractText.readLines().collect { it.trim() }.findAll { it.startsWith('[擋] ') }.collect { it.substring(4) }
                problems << "HTTP 契約（specs/）不符（${enforced.group(1)}）：\n  " + blocked.join('\n  ') + "\n  報告：${httpContractReport}"
            }
        }
        if (problems) {
            throw new GradleException("測試閘門未通過（${knownFailuresFile.name}、HTTP 契約）。\n" + problems.join('\n') +
                    "\n本次實際失敗的清單：${actualFile}")
        }
    }
}

// 沒有測試原始碼時，test 的 doLast 不會執行，清單與架構規則都沒有被評估。沒有評估不能算通過。
// Gradle 對這種情況有兩種回報：NO-SOURCE；或是在清掉上一次的輸出後回報「已執行但沒有做事」。兩種都要擋。
tasks.register('verifyTestsExecuted') {
    mustRunAfter 'test'
    doLast {
        def state = tasks.test.state
        def inGraph = gradle.taskGraph.hasTask(tasks.test)
        if (inGraph && state.failure == null && (state.noSource || (!state.didWork && !state.upToDate))) {
            throw new GradleException('test 沒有執行任何測試（沒有測試原始碼），閘門沒有被評估')
        }
    }
}

tasks.named('test') {
    finalizedBy 'verifyTestsExecuted'
}

tasks.named('check') {
    dependsOn 'verifyTestsExecuted'
}
