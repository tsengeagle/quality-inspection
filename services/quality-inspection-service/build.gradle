plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.tzuchi.his.quality'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

// ---------------------------------------------------------------------------
// Harness gate (P1). 說明見 harness/README.md。
//
// `test` 不因個別測試失敗而中止；改由 `verifyTestBaseline` 判決：
// 實際失敗的集合必須與 harness/known-test-failures.txt 完全相同。
// 判決路徑上只有這段確定性的程式。
// ---------------------------------------------------------------------------

def knownTestFailuresFile = file('harness/known-test-failures.txt')
def strictGate = System.getenv('CI') != null || project.hasProperty('harnessStrict')

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'

    // ArchUnit 凍結基線：CI 上不允許改寫基線檔，基線必須與程式現況一致。
    if (strictGate) {
        systemProperty 'archunit.freeze.store.default.allowStoreUpdate', 'false'
    }
    // 重建基線是修法行為，必須明確指定：./gradlew test -PharnessRefreeze
    if (project.hasProperty('harnessRefreeze')) {
        systemProperty 'archunit.freeze.store.default.allowStoreCreation', 'true'
        systemProperty 'archunit.freeze.refreeze', 'true'
    }

    ignoreFailures = true
    finalizedBy 'verifyTestBaseline'
}

tasks.register('verifyTestBaseline') {
    group = 'verification'
    description = 'Fails unless the set of failing tests equals harness/known-test-failures.txt.'

    def resultsDir = layout.buildDirectory.dir('test-results/test')
    def partialRun = provider { !tasks.test.filter.commandLineIncludePatterns.isEmpty() }

    // test 本身沒跑完（例如依賴抓不到）時，結果檔是上一次留下的，不能拿來判決。
    onlyIf { tasks.test.state.failure == null }

    doLast {
        def key = { String cls, String name -> "${cls}#${name}".toString() }

        // 已知失敗清單：一行一筆 `類別#測試名稱`，`|` 之後是出處。重複的名稱就列多次。
        def expected = [:].withDefault { 0 }
        knownTestFailuresFile.eachLine('UTF-8') { line ->
            def entry = line.split('\\|')[0].trim()
            if (entry && !entry.startsWith('//')) {
                expected[entry] += 1
            }
        }

        def xmlFiles = resultsDir.get().asFile.listFiles({ f -> f.name.endsWith('.xml') } as FileFilter) ?: []
        def actual = [:].withDefault { 0 }
        int total = 0
        def skipped = []
        xmlFiles.each { f ->
            def suite = new groovy.xml.XmlSlurper().parse(f)
            suite.testcase.each { tc ->
                total++
                def id = key(tc.@classname.text(), tc.@name.text())
                if (tc.failure.size() > 0 || tc.error.size() > 0) {
                    actual[id] += 1
                } else if (tc.skipped.size() > 0) {
                    skipped << id
                }
            }
        }

        def unexpected = []
        def fixed = []
        (expected.keySet() + actual.keySet()).each { id ->
            int diff = actual[id] - expected[id]
            if (diff > 0) {
                diff.times { unexpected << id }
            } else if (diff < 0) {
                (-diff).times { fixed << id }
            }
        }

        boolean partial = partialRun.get()
        int knownFailed = actual.values().sum(0) - unexpected.size()
        println "[harness] tests evaluated: ${total}, passed: ${total - actual.values().sum(0) - skipped.size()}, " +
                "known failures: ${knownFailed}, unexpected failures: ${unexpected.size()}, skipped: ${skipped.size()}" +
                (partial ? ' (partial run: baseline completeness not evaluated)' : '')

        def problems = []
        if (total == 0) {
            problems << 'No test was evaluated. An empty run is not a pass.'
        }
        if (!unexpected.isEmpty()) {
            problems << "Unexpected test failures (${unexpected.size()}):\n  " + unexpected.sort().join('\n  ')
        }
        if (!skipped.isEmpty()) {
            problems << "Skipped tests are not a pass (${skipped.size()}):\n  " + skipped.sort().join('\n  ')
        }
        if (!partial && !fixed.isEmpty()) {
            problems << "Listed as known failure but did not fail (${fixed.size()}). " +
                    "Remove from harness/known-test-failures.txt:\n  " + fixed.sort().join('\n  ')
        }
        if (!problems.isEmpty()) {
            throw new GradleException('[harness] test baseline gate failed.\n' + problems.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyTestBaseline'
}
